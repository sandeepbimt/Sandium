name: Inspect current SANDIUM checkpoint reuse status (read-only)

on:
  push:
    branches:
      - build/sandium-android-debug-apk-2026-10-17
    paths:
      - .github/workflows/poll-circleci-sandium.yml

permissions:
  contents: read

jobs:
  inspect-existing-circleci-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read CircleCI pipeline, workflow and job state (no new build)
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BRANCH: build/sandium-android-debug-apk-2026-10-17
          CIRCLECI_PROJECT_SLUG: circleci/MxDP3UwnZ8Fv5ZWFv14xAJ/QEU7mKkmPf2u4opFnyaxo2
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CIRCLECI_TOKEN" ]]; then
            echo "CIRCLECI_TOKEN is missing"
            exit 1
          fi
          mkdir -p circleci-status
          curl --fail --silent --show-error --get --header "Circle-Token: $CIRCLECI_TOKEN" \
            --data-urlencode "branch=$BRANCH" \
            "https://circleci.com/api/v2/project/$CIRCLECI_PROJECT_SLUG/pipeline" \
            -o circleci-status/pipeline-list.json
          PIPELINE_ID="$(jq -r '.items[0].id // empty' circleci-status/pipeline-list.json)"
          if [[ -z "$PIPELINE_ID" ]]; then
            echo "No CircleCI pipeline found for branch $BRANCH"
            jq . circleci-status/pipeline-list.json
            exit 1
          fi
          echo "INSPECTING_LATEST_BRANCH_PIPELINE=$PIPELINE_ID"
          curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
            "https://circleci.com/api/v2/pipeline/$PIPELINE_ID" -o circleci-status/pipeline.json
          curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
            "https://circleci.com/api/v2/pipeline/$PIPELINE_ID/workflow" -o circleci-status/workflows.json
          echo "=== CIRCLECI PIPELINE ==="
          jq '{id,number,state,created_at,trigger,project_slug,errors,vcs}' circleci-status/pipeline.json
          echo "=== CIRCLECI WORKFLOWS ==="
          jq -r '.items[]? | [.id,.name,.status,.created_at,.stopped_at] | @tsv' circleci-status/workflows.json | tee circleci-status/workflow-summary.tsv
          while IFS="$(printf '\t')" read -r workflow_id workflow_name workflow_status created stopped; do
            if [[ -z "$workflow_id" ]]; then
              continue
            fi
            curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/workflow/$workflow_id/job" \
              -o "circleci-status/jobs-$workflow_id.json"
            echo "=== JOBS: $workflow_name ($workflow_status) ==="
            jq -r '.items[]? | [.name,.status,(.job_number|tostring),(.started_at//""),(.stopped_at//"")] | @tsv' "circleci-status/jobs-$workflow_id.json"
            jq -r '.items[]?.job_number // empty' "circleci-status/jobs-$workflow_id.json" | while read -r job_number; do
              if ! curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
                  "https://circleci.com/api/v2/project/$CIRCLECI_PROJECT_SLUG/job/$job_number" \
                  -o "circleci-status/job-$job_number.json"; then
                echo "JOB_DETAIL_UNAVAILABLE: job=$job_number (typically queued or blocked); continuing."
                continue
              fi
              echo "=== JOB DETAIL: $job_number ==="
              jq '{name,status,started_at,stopped_at,web_url,resource_class,executor}' "circleci-status/job-$job_number.json"
              if curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
                  "https://circleci.com/api/v1.1/project/$CIRCLECI_PROJECT_SLUG/$job_number" \
                  -o "circleci-status/legacy-job-$job_number.json"; then
                jq -r '.steps[]?.actions[]? | select(.has_output == true) | [.step,.name,.output_url] | @tsv' \
                  "circleci-status/legacy-job-$job_number.json" > "circleci-status/output-urls-$job_number.tsv"
                while IFS="$(printf '\t')" read -r step_index step_name output_url; do
                  [[ -n "$output_url" ]] || continue
                  if curl --fail --silent --show-error "$output_url" -o "circleci-status/step-$job_number-$step_index.json"; then
                    echo "=== LAST LOG LINES: job $job_number step $step_index ($step_name) ==="
                    jq -r '.[].message // empty' "circleci-status/step-$job_number-$step_index.json" | tail -n 800
                  else
                    echo "LOG_OUTPUT_UNAVAILABLE: job=$job_number step=$step_index name=$step_name; continuing to collect remaining pipeline state."
                    continue
                  fi
                done < "circleci-status/output-urls-$job_number.tsv"
              else
                echo "Legacy log endpoint unavailable for CircleCI job $job_number"
              fi
            done
          done < circleci-status/workflow-summary.tsv
          # Download the actual compile-window log from CircleCI's job artifacts.
          # Read-only status check for the approved Siso v1.5.25 and cache-v3 build; this workflow never triggers or reruns a build.
          while IFS="$(printf '\t')" read -r workflow_id workflow_name workflow_status created stopped; do
            [[ -n "$workflow_id" ]] || continue
            jq -r '.items[]?.job_number // empty' "circleci-status/jobs-$workflow_id.json" | while read -r job_number; do
              [[ -n "$job_number" ]] || continue
              artifact_json="circleci-status/artifacts-$job_number.json"
              if ! curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
                  "https://circleci.com/api/v2/project/$CIRCLECI_PROJECT_SLUG/$job_number/artifacts" -o "$artifact_json"; then
                echo "ARTIFACT_LIST_UNAVAILABLE: job=$job_number"
                continue
              fi
              jq -r '.items[]? | select(.path | test("compile-window-[1-4]\\.log$|fingerprint\\.json$|args\\.gn$|remote.*log"; "i")) | [.path,.url] | @tsv' "$artifact_json" |
              while IFS="$(printf '\t')" read -r artifact_path artifact_url; do
                [[ -n "$artifact_url" ]] || continue
                safe_name="$(basename "$artifact_path")"
                target="circleci-status/job-$job_number-$safe_name"
                if curl --fail --location --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" "$artifact_url" -o "$target"; then
                  echo "DOWNLOADED_CIRCLECI_ARTIFACT=$artifact_path job=$job_number"
                  if [[ "$safe_name" == compile-window-*.log ]]; then
                    echo "=== BUILD ERROR SUMMARY: job $job_number $safe_name ==="
                    grep -n -Eai 'SANDIUM_BUILD_PHASE_(BEGIN|END|FAILED)|SANDIUM_BUILD_PHASE_ERROR_TYPE|Error:|ERROR:|FATAL|undefined|ELIFECYCLE|ninja: error|FAILED:|remote execution|permission denied|unauthorized|UNAUTHENTICATED|PERMISSION_DENIED|UNAVAILABLE|deadline exceeded|timed out|not found|exit code' "$target" | tail -n 160 || true
                    echo "=== BUILD LOG HEAD: job $job_number $safe_name ==="
                    head -n 100 "$target"
                    echo "=== BUILD LOG TAIL: job $job_number $safe_name ==="
                    tail -n 40 "$target"
                  fi
                else
                  echo "ARTIFACT_DOWNLOAD_UNAVAILABLE: job=$job_number path=$artifact_path"
                fi
              done
            done
          done < circleci-status/workflow-summary.tsv
          echo "NO_NEW_CIRCLECI_PIPELINE_TRIGGERED=true"
          # Keep the diagnostic run alive briefly to observe the current CircleCI
          # pipeline advancing, instead of rapidly re-running this workflow.
          # This is read-only status polling: it never invokes pipeline/run.
          for poll_index in $(seq 1 12); do
            sleep 20
            curl --fail --silent --show-error --get --header "Circle-Token: $CIRCLECI_TOKEN" \
              --data-urlencode "branch=$BRANCH" \
              "https://circleci.com/api/v2/project/$CIRCLECI_PROJECT_SLUG/pipeline" \
              -o circleci-status/live-pipeline-list.json
            LIVE_PIPELINE_ID="$(jq -r '.items[0].id // empty' circleci-status/live-pipeline-list.json)"
            if [[ -z "$LIVE_PIPELINE_ID" ]]; then
              echo "LIVE_POLL=$poll_index NO_PIPELINE_FOUND"
              continue
            fi
            curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/pipeline/$LIVE_PIPELINE_ID" \
              -o circleci-status/live-pipeline.json
            curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/pipeline/$LIVE_PIPELINE_ID/workflow" \
              -o circleci-status/live-workflows.json
            {
              echo "poll_index=$poll_index pipeline_id=$LIVE_PIPELINE_ID"
              jq -r '.items[]? | [.id,.name,.status] | @tsv' circleci-status/live-workflows.json
            } | tee "circleci-status/live-poll-$poll_index.txt"
            rm -f circleci-status/live-job-summary.tsv
            while IFS="$(printf '\t')" read -r live_workflow_id live_workflow_name live_workflow_status; do
              [[ -n "$live_workflow_id" ]] || continue
              live_jobs="circleci-status/live-jobs-$live_workflow_id.json"
              if ! curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" \
                  "https://circleci.com/api/v2/workflow/$live_workflow_id/job" -o "$live_jobs"; then
                echo "LIVE_JOB_LIST_UNAVAILABLE workflow=$live_workflow_name"
                continue
              fi
              jq -r '.items[]? | [.name,.status,(.job_number|tostring)] | @tsv' "$live_jobs" \
                >> circleci-status/live-job-summary.tsv
            done < <(jq -r '.items[]? | [.id,.name,.status] | @tsv' circleci-status/live-workflows.json)
            cat circleci-status/live-job-summary.tsv
            if awk -F '\t' '$1=="stage-2-graph-and-compile-window" && ($2=="running" || $2=="success" || $2=="failed" || $2=="error" || $2=="canceled") {found=1} END {exit !found}' circleci-status/live-job-summary.tsv; then
              echo "LIVE_POLL_STOP_REASON=stage-2-started-or-finished"
              break
            fi
            if awk -F '\t' '$1=="stage-1-source-foundation" && ($2=="failed" || $2=="error" || $2=="canceled") {found=1} END {exit !found}' circleci-status/live-job-summary.tsv; then
              echo "LIVE_POLL_STOP_REASON=stage-1-failed"
              break
            fi
          done
      - name: Save inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circleci-sandium-checkpoint-reuse-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: circleci-status/
          if-no-files-found: ignore

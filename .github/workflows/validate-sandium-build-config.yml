name: Validate SANDIUM five-stage CI

on:
  push:
    branches:
      - build/sandium-android-debug-apk-2026-10-17
      - fix/dynamic-chromium-version-and-cache-v1
    paths:
      - ".circleci/config.yml"
      - ".github/workflows/validate-sandium-build-config.yml"
      - "ci/siso/**"
      - "ci/pins/**"
      - "ci/smoke/**"
      - "tests/ci/**"
      - "build/commands/lib/build.ts"
      - "build/commands/lib/util.ts"
      - "build/commands/lib/config.ts"
      - "build/commands/lib/syncUtils.ts"

permissions:
  contents: read

jobs:
  validate:
    name: CircleCI config and embedded script checks (no APK build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install local validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck zstd
          curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh -o /tmp/install-circleci-cli.sh
          sudo bash /tmp/install-circleci-cli.sh
          circleci version
          shellcheck --version

      - name: Validate CircleCI schema (no pipeline execution)
        shell: bash
        run: |
          set -euo pipefail
          circleci config validate .circleci/config.yml

      - name: Check five-stage contract and embedded syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          path = Path(".circleci/config.yml")
          raw = path.read_text()
          config = yaml.safe_load(raw)
          bad_heredocs = [
              line for line in raw.splitlines()
              if ("python3 - <<'PY'" in line or "python - <<'PY'" in line or "python3 - <<'BUILD'" in line)
          ]
          if bad_heredocs:
              raise SystemExit(
                  "CircleCI heredoc markers must escape << as \\<<; found: "
                  + repr(bad_heredocs)
              )

          expected_jobs = [
              "stage-1-source-foundation",
              "stage-2-graph-and-compile-window",
              "stage-3-compile-continuation",
              "stage-4-finish-and-package",
              "stage-5-verify-publish",
          ]
          smoke_jobs = [
              "smoke-1-contract-and-foundation",
              "smoke-2-build-state-tests",
              "smoke-3-handover-continuity",
              "smoke-4-cache-and-artifact-contract",
              "smoke-5-independent-handover-verification",
          ]
          jobs = list(config.get("jobs", {}))
          if jobs[:5] != expected_jobs:
              raise SystemExit(f"Mode 2 full-build jobs/order changed: {jobs[:5]}")
          if jobs[5:] != smoke_jobs:
              raise SystemExit(f"Expected the five isolated smoke jobs after the unchanged full-build jobs; got {jobs[5:]}")
          if re.search(r"source-cache-only-test|run_sandium_source_cache_test", raw):
              raise SystemExit("Abandoned source-cache-only experiment remains in the active config")
          parameter = config.get("parameters", {}).get("run_sandium_android_apk_build", {})
          if parameter.get("default") is not False:
              raise SystemExit("APK build parameter must remain disabled by default")
          smoke_parameter = config.get("parameters", {}).get("run_sandium_ci_smoke_test", {})
          if smoke_parameter.get("default") is not False:
              raise SystemExit("Lightweight smoke mode must remain opt-in by default")

          workflow = config.get("workflows", {}).get("sandium-android-debug-apk", {})
          expected_full_gate = {
              "and": [
                  "<< pipeline.parameters.run_sandium_android_apk_build >>",
                  "<< pipeline.parameters.run_sandium_compile_windows >>",
              ]
          }
          if workflow.get("when") != expected_full_gate:
              raise SystemExit("The five-stage APK workflow must require explicit full-build and compile-window opt-ins")
          preflight = config.get("workflows", {}).get("sandium-android-preflight", {})
          expected_preflight_gate = {
              "and": [
                  "<< pipeline.parameters.run_sandium_android_apk_build >>",
                  {"not": "<< pipeline.parameters.run_sandium_compile_windows >>"},
              ]
          }
          if preflight.get("when") != expected_preflight_gate:
              raise SystemExit("The real-build preflight must run only when compile windows are explicitly disabled")
          preflight_jobs = preflight.get("jobs", [])
          preflight_names = [item if isinstance(item, str) else next(iter(item)) for item in preflight_jobs]
          if preflight_names != expected_jobs[:2]:
              raise SystemExit(f"Preflight must run exactly stages 1-2, not compile stages: {preflight_names}")
          preflight_source = str(config["jobs"]["stage-2-graph-and-compile-window"])
          if "SANDIUM_PREFLIGHT_ONLY=true" not in preflight_source or "COMPILE_WINDOW_1_SKIPPED_BY_EXPLICIT_SAFETY_GATE=true" not in preflight_source:
              raise SystemExit("Stage 2 lacks the compile-disabled preflight gate")
          if "run_sandium_compile_windows:" not in raw:
              raise SystemExit("The explicit compile-window safety parameter is missing")
          workflow_jobs = workflow.get("jobs", [])
          names = [item if isinstance(item, str) else next(iter(item)) for item in workflow_jobs]
          if names != expected_jobs:
              raise SystemExit(f"Workflow order does not match the five-stage design: {names}")

          # Verify required handoffs instead of accepting five unrelated jobs.
          requires = {
              "stage-2-graph-and-compile-window": "stage-1-source-foundation",
              "stage-3-compile-continuation": "stage-2-graph-and-compile-window",
              "stage-4-finish-and-package": "stage-3-compile-continuation",
              "stage-5-verify-publish": "stage-4-finish-and-package",
          }
          for job, upstream in requires.items():
              refs = config["jobs"].get(job, {}).get("requires", [])
              workflow_ref = next((item for item in workflow_jobs if isinstance(item, dict) and job in item), None)
              if workflow_ref is None or workflow_ref[job].get("requires") != [upstream]:
                  raise SystemExit(f"Wrong dependency edge for {job}; expected after {upstream}")

          smoke_workflow = config.get("workflows", {}).get("sandium-ci-smoke-test", {})
          if smoke_workflow.get("when") != "<< pipeline.parameters.run_sandium_ci_smoke_test >>":
              raise SystemExit("Smoke workflow must be separately gated by its own opt-in parameter")
          smoke_workflow_jobs = smoke_workflow.get("jobs", [])
          smoke_names = [item if isinstance(item, str) else next(iter(item)) for item in smoke_workflow_jobs]
          if smoke_names != smoke_jobs:
              raise SystemExit(f"Smoke workflow stage order changed: {smoke_names}")
          smoke_requires = {
              "smoke-2-build-state-tests": "smoke-1-contract-and-foundation",
              "smoke-3-handover-continuity": "smoke-2-build-state-tests",
              "smoke-4-cache-and-artifact-contract": "smoke-3-handover-continuity",
              "smoke-5-independent-handover-verification": "smoke-4-cache-and-artifact-contract",
          }
          for job, upstream in smoke_requires.items():
              workflow_ref = next((item for item in smoke_workflow_jobs if isinstance(item, dict) and job in item), None)
              if workflow_ref is None or workflow_ref[job].get("requires") != [upstream]:
                  raise SystemExit(f"Wrong smoke handover dependency for {job}; expected after {upstream}")
          smoke_source = str({name: config["jobs"][name] for name in smoke_jobs})
          smoke_command_source = str(config.get("commands", {}).get("sandium-smoke-checkpoint", {}))
          smoke_helper_source = Path("ci/smoke/checkpoint.py").read_text()
          for forbidden in ("pnpm run sync", "pnpm run build Debug", "restore-sandium-source", "configure-sandium-remote-cache", "timeout --signal=INT"):
              if forbidden in smoke_source or forbidden in smoke_command_source:
                  raise SystemExit(f"Smoke mode must not invoke heavy build work: found {forbidden}")
          if "sandium-smoke-checkpoint" not in config.get("commands", {}):
              raise SystemExit("Smoke mode lacks its stage handover/checkpoint command")
          if "production_apk_created" not in smoke_helper_source or "SANDIUM_SMOKE_FIVE_STAGE_HANDOVER=PASS" not in smoke_helper_source:
              raise SystemExit("Smoke mode must prove five-stage handovers without claiming a production APK")

          source_text = str(config["jobs"]["stage-1-source-foundation"])
          if "--no-history" not in source_text or "save_cache" not in source_text or "SOURCE_CACHE_BYTES=" not in raw:
              raise SystemExit("Stage 1 must sync pinned source and record a validated cache save")
          if "Validate fingerprint, configure GN and compile window 1" not in source_text or "checkpoint.py pack --root" not in source_text:
              raise SystemExit("Stage 1 must compile window 1 and save a reusable checkpoint")
          if "build_state.py fingerprint" not in raw:
              raise SystemExit("GN inputs are not fingerprinted by the shared build-state helper")
          if "restore-sandium-apk-cache" not in raw or "sandium-apk-v4-" not in raw or "VERIFIED_APK_CACHE=HIT" not in raw:
              raise SystemExit("A validated, reusable APK cache must be checked before build setup in every stage")
          if "CIRCLE_SHA1" not in raw or "APK_SHA256=" not in raw or "APK_SIGNATURE_VERIFICATION=PASS" not in Path("ci/siso/package_apk.py").read_text():
              raise SystemExit("Revision pinning or APK verification evidence is missing")
          if raw.count("package_apk.py --commit") < 5:
              raise SystemExit("All five stages must package an APK immediately when it appears")
          if "build-state.json" not in raw or "APK_ARTIFACT_VERIFIED=true" not in raw:
              raise SystemExit("The verified APK cache is missing its integrity state and manifest")
          if "use_siso:true" not in raw or "use_reclient:false" not in raw or "--use_remoteexec true" not in raw:
              raise SystemExit("Compile commands must explicitly enable remote execution and Siso, and disable reclient")
          if "src/out/android_Debug_arm64/args.gn" not in raw or "src/out/Debug/args.gn" in raw:
              raise SystemExit("GN output path does not match Brave's Android ARM64 Debug output directory")
          stage2_steps = config["jobs"]["stage-2-graph-and-compile-window"]["steps"]
          def run_step_index(steps, name):
              return next((i for i, step in enumerate(steps)
                           if isinstance(step, dict)
                           and isinstance(step.get("run"), dict)
                           and step["run"].get("name") == name), -1)
          stage2_generator_index = next((i for i, step in enumerate(stage2_steps)
                                         if step == "generate-sandium-brave-version-gni"
                                         or (isinstance(step, dict) and "generate-sandium-brave-version-gni" in step)), -1)
          prepare_index = run_step_index(stage2_steps, "Prepare source overlay and branding before GN")
          if stage2_generator_index < 0 or prepare_index < 0 or stage2_generator_index >= prepare_index:
              raise SystemExit("Stage 2 must generate and validate Brave version.gni before the first GN invocation")
          prepare_guard = stage2_steps[prepare_index]["run"]["command"]
          required_gn_guard_fragments = (
              'GENERATED_ARGS="$OUT/args_generated.gni"',
              'import("//out/android_Debug_arm64/args_generated.gni")',
              'GN_PREPARE_ARG_SOURCE=ARGS_GENERATED_GNI_IMPORTED',
              'use_siso',
              'use_reclient',
              'use_remoteexec',
              '"$GENERATED_ARGS"',
          )
          if not all(fragment in prepare_guard for fragment in required_gn_guard_fragments):
              raise SystemExit("Stage 2 must validate Siso/remoteexec values from args_generated.gni imported by args.gn, not grep args.gn for values it does not contain")
          if "build_state.py record" not in raw or "SISO_REMOTE_BACKEND_PROVEN" not in raw:
              raise SystemExit("Resumable build-state checkpoint or honest Siso metrics reporting is missing")
          if (
              "restore-sandium-build-output" not in raw
              or "REFUSING_COLD_REBUILD_IN_CONTINUATION_STAGE=true" not in raw
              or raw.count("checkpoint.py pack --root") != 5
              or raw.count("sandium-checkpoint-v5-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-") < 5
          ):
              raise SystemExit("Every stage must checkpoint its output; stages 2–5 must restore and validate their immediate predecessor or fail closed")
          if "sandium-pnpm-v1-" not in raw or "src/brave/node_modules" not in raw:
              raise SystemExit("Pinned Node dependencies do not have a reusable cross-run cache")
          if "circleci-agent step halt" not in raw:
              raise SystemExit("A completed APK must short-circuit unnecessary later-stage work")
          package_helper = Path("ci/siso/package_apk.py").read_text()
          if "apksigner" not in package_helper or "APK_SIGNATURE_VERIFICATION=PASS" not in package_helper:
              raise SystemExit("Final APK signature verification is missing from the package helper")
          if 'choices=("stage-1", "stage-2", "stage-3", "stage-4", "stage-5")' not in package_helper:
              raise SystemExit("APK packaging helper must accept a verified APK produced in Stage 5")
          compile_windows = re.findall(r'timeout --signal=INT --kill-after=30s "\$\{remaining_compile_seconds\}s" pnpm run build', raw)
          if len(compile_windows) != 5:
              raise SystemExit(f"Expected five dynamically bounded compile windows (stages 1-5); got {len(compile_windows)}")
          if "APK_NOT_YET_AVAILABLE_AFTER_FIVE_STAGE_WINDOWS=true" not in raw:
              raise SystemExit("Stage 5 must explicitly report if the APK is still missing")
          if config["jobs"]["stage-5-verify-publish"].get("resource_class") != "large":
              raise SystemExit("Stage 5 must use the large runner for the final compile window")
          if raw.count("Include verified APK in downloadable") < 5:
              raise SystemExit("Every stage with a compile window must expose an APK artifact if it appears")
          if raw.count("remaining_compile_seconds=2400") < 5:
              raise SystemExit("Every compile stage must reserve handover time while allowing a 40-minute compile window")
          if raw.count("Start stage budget clock before restoration and handover") != 5:
              raise SystemExit("All five stages must start their budget clock before cache/checkout handover")
          if "sandium-src-v6-{{ .Branch }}-" not in raw or "CHROMIUM_SOURCE_CACHE_EXCLUDES_BRAVE_CORE=true" not in raw or "CHROMIUM_UPDATE_POLICY=MANUAL_PIN" not in raw:
              raise SystemExit("Chromium source cache must use the explicit manual pin and exclude the separate Brave Core checkout")
          pins = [line.strip() for line in Path("ci/pins/chromium-tag.txt").read_text().splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(pins) != 1 or not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", pins[0]):
              raise SystemExit("Manual Chromium pin must be exactly one four-part numeric tag")
          writer_source = Path("ci/siso/write_buildbuddy_env.py").read_text()
          config_source = Path("build/commands/lib/config.ts").read_text()
          sync_source = Path("build/commands/lib/syncUtils.ts").read_text()
          pin_helper = Path("ci/siso/chromium_pin.py").read_text()
          if "sandium_chromium_tag={chromium_tag}" not in writer_source or config_source.count("getString(['sandium_chromium_tag'])") < 2 or config_source.count("return manualChromiumTag") != 1:
              raise SystemExit("Manual Chromium pin is not controlling both the reported version and actual source reference")
          if "gclientTimestamp" in sync_source or "gclientHash: getGclientConfigHash()" not in sync_source:
              raise SystemExit("Chromium sync decision must hash gclient content rather than unstable mtimes")
          if "MIGRATED_TIMESTAMP_TO_CONTENT_HASH" not in pin_helper or "SOURCE_CACHE_FINGERPRINT=PASS" not in pin_helper:
              raise SystemExit("Verified cached Chromium source does not have a safe legacy sync-metadata fast path")
          if 'python3 ci/siso/chromium_pin.py --workspace "$HOME/project"' not in raw:
              raise SystemExit("Stage 1 does not run the offline manual-pin cache fast path")
          if '"manual_chromium_pin": tag' not in raw:
              raise SystemExit("Saved source-cache manifest does not record the approved manual Chromium pin")
          stage2_steps = config["jobs"]["stage-2-graph-and-compile-window"]["steps"]
          def step_run(steps, name):
              return next((step.get("run", {}) for step in steps
                           if isinstance(step, dict)
                           and isinstance(step.get("run"), dict)
                           and step["run"].get("name") == name), None)
          def step_index(steps, key_or_run_name):
              return next((i for i, step in enumerate(steps)
                           if step == key_or_run_name or (
                               isinstance(step, dict) and (
                                   key_or_run_name in step or (
                                       isinstance(step.get("run"), dict)
                                       and step["run"].get("name") == key_or_run_name
                                   )))), -1)
          deps_index = step_index(stage2_steps, "Rehydrate Brave Core DEPS and run hooks without refreshing pinned Chromium")
          generator_index = step_index(stage2_steps, "generate-sandium-brave-version-gni")
          prepare_index = step_index(stage2_steps, "Prepare source overlay and branding before GN")
          compile_index = step_index(stage2_steps, "Compile window 2 using same target and remote action cache")
          if not (0 <= deps_index < generator_index < prepare_index < compile_index):
              raise SystemExit("Stage 2 must sync Brave-owned DEPS, generate version.gni, prepare GN inputs, then compile")
          deps_block = step_run(stage2_steps, "Rehydrate Brave Core DEPS and run hooks without refreshing pinned Chromium")["command"]
          for required in (
              "--require-reusable",
              "--sync_chromium=false",
              "SANDIUM_CHROMIUM_PIN_PRESERVATION=PASS",
              "SANDIUM_GCLIENT_MANIFEST_MATCH=PASS",
              "SANDIUM_SOURCE_MANIFEST_MATCH=PASS",
              "src/brave/vendor/bat-native-tweetnacl/BUILD.gn",
          ):
              if required not in deps_block:
                  raise SystemExit(f"Stage 2 Brave DEPS restoration is missing guard: {required}")
          version_command = config.get("commands", {}).get("generate-sandium-brave-version-gni", {})
          version_block = str(version_command)
          if "python3 build/util/version.py gen ../chrome/VERSION" not in version_block or "test -s build/version.gni" not in version_block or "SANDIUM_BRAVE_VERSION_GNI=GENERATED" not in version_block:
              raise SystemExit("Shared prerequisite must generate and validate Brave version.gni using Brave's version script")
          for stage_name in (
              "stage-2-graph-and-compile-window",
              "stage-3-compile-continuation",
              "stage-4-finish-and-package",
              "stage-5-verify-publish",
          ):
              stage_steps = config["jobs"][stage_name]["steps"]
              gen_index = step_index(stage_steps, "generate-sandium-brave-version-gni")
              if gen_index < 0:
                  raise SystemExit(f"{stage_name} is missing the version.gni prerequisite")
              for i, step in enumerate(stage_steps):
                  if isinstance(step, dict) and isinstance(step.get("run"), dict):
                      cmd = step["run"].get("command", "")
                      if "pnpm run build Debug" in cmd and i <= gen_index:
                          raise SystemExit(f"{stage_name} invokes GN/build before version.gni is generated")
          pin_helper_source = Path("ci/siso/chromium_pin.py").read_text()
          if '"--require-reusable"' not in pin_helper_source or "CHROMIUM_REUSE_REQUIRED_FAILED=true" not in pin_helper_source:
              raise SystemExit("Stage 2 must fail closed instead of allowing an unintended Chromium refresh")
          if "PINNED_CHROMIUM_VERSION" in Path("ci/siso/build_state.py").read_text() or "CHROMIUM_VERSION_PIN" in Path("ci/siso/package_apk.py").read_text():
              raise SystemExit("A fixed Chromium version remains in a build-state or APK verification helper")
          if "156.1.100.0" in raw or "156.0.8078.39" in raw:
              raise SystemExit("The active CircleCI config must not hard-code a Chromium release version")
          state_source = Path("ci/siso/build_state.py").read_text()
          package_source = Path("ci/siso/package_apk.py").read_text()
          if '--exact-match' not in state_source or '--exact-match' not in package_source:
              raise SystemExit("Build-state and APK verification must use the synced Chromium source tag")
          build_impl = Path("build/commands/lib/build.ts").read_text()
          util_impl = Path("build/commands/lib/util.ts").read_text()
          for phase in ("touch-overridden-chromium-files", "update-branding", "generate-ninja-files", "build-targets-siso-autoninja"):
              if phase not in build_impl:
                  raise SystemExit(f"Missing phase-level build diagnostics: {phase}")
          if "SANDIUM_BUILD_PHASE_FAILED=" not in build_impl:
              raise SystemExit("Build-phase failure details are not logged")
          delete_helper = util_impl.split("function deleteFileIfOverrideIsNewer(", 1)[1].split("\nfunction getAdditionalGenLocation()", 1)[0]
          if "process.exit(1)" in delete_helper or "Unable to remove stale generated output" not in delete_helper:
              raise SystemExit("Stale generated-output cleanup can still exit without preserving the error")
          if "fs.rmSync(original, { recursive: true, force: true })" not in delete_helper:
              raise SystemExit("Stale generated-output directories are not safely removed")
          if "src/brave/src" in raw:
              raise SystemExit("Incorrect nested Chromium source path remains in the CircleCI config")
          if "timeout --signal=INT --kill-after=30s 32m pnpm run sync" not in raw:
              raise SystemExit("Stage 1 source sync must be time-bounded to preserve handover time")
          if raw.count("no_output_timeout: 45m") != 5
              raise SystemExit("All five compile stages must permit up to 45 minutes without output before the no-output guard")

          command_blocks = []
          def walk(value, label="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "command" and isinstance(child, str):
                          command_blocks.append((label + ".command", child))
                      else:
                          walk(child, label + "." + str(key))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{label}[{index}]")
          walk(config)

          # CircleCI requires escaped heredoc openers in this config; normalize them only for
          # local shell/Python syntax analysis. Never execute an embedded command.
          python_heredoc = re.compile(
              r"(?ms)^(?P<start>[^\n]*\\?python3?[^\n]*?\\?<<['\"]?PY['\"]?[ \t]*\n)"
              r"(?P<body>.*?)^[ \t]*PY[ \t]*$"
          )
          build_heredoc = re.compile(
              r"(?ms)^[^\n]*\\?<<['\"]?BUILD['\"]?[ \t]*\n"
              r"(?P<body>.*?)^[ \t]*BUILD[ \t]*$"
          )

          counts = {"shell": 0, "python": 0}
          seen_scripts = set()

          def syntax_check(label, source):
              source = source.replace("\\\\<<", "<<").replace("\\<<", "<<")
              # Validate generated bash scripts nested inside cat-heredocs separately.
              for idx, match in enumerate(build_heredoc.finditer(source), 1):
                  syntax_check(label + f".generated-BUILD-{idx}", match.group("body"))

              def remove_python(match):
                  try:
                      ast.parse(match.group("body"))
                      counts["python"] += 1
                  except SyntaxError as error:
                      raise SystemExit(f"Embedded Python syntax error in {label}: {error}")
                  return match.group("start") + "# embedded Python checked separately\nPY"

              shell = python_heredoc.sub(remove_python, source)
              with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as handle:
                  handle.write(shell + "\n")
                  shell_path = Path(handle.name)
              try:
                  bash = subprocess.run(["bash", "-n", str(shell_path)], text=True, capture_output=True)
                  if bash.returncode:
                      raise SystemExit(f"Bash syntax error in {label}:\n{bash.stderr}")
                  lint = subprocess.run(
                      ["shellcheck", "--shell=bash", "--severity=error", str(shell_path)],
                      text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
                  )
                  if lint.returncode:
                      raise SystemExit(f"ShellCheck error in {label}:\n{lint.stdout}")
                  counts["shell"] += 1
              finally:
                  shell_path.unlink(missing_ok=True)

          for label, command in command_blocks:
              if label in seen_scripts:
                  continue
              seen_scripts.add(label)
              syntax_check(label, command)

          print("FIVE_STAGE_CONTRACT=PASS")
          print(f"EMBEDDED_PYTHON_BLOCKS_SYNTAX_CHECKED={counts['python']}")
          print(f"SHELL_COMMANDS_SYNTAX_CHECKED={counts['shell']}")
          print("APK_BUILD=NOT_RUN")
          PY

      - name: Run offline Siso and resumable-output unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/siso/build_state.py ci/siso/package_apk.py ci/siso/write_buildbuddy_env.py ci/siso/chromium_pin.py ci/siso/checkpoint.py
          python3 tests/ci/test_siso_buildbuddy_config.py
          python3 tests/ci/test_siso_build_state.py
          python3 tests/ci/test_chromium_pin.py
          python3 tests/ci/test_siso_checkpoint.py

name: Validate Bare APK pipeline (no Chromium build)

on:
  push:
    branches:
      - fix/bare-stage-handoff-review
    paths:
      - ".circleci/config.yml"
      - ".github/workflows/validate-bare-stage-pipeline.yml"
      - "ci/bare/**"
      - "ci/siso/**"
  pull_request:
    branches:
      - fix/bare-stage-handoff-review
    paths:
      - ".circleci/config.yml"
      - ".github/workflows/validate-bare-stage-pipeline.yml"
      - "ci/bare/**"
      - "ci/siso/**"

permissions:
  contents: read

concurrency:
  group: validate-bare-stage-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source, cache discovery and stage handoff (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check shell syntax and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in ci/bare/run_stage.sh ci/bare/bootstrap_chromium.sh ci/bare/prepare_source.sh ci/bare/package_artifact.sh; do
            bash -n "$script"
            echo "BASH_SYNTAX=PASS file=$script"
          done
          python3 -m py_compile ci/bare/*.py
          echo "PYTHON_SYNTAX=PASS"

      - name: Run offline identity, handoff and stage-contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/bare/test_build_identity.py
          python3 ci/bare/test_stage_ledger.py
          python3 ci/bare/test_state_handoff.py
          python3 ci/bare/stage_contract.py

      - name: Assert prior-run lookup and mandatory stage handoff are wired before sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          config = Path(".circleci/config.yml").read_text()
          runner = Path("ci/bare/run_stage.sh").read_text()
          bootstrap = Path("ci/bare/bootstrap_chromium.sh").read_text()
          handoff = Path("ci/bare/state_handoff.py").read_text()

          required_config = (
              "Discover the latest useful run with matching Bare build inputs",
              "sandium-siso-state-v1-",
              "sandium-bare-apk-required:",
              "APK_SIGNATURE_VERIFIED=true",
              'checksum "sandium-control/ci/bare/state_handoff.py"',
          )
          for fragment in required_config:
              assert fragment in config, "CircleCI config missing: " + fragment

          assert "run_sandium_bare_apk_once" in config
          assert "equal: [build/bare-apk-once-20261025, << pipeline.git.branch >>]" in config, "expensive APK workflow must be isolated to the dedicated build branch"
          assert "equal: [fix/bare-stage-handoff-review, << pipeline.git.branch >>]" not in config, "review branch must not be eligible for the expensive APK workflow"
          assert "sandium-bare-v1-" not in config, "final APK gate still uses the obsolete cache namespace"
          final_gate = config.split("  sandium-bare-apk-required:", 1)[1].split("\\n\\nworkflows:", 1)[0]
          assert final_gate.index("- checkout:") < final_gate.index("- restore_cache:"), "final gate must checkout sandium-control before computing cache checksums"
          assert "python3 \"$STATE_TOOL\" preflight" in runner, "handoff preflight is not called"
          assert runner.index(" preflight --root ") < runner.index('bash "$CONTROL/ci/bare/bootstrap_chromium.sh" source'), "handoff preflight must happen before Chromium source sync"
          assert "SANDIUM_STATE_HANDOFF_PREFLIGHT=PASS" in handoff
          assert "SANDIUM_STATE_HANDOFF=RESTORED" in handoff
          assert "SANDIUM_STATE_HANDOFF_PACK=PASS" in handoff
          assert "stage_ledger_sha256" in handoff
          assert "control_input_hash_mismatch" in handoff
          assert '(cd "$CHROMIUM_SRC" && sudo ./build/install-build-deps.sh --android)' in bootstrap, "Android dependency installer must run from Chromium source root"
          assert 'test -s "$CHROMIUM_SRC/.gn"' in bootstrap, "Chromium .gn root marker must be checked before package install"
          assert "sandium-bare-checkpoint.tar.zst" not in config, "full Chromium output checkpoint must not be stored in CircleCI cache"
          print("PRIOR_USEFUL_RUN_DISCOVERY=WIRED")
          print("STAGE_TO_STAGE_STATE_HANDOFF=REQUIRED")
          print("GN_SOURCE_ROOT_FIX=WIRED")
          print("CIRCLECI_CACHE_POLICY=SMALL_STATE_CAPSULE_AND_VERIFIED_APK_ONLY")
          PY

      - name: Validate CircleCI configuration schema (configuration only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh -o /tmp/install-circleci-cli.sh
          sudo bash /tmp/install-circleci-cli.sh
          circleci config validate .circleci/config.yml
          echo "CIRCLECI_CONFIG_SCHEMA=PASS"

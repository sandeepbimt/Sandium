name: Validate Bare APK pipeline (no Chromium build)

on:
  push:
    branches:
      - build/bare-apk-once-20261025
      - fix/bare-stage-handoff-review
      - fix/bare-pipeline-reuse-repair-20261026
      - fix/bare-credential-helper-exec-20261026
      - fix/manifest-regeneration-continuation-20261026
      - fix/green-checkpoint-cache-selection-20261026
    paths:
      - ".circleci/config.yml"
      - ".github/workflows/validate-bare-stage-pipeline.yml"
      - "ci/bare/**"
      - "ci/siso/**"
  pull_request:
    branches:
      - build/bare-apk-once-20261025
    paths:
      - ".circleci/config.yml"
      - ".github/workflows/validate-bare-stage-pipeline.yml"
      - "ci/bare/**"
      - "ci/siso/**"

permissions:
  contents: read

concurrency:
  group: validate-bare-stage-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate full-output checkpoint handoff (no Chromium build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check shell syntax and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in ci/bare/run_stage.sh ci/bare/bootstrap_chromium.sh ci/bare/prepare_source.sh ci/bare/package_artifact.sh; do
            bash -n "$script"
            echo "BASH_SYNTAX=PASS file=$script"
          done
          python3 -m py_compile ci/bare/*.py ci/siso/*.py
          echo "PYTHON_SYNTAX=PASS"

      - name: Run offline identity, cache, artifact and stage-contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/bare/test_build_identity.py
          python3 ci/bare/test_stage_ledger.py
          python3 ci/bare/test_state_handoff.py
          python3 ci/bare/test_output_checkpoint.py
          python3 ci/bare/test_fast_apk.py
          python3 ci/bare/test_siso_output_path_guard.py
          python3 ci/bare/test_manifest_preflight.py
          python3 ci/bare/test_normalize_progress_total.py
          python3 ci/bare/test_checkpoint_quality.py
          python3 ci/bare/test_output_cache_fingerprint.py
          python3 ci/bare/stage_contract.py

      - name: Assert cache layers, fast APK exit and five-stage continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          config = Path(".circleci/config.yml").read_text(encoding="utf-8")
          runner = Path("ci/bare/run_stage.sh").read_text(encoding="utf-8")
          manifest_preflight = Path("ci/bare/manifest_preflight.py").read_text(encoding="utf-8")
          checkpoint_quality = Path("ci/bare/checkpoint_quality.py").read_text(encoding="utf-8")
          bootstrap = Path("ci/bare/bootstrap_chromium.sh").read_text(encoding="utf-8")
          handoff = Path("ci/bare/state_handoff.py").read_text(encoding="utf-8")
          checkpoint = Path("ci/bare/output_checkpoint.py").read_text(encoding="utf-8")
          fast_apk = Path("ci/bare/fast_apk.py").read_text(encoding="utf-8")
          build_fingerprint = Path("ci/bare/cache_fingerprint.py").read_text(encoding="utf-8")
          output_fingerprint = Path("ci/bare/output_cache_fingerprint.py").read_text(encoding="utf-8")
          source_fingerprint = Path("ci/bare/source_cache_fingerprint.py").read_text(encoding="utf-8")
          credential_helper = Path("ci/siso/buildbuddy-credential-helper.py")

          assert credential_helper.exists(), "BuildBuddy credential helper must be present"
          assert "chmod 0755 \"$CREDENTIAL_HELPER\"" in bootstrap, "bootstrap must normalize helper permissions before Siso configuration"
          assert "chmod 0755 ci/siso/buildbuddy-credential-helper.py" in config, "preflight must normalize helper permissions before checking them"
          assert "SANDIUM_CREDENTIAL_HELPER_EXECUTABLE=PASS" in config
          assert "not executable" in Path("ci/bare/configure_siso.py").read_text(encoding="utf-8")

          assert "run_sandium_bare_apk_once:" in config
          assert re.search(r"run_sandium_bare_apk_once:\s+type:\s+boolean\s+default:\s+false", config), "expensive build opt-in must default to false"
          assert "equal: [build/bare-apk-once-20261025, << pipeline.git.branch >>]" in config
          assert "- << pipeline.parameters.run_sandium_bare_apk_once >>" in config
          assert "default: true" not in config
          assert "sandium-source-v3-" in config and "sandium-source-cache-fingerprint.txt" in config
          assert "sandium-source-v2-" in config, "legacy source-cache prefix fallback must preserve the previously saved cache"
          assert "sandium-state-good-v4-" in config and "sandium-output-good-v5-" in config
          assert "sandium-verified-apk-v1-" in config
          assert "sandium-state-v3-{{ checksum \"sandium-control/.sandium-cache-fingerprint.txt\" }}-stage-1-" in config
          legacy_output_key = "sandium-output-v3-McWgpQGHbvqEhFrJMdzVRrgSxHmI0HTzIzAXcMFauVo=-stage-1-"
          assert legacy_output_key in config, "the known-good legacy Stage 1 output checkpoint must remain reachable"
          for failed_stage in (2, 3, 4, 5):
              assert f"sandium-output-v3-McWgpQGHbvqEhFrJMdzVRrgSxHmI0HTzIzAXcMFauVo=-stage-{failed_stage}-" not in config
              assert f"sandium-state-v3-{{{{ checksum \"sandium-control/.sandium-cache-fingerprint.txt\" }}}}-stage-{failed_stage}-" not in config
          assert "Save only a quality-validated green compiled-output checkpoint for reuse" in config
          assert "Save only successful stage metadata and state capsule for future selection" in config

          # A later stage must only read its immediate predecessor's per-workflow
          # ledger. Do not allow an unrelated previous-run stage ledger to win the
          # prefix search and leave PREV_LEDGER missing/wrong for run_stage.sh.
          for predecessor in range(1, 5):
              marker = f"name: Restore Stage {predecessor} APK/status metadata"
              start = config.index(marker)
              ends = [
                  index for token in ("      - when:", "      - restore_cache:", "      - run:")
                  if (index := config.find(token, start + len(marker))) >= 0
              ]
              end = min(ends)
              block = config[start:end]
              state_keys = [line for line in block.splitlines() if "sandium-state-good-v4-" in line]
              expected = f"-stage-{predecessor}-{{{{ .Environment.CIRCLE_WORKFLOW_ID }}}}-"
              assert len(state_keys) == 1 and expected in state_keys[0], (
                  f"stage {predecessor + 1} must restore only its immediate prior stage state"
              )
          assert "Persist the lightweight current-stage APK and ledger state" not in config, "state cache must not be written before the stage executes"
          assert "<<'PY'" not in config, "CircleCI config must not contain raw Python heredocs"
          assert "sandium-build-output-checkpoint" in config
          assert "teardown:" in config and "circleci-agent step halt" in config
          fast_step = config.index("name: Reuse a verified APK before restoring the multi-gigabyte build output")
          large_restore = config.index("Restore the best green validated compiled-output checkpoint")
          assert fast_step < large_restore, "APK fast-path check must precede large output restore"
          build_step = config.index("Build one bounded incremental window")
          good_output_save = config.index("Save only a quality-validated green compiled-output checkpoint for reuse")
          good_state_save = config.index("Save only successful stage metadata and state capsule for future selection")
          assert good_output_save > build_step and good_state_save > build_step, "successful-stage caches must be written only after the build"
          for save_name in (good_output_save, good_state_save):
              assert "when: on_success" in config[save_name:save_name+350], "failed stages must not publish reusable cache keys"
          assert config.index("Compute the build cache fingerprint before final artifact restore") < config.index("Restore final-stage source-bound ledger"), "final gate must generate its cache key fingerprint before restore"
          assert config.index("SANDIUM_FINAL_APK_GATE=PASS") < config.index("Publish a verified APK cache for future five-stage fast paths"), "verified APK cache must only be saved after final validation"
          assert config.index("Save the synchronized source tree") < config.index("Build one bounded incremental window"), "source cache must be created before GN output"
          assert config.index("Start the full stage budget clock") < config.index("restore_cache:"), "stage budget must include setup and restores"
          assert 'sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-5-{{ .Environment.CIRCLE_WORKFLOW_ID }}-' in config, "final gate must restore the current workflow's successful Stage 5 state"

          assert "SANDIUM_OUTPUT_CHECKPOINT=RESTORED" in checkpoint
          assert '"local_compiled_outputs_restored": True' in checkpoint
          assert "checkpoint_quality.py" not in build_fingerprint, "quality policy edits must keep the legacy known-good stage-1 cache reachable"
          assert "checkpoint_quality.py" not in checkpoint, "quality policy changes must not alter old checkpoint compatibility"
          assert 'META_NAME = ".sandium-output-checkpoint.meta.json"' in checkpoint
          assert "SANDIUM_APK_FAST_PATH=PASS" in fast_apk
          assert "APK_SIGNATURE_CHECK=REUSED_SAVED_VERIFICATION_RECORD" in fast_apk
          assert "subprocess.run" not in fast_apk, "cached APK fast path must not claim to rerun apksigner"
          assert "APK_FAST_PATH_ARTIFACT_REVALIDATION=PASS" in runner
          assert runner.index('if [[ "$MODE" == "prepare-source" ]]') < runner.index('bootstrap_chromium.sh" configure') < runner.index('test -s "$SDIR/.sisoenv"'), "source-only preparation must not require GN-generated Siso files"
          assert "SANDIUM_OUTPUT_CHECKPOINT=pack" not in runner
          assert 'output_checkpoint.py" restore' in runner and 'output_checkpoint.py" pack' in runner
          assert 'checkpoint_quality.py" --root "$ROOT"' in runner
          assert 'checkpoint_quality.py" --root "$ROOT"' in runner and "--produced" in runner
          assert "MIN_GOOD_OUTPUT_BYTES = 512 * 1024 * 1024" in checkpoint_quality
          assert "candidate_is_not_a_green_completed_stage" in checkpoint_quality
          assert "checkpoint_size_mismatch" in checkpoint_quality
          assert "WAIT -lt 240" not in runner and 'kill -INT -- "$PID"' not in runner
          assert "SISO_REMOTE_OR_CACHE_EVIDENCE=FAIL_NO_ACTION_PROOF" in runner
          assert "SISO_REMOTE_OR_CACHE_EVIDENCE=PASS_AFTER_BUILD_WINDOW" in runner
          assert "NINJA_REGEN_GATE=FAIL" not in runner, "a handled Siso manifest regeneration must not discard a full stage window"
          assert 'manifest_preflight.py"' in runner and runner.index('manifest_preflight.py"') < runner.index('timeout --signal=INT --kill-after=60s'), "filesystem-only manifest checks must run before timed compilation"
          assert "SANDIUM_NINJA_REGENERATION_DURING_BUILD=OBSERVED_NONFATAL" in runner
          assert "mode=filesystem-only" in manifest_preflight
          assert "siso_dry_run_in_preflight=no" in manifest_preflight
          assert "handled_by_real_siso_build" in manifest_preflight
          assert "subprocess.run(" not in manifest_preflight, "preflight must not spend minutes in repeated Siso dry runs"
          normalizer = Path("ci/bare/normalize_progress_total.py").read_text(encoding="utf-8")
          assert "MAX_GRAPH_TOTAL_DRIFT = 0.01" in normalizer
          assert "build identity differs" in normalizer
          assert 'python3 "$CONTROL/ci/bare/normalize_progress_total.py" --stage' in runner
          assert runner.index('python3 "$CONTROL/ci/bare/normalize_progress_total.py" --stage') < runner.index('stage_ledger.py" --stage')
          assert "epoch_946684800_regular_files_v1" in runner
          assert 'find "$SRC" -path "$SRC/.git" -prune -o -path "$SRC/out" -prune -o -type f -exec touch' in runner
          assert 'test -s "$ROOT/.gclient_entries"' in bootstrap
          assert "SANDIUM_SOURCE_CACHE=HIT_VALIDATED" in bootstrap
          assert "ci/bare/source_cache_fingerprint.py" in build_fingerprint
          assert ".circleci/config.yml" not in build_fingerprint, "routine pipeline config edits must not change build cache identity"
          assert "ci/bare/gn_args.gn" in output_fingerprint and "ci/bare/source-pin.txt" in output_fingerprint
          for orchestration_file in ("build_identity.py", "stage_ledger.py", "state_handoff.py", "output_checkpoint.py", "cache_fingerprint.py", "source_cache_fingerprint.py", "checkpoint_quality.py"):
              assert orchestration_file not in output_fingerprint, f"output cache identity must not rotate for CI implementation changes: {orchestration_file}"
          assert ".circleci/config.yml" not in output_fingerprint
          assert ".circleci/config.yml" not in checkpoint, "routine pipeline config edits must not invalidate compatible output checkpoints"
          assert ".circleci/config.yml" not in source_fingerprint, "routine build pipeline edits must not force another Chromium sync"
          assert "source-pin.txt" in source_fingerprint and "bootstrap_chromium.sh" not in source_fingerprint, "source cache identity must not change for orchestration-only edits"
          assert "SCHEMA = 2" in source_fingerprint and "PINNED_SOURCE_ONLY" in source_fingerprint
          assert "SANDIUM_STATE_HANDOFF_PREFLIGHT=PASS" in handoff
          assert "stage_ledger_sha256" in handoff
          assert "control_input_hash_mismatch" in handoff
          assert '(cd "$CHROMIUM_SRC" && sudo ./build/install-build-deps.sh --android)' in bootstrap
          assert 'test -s "$CHROMIUM_SRC/.gn"' in bootstrap
          assert 'SANDIUM_GN_GENERATION_CWD=$CHROMIUM_SRC' in bootstrap
          assert '(cd "$CHROMIUM_SRC" && "$GN" gen "$OUT"' in bootstrap

          # The verified APK is independent. Failed output/state entries use legacy v3
          # namespaces and are never selected except for Stage 1 migration fallback.
          assert config.index("sandium-verified-apk-v1-") < config.index("sandium-output-good-v5-")
          assert config.index("Save only a quality-validated green compiled-output checkpoint for reuse") < config.index("Save only successful stage metadata and state capsule for future selection")
          print("SOURCE_CACHE_LAYER=PASS")
          print("LIGHTWEIGHT_VERIFIED_APK_FAST_PATH=PASS")
          print("FULL_COMPILED_OUTPUT_CHECKPOINT=PASS")
          print("SISO_EVIDENCE_GATE=PASS")
          print("EXPLICIT_EXPENSIVE_BUILD_OPT_IN=PASS")
          print("CHROMIUM_BUILD_STARTED=no")
          PY

      - name: Validate CircleCI configuration schema (configuration only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh -o /tmp/install-circleci-cli.sh
          sudo bash /tmp/install-circleci-cli.sh
          circleci config validate .circleci/config.yml
          echo "CIRCLECI_CONFIG_SCHEMA=PASS"

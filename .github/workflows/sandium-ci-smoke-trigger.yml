name: Sandium Lightweight Five-Stage Smoke Test
# MODE 1 only: smoke implementation validated; trigger the external-helper version. Never enable the real Chromium/APK build.
# Requires repository secret CIRCLECI_TOKEN. No BuildBuddy credential is needed for this smoke test.

on:
  push:
    branches:
      - build/sandium-android-debug-apk-2026-10-17
    paths:
      - .github/workflows/sandium-ci-smoke-trigger.yml

permissions:
  contents: read

concurrency:
  group: sandium-ci-smoke-test
  cancel-in-progress: false

jobs:
  trigger-smoke-test:
    name: Trigger isolated lightweight five-stage smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate the approved branch and smoke-only intent
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BRANCH" != "build/sandium-android-debug-apk-2026-10-17" ]]; then
            echo "::error::Refusing to trigger smoke test from an unreviewed branch."
            exit 1
          fi
          echo "MODE=1_LIGHTWEIGHT_SMOKE_ONLY"
          echo "MODE=2_FULL_CHROMIUM_BUILD=DISABLED"

      - name: Trigger only the isolated smoke workflow
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          CIRCLECI_PROJECT_SLUG: "circleci/MxDP3UwnZ8Fv5ZWFv14xAJ/QEU7mKkmPf2u4opFnyaxo2"
          PIPELINE_DEFINITION_ID: "da327fe7-52aa-4dd5-bec1-4ef30d50d8c9"
        shell: bash
        run: |
          set -euo pipefail
          : "${CIRCLECI_TOKEN:?Missing CIRCLECI_TOKEN; refusing to trigger an untrackable smoke test}"
          request_body="$(python3 -c 'import json,os; b=os.environ["BRANCH"]; print(json.dumps({"definition_id":os.environ["PIPELINE_DEFINITION_ID"],"config":{"branch":b},"checkout":{"branch":b},"parameters":{"run_sandium_ci_smoke_test":True,"run_sandium_android_apk_build":False}}))')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://circleci.com/api/v2/project/${CIRCLECI_PROJECT_SLUG}/pipeline/run" \
            --header "Circle-Token: ${CIRCLECI_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$request_body")"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "::error::CircleCI API returned HTTP $status; smoke trigger was not confirmed."
            cat "$response_file"
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload=json.load(stream)
          print(json.dumps({k:payload.get(k) for k in ("id","number","state","created_at","message") if k in payload}, indent=2))
          print("CircleCI accepted the lightweight smoke-only request.")
          print("The five job results determine whether Mode 1 passed; no APK build is performed.")
          PY

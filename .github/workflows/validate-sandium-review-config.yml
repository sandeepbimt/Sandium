name: Validate SANDIUM review config

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch containing the CircleCI config to validate"
        required: true
        default: "review/sandium-persistent-cache-2026-10-17"
        type: string
      config_path:
        description: "CircleCI config path in the selected source branch"
        required: true
        default: ".circleci/config.persistent-cache-review.yml"
        type: string

permissions:
  contents: read

jobs:
  validate-review-config:
    name: CircleCI config and ShellCheck (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh -o /tmp/install-circleci-cli.sh
          sudo bash /tmp/install-circleci-cli.sh
          circleci version
          shellcheck --version

      - name: Validate CircleCI configuration (does not run a pipeline)
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          test -f "$CONFIG_PATH"
          circleci config validate "$CONFIG_PATH"

      - name: Extract embedded shell commands and run ShellCheck
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          config_path = Path(__import__("os").environ["CONFIG_PATH"])
          config = yaml.safe_load(config_path.read_text())

          commands = []
          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "command" and isinstance(child, str):
                          commands.append((path + ".command", child))
                      else:
                          walk(child, path + "." + str(key))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}[{index}]")

          walk(config)
          if not commands:
              raise SystemExit("No CircleCI command blocks found to lint.")

          failures = 0
          checked = 0
          python_checked = 0
          for index, (label, command) in enumerate(commands, 1):
              # Syntax-check Python heredocs before replacing them for ShellCheck.
              heredoc_pattern = r"(?m)^python3?\s+-\s+<<['\"]?PY['\"]?\s*\n(.*?)^PY\s*$"
              for py_index, match in enumerate(re.finditer(heredoc_pattern, command, flags=re.DOTALL), 1):
                  try:
                      ast.parse(match.group(1))
                      python_checked += 1
                  except SyntaxError as error:
                      failures += 1
                      print(f"\n--- Python syntax error in {label}, heredoc {py_index} ---")
                      print(error)
              # Replace whole Python heredocs before shell linting.
              shell = re.sub(
                  r"(?m)^python3?\s+-\s+<<['\"]?PY['\"]?\s*\n.*?^PY\s*$",
                  ": # Python heredoc syntax checked separately above",
                  command,
                  flags=re.DOTALL,
              )
              with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as handle:
                  handle.write(shell + "\n")
                  temp_path = Path(handle.name)
              result = subprocess.run(
                  ["shellcheck", "--shell=bash", str(temp_path)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              checked += 1
              if result.returncode:
                  failures += 1
                  print(f"\n--- ShellCheck findings in {label} ---")
                  print(result.stdout.rstrip())
              temp_path.unlink(missing_ok=True)

          print(f"Python syntax checked {python_checked} embedded heredoc(s).")
          print(f"ShellCheck processed {checked} CircleCI command block(s).")
          if failures:
              raise SystemExit(f"ShellCheck failed for {failures} command block(s).")
          print("SHELLCHECK_RESULT=PASS")
          PY

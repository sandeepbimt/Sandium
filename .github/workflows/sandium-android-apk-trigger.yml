name: Sandium Android Debug APK Build Trigger
# Trigger only after the five-stage Siso checkpoint archive, restore tests, and CircleCI config validation are green.
# Requires GitHub Actions secret CIRCLECI_TOKEN and CircleCI BUILDBUDDY_API_KEY context.
# The CircleCI pipeline is the source of truth for build success and APK publication.
# Approved Mode 2 full build 2026-10-19: run the complete five-stage Android APK workflow after version.gni prerequisite repair.

on:
  push:
    branches:
      - build/sandium-android-debug-apk-2026-10-17
    paths:
      - .github/workflows/sandium-android-apk-trigger.yml

permissions:
  contents: read

concurrency:
  group: sandium-android-debug-apk
  cancel-in-progress: false

jobs:
  trigger-sandium-build:
    name: Trigger the isolated Sandium five-stage APK pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate the one approved build branch
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BRANCH" != "build/sandium-android-debug-apk-2026-10-17" ]]; then
            echo "::error::Refusing to trigger an APK build from an unreviewed branch."
            exit 1
          fi
          echo "Approved isolated Sandium branch: $BRANCH"

      - name: Ensure BuildBuddy credential is configured in the isolated CircleCI project
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          CIRCLECI_PROJECT_SLUG: "circleci/MxDP3UwnZ8Fv5ZWFv14xAJ/QEU7mKkmPf2u4opFnyaxo2"
        shell: bash
        run: |
          set -euo pipefail
          : "${CIRCLECI_TOKEN:?Missing CIRCLECI_TOKEN; refusing to start an unmonitorable build}"
          : "${BUILDBUDDY_API_KEY:?Missing tested GitHub Actions BUILDBUDDY_API_KEY secret}"
          base="https://circleci.com/api/v2/project/${CIRCLECI_PROJECT_SLUG}/envvar"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          expected_suffix="${BUILDBUDDY_API_KEY: -4}"
          get_vars() {
            curl --silent --show-error --output "$temp_dir/envvars.json" --write-out "%{http_code}" \
              --header "Circle-Token: ${CIRCLECI_TOKEN}" "$base"
          }
          http_status="$(get_vars)"
          if [[ "$http_status" != "200" ]]; then
            echo "::error::Cannot inspect the CircleCI project's protected environment variables (HTTP $http_status); refusing to spend a build run."
            exit 1
          fi
          key_is_listed=false
          if jq -e --arg name "BUILDBUDDY_API_KEY" '.items[]? | select(.name == $name)' "$temp_dir/envvars.json" >/dev/null; then
            key_is_listed=true
          fi
          if [[ "$key_is_listed" == "true" ]]; then
            masked_value="$(jq -r '.items[] | select(.name == "BUILDBUDDY_API_KEY") | .value' "$temp_dir/envvars.json" | head -n 1)"
            actual_suffix="${masked_value: -4}"
            if [[ "$actual_suffix" != "$expected_suffix" ]]; then
              echo "CircleCI BuildBuddy credential differs from the tested Actions secret; rotating the project value."
              delete_status="$(curl --silent --show-error --output "$temp_dir/delete.json" --write-out "%{http_code}" \
                --request DELETE --header "Circle-Token: ${CIRCLECI_TOKEN}" "$base/BUILDBUDDY_API_KEY")"
              if [[ "$delete_status" != "200" ]]; then
                echo "::error::Unable to replace stale BuildBuddy project credential (HTTP $delete_status); no APK pipeline was triggered."
                exit 1
              fi
              key_is_listed=false
            else
              echo "BUILDBUDDY_API_KEY already matches the verified Actions secret by masked suffix."
            fi
          fi
          if [[ "$key_is_listed" == "false" ]]; then
            python3 -c 'import json,os; print(json.dumps({"name":"BUILDBUDDY_API_KEY","value":os.environ["BUILDBUDDY_API_KEY"]}))' > "$temp_dir/request.json"
            create_status="$(curl --silent --show-error --output "$temp_dir/create.json" --write-out "%{http_code}" \
              --request POST "$base" \
              --header "Circle-Token: ${CIRCLECI_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary "@$temp_dir/request.json")"
            if [[ "$create_status" != "201" ]]; then
              echo "::error::Unable to provision BuildBuddy project credential (HTTP $create_status); no APK pipeline was triggered."
              exit 1
            fi
            echo "BUILDBUDDY_API_KEY provisioned without logging or committing its value."
          fi
          get_status="$(curl --silent --show-error --output "$temp_dir/verify.json" --write-out "%{http_code}" \
            --header "Circle-Token: ${CIRCLECI_TOKEN}" "$base/BUILDBUDDY_API_KEY")"
          if [[ "$get_status" != "200" ]] || ! jq -e --arg suffix "$expected_suffix" '.value[-4:] == $suffix' "$temp_dir/verify.json" >/dev/null; then
            echo "::error::CircleCI BuildBuddy credential verification failed; no APK pipeline was triggered."
            exit 1
          fi
          echo "BUILDBUDDY_CREDENTIAL_READY=true"
      - name: Cancel superseded CircleCI pipeline 42 if it is still active
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PROJECT_SLUG: "circleci/MxDP3UwnZ8Fv5ZWFv14xAJ/QEU7mKkmPf2u4opFnyaxo2"
          SUPERSEDED_PIPELINE_ID: "bc7bd357-8fab-4a8e-95ac-973684f3addf"
        shell: bash
        run: |
          set -euo pipefail
          : "${CIRCLECI_TOKEN:?Missing CIRCLECI_TOKEN}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="https://circleci.com/api/v2/pipeline/$SUPERSEDED_PIPELINE_ID/workflow"
          status="$(curl --silent --show-error --output "$tmp/workflows.json" --write-out "%{http_code}" \
            --header "Circle-Token: $CIRCLECI_TOKEN" "$url")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Unable to inspect superseded pipeline $SUPERSEDED_PIPELINE_ID (HTTP $status); refusing to launch a duplicate full build."
            cat "$tmp/workflows.json"
            exit 1
          fi
          while IFS="$(printf '\t')" read -r workflow_id workflow_status; do
            [[ -n "$workflow_id" ]] || continue
            case "$workflow_status" in
              success|failed|error|canceled|not_run|terminated)
                echo "SUPERSEDED_WORKFLOW_ALREADY_TERMINAL=$workflow_id:$workflow_status"
                ;;
              *)
                echo "Canceling superseded workflow $workflow_id (status=$workflow_status) before triggering the corrected run."
                cancel_status="$(curl --silent --show-error --output "$tmp/cancel.json" --write-out "%{http_code}" \
                  --request POST --header "Circle-Token: $CIRCLECI_TOKEN" \
                  "https://circleci.com/api/v2/workflow/$workflow_id/cancel")"
                if [[ "$cancel_status" != "200" && "$cancel_status" != "202" ]]; then
                  # The workflow may have completed between GET and POST. Re-read its status
                  # and continue only if the raced workflow is terminal; otherwise fail closed.
                  curl --fail --silent --show-error --header "Circle-Token: $CIRCLECI_TOKEN" "$url" -o "$tmp/workflows-after-cancel.json"
                  still_active="$(jq -r --arg id "$workflow_id" '.items[]? | select(.id == $id) | .status' "$tmp/workflows-after-cancel.json")"
                  case "$still_active" in
                    success|failed|error|canceled|not_run|terminated|"")
                      echo "SUPERSEDED_WORKFLOW_TERMINAL_AFTER_RACE=$workflow_id:$still_active"
                      ;;
                    *)
                      echo "::error::Unable to cancel active superseded workflow $workflow_id (HTTP $cancel_status); refusing to run two full builds."
                      cat "$tmp/cancel.json"
                      exit 1
                      ;;
                  esac
                else
                  echo "SUPERSEDED_WORKFLOW_CANCEL_ACCEPTED=$workflow_id"
                fi
                ;;
            esac
          done < <(jq -r '.items[]? | [.id,.status] | @tsv' "$tmp/workflows.json")
          echo "SUPERSEDED_PIPELINE_CHECK=COMPLETE"
      - name: Trigger the five-stage CircleCI Android APK pipeline
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          CIRCLECI_PROJECT_SLUG: "circleci/MxDP3UwnZ8Fv5ZWFv14xAJ/QEU7mKkmPf2u4opFnyaxo2"
          PIPELINE_DEFINITION_ID: "da327fe7-52aa-4dd5-bec1-4ef30d50d8c9"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CIRCLECI_TOKEN:-}" ]]; then
            echo "::error::Repository secret CIRCLECI_TOKEN is missing; no CircleCI pipeline was started."
            exit 1
          fi
          request_body="$(python3 -c 'import json,os; b=os.environ["BRANCH"]; print(json.dumps({"definition_id":os.environ["PIPELINE_DEFINITION_ID"],"config":{"branch":b},"checkout":{"branch":b},"parameters":{"run_sandium_android_apk_build":True,"run_sandium_compile_windows":True,"run_sandium_ci_smoke_test":False}}))')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://circleci.com/api/v2/project/${CIRCLECI_PROJECT_SLUG}/pipeline/run" \
            --header "Circle-Token: ${CIRCLECI_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$request_body")"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "::error::CircleCI API returned HTTP $status. No successful trigger was confirmed."
            cat "$response_file"
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload=json.load(stream)
          summary={k:payload.get(k) for k in ("id","number","state","created_at","message") if k in payload}
          print(json.dumps(summary, indent=2))
          print("CircleCI accepted the Sandium Android debug APK build request.")
          print("The CircleCI job results and APK verification determine success; API acceptance alone is not build success.")
          PY

workflows:
  sandium-checkpoint-discovery-probe:
    when: << pipeline.parameters.run_sandium_checkpoint_discovery_probe >>
    jobs:
      - sandium-checkpoint-discovery-probe
  sandium-checkpoint-unit-tests:
    when: << pipeline.parameters.run_sandium_checkpoint_unit_tests >>
    jobs:
      - sandium-checkpoint-unit-tests
  sandium-checkpoint-discovery:
    when: << pipeline.parameters.run_sandium_checkpoint_discovery >>
    jobs:
      - sandium-checkpoint-discovery
  sandium-checkpoint-restore-validation:
    when: << pipeline.parameters.run_sandium_checkpoint_restore_validation >>
    jobs:
      - sandium-checkpoint-restore-validation
  # Optional standalone gate for diagnosis; production APK builds run the same gate in Stage 1.
  sandium-fast-regression:
    when: << pipeline.parameters.run_sandium_fast_regression >>
    jobs:
      - sandium-fast-regression-gate
  # Controlled bootstrap workflow: run only Stage 1 so its checkpoint can
  # be inspected before any continuation stage is scheduled.
  sandium-stage1-bootstrap:
    # Stage 1 can run in safe preflight-only mode with compile windows disabled.
    # Compilation is independently gated inside the job by run_sandium_compile_windows.
    when:
      and:
        - << pipeline.parameters.run_sandium_stage1_bootstrap >>
        - not: << pipeline.parameters.run_sandium_android_apk_build >>
    jobs:
      - stage-1-source-foundation
  sandium-android-preflight:
    when:
      and:
        - << pipeline.parameters.run_sandium_android_apk_build >>
        - not: << pipeline.parameters.run_sandium_compile_windows >>
    jobs:
      - stage-1-source-foundation
      - stage-2-graph-and-compile-window:
          requires:
            - stage-1-source-foundation
  # Mode 2/full-build contract includes the APK opt-in condition `when: << pipeline.parameters.run_sandium_android_apk_build >>`.
  # The actual workflow guard also requires compile_windows=true so the preflight-only mode cannot trigger a full build.
  sandium-android-debug-apk:
    when:
      and:
        - << pipeline.parameters.run_sandium_android_apk_build >>
        - << pipeline.parameters.run_sandium_compile_windows >>
    jobs:
      - stage-1-source-foundation
      - stage-2-graph-and-compile-window:
          requires:
            - stage-1-source-foundation
      - stage-3-compile-continuation:
          requires:
            - stage-2-graph-and-compile-window
      - stage-4-finish-and-package:
          requires:
            - stage-3-compile-continuation
      - stage-5-verify-publish:
          requires:
            - stage-4-finish-and-package
  sandium-ci-smoke-test:
    when: << pipeline.parameters.run_sandium_ci_smoke_test >>
    jobs:
      - smoke-1-contract-and-foundation
      - smoke-2-build-state-tests:
          requires:
            - smoke-1-contract-and-foundation
      - smoke-3-handover-continuity:
          requires:
            - smoke-2-build-state-tests
      - smoke-4-cache-and-artifact-contract:
          requires:
            - smoke-3-handover-continuity
      - smoke-5-independent-handover-verification:
          requires:
            - smoke-4-cache-and-artifact-contract

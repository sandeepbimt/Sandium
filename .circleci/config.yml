            pin_lines = [
                line.strip()
                for line in (root / "src/brave/ci/pins/chromium-tag.txt").read_text().splitlines()
                if line.strip() and not line.lstrip().startswith("#")
            ]
            if len(pin_lines) != 1:
                raise SystemExit("SANDIUM_PIN_POST_SYNC_INVALID=true")
            pin = pin_lines[0]
            if actual_tag != pin or manifest.get("chromium_tag") != pin or manifest.get("chromium_commit") != actual_commit:
                raise SystemExit(
                    f"SANDIUM_SOURCE_MANIFEST_DRIFT=true; pin={pin}, tag={actual_tag}, commit={actual_commit}"
                )
            if manifest.get("version_file_sha256") != version_hash:
                raise SystemExit(
                    "SANDIUM_VERSION_FILE_DRIFT=true; Brave sync/hooks changed chrome/VERSION from the validated cache"
                )
            print("SANDIUM_GCLIENT_MANIFEST_MATCH=PASS")
            print("SANDIUM_SOURCE_MANIFEST_MATCH=PASS")
            PY
            test -s "$ROOT/src/brave/vendor/bat-native-tweetnacl/BUILD.gn" || {
              echo "SANDIUM_REQUIRED_DEPS_MISSING=src/brave/vendor/bat-native-tweetnacl/BUILD.gn"
              exit 33
            }
            test -s "$ROOT/src/brave/build/version.gni" || {
              echo "SANDIUM_REQUIRED_GENERATED_GN_INPUT_MISSING=src/brave/build/version.gni"
              exit 34
            }
            echo "SANDIUM_BRAVE_DEPS_SYNC=PASS"
            echo "SANDIUM_REQUIRED_BRAVE_GN_INPUTS=PASS"
            echo "SANDIUM_CHROMIUM_PIN_PRESERVATION=PASS"
      - run:
          name: Preflight GN executable using the build environment
          command: |
            set -euo pipefail
            GN_DIR="$HOME/project/src/buildtools/linux64"
            GN_BIN="$GN_DIR/gn"
            if [[ ! -x "$GN_BIN" ]]; then
              echo "SANDIUM_GN_EXECUTABLE_PREFLIGHT=FAIL"
              echo "Expected Chromium GN binary is missing or not executable: $GN_BIN"
              echo "Searching source checkout for a GN executable to diagnose source/cache layout:"
              find "$HOME/project/src" -type f -path '*/buildtools/linux64/gn' -o -type f -name gn 2>/dev/null | head -n 30 || true
              exit 1
            fi
            echo "export PATH=$GN_DIR:\$PATH" >> "$BASH_ENV"
            export PATH="$GN_DIR:$PATH"
            echo "SANDIUM_GN_EXPECTED_PATH=$GN_BIN"
            cd src/brave
            node --input-type=module - \<<'NODE'
            import { spawnSync } from 'node:child_process'
            import config from './build/commands/lib/config.ts'
            const options = config.defaultOptions
            const lookup = spawnSync('bash', ['-c', 'command -v gn'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (lookup.error || lookup.status !== 0 || !lookup.stdout.trim()) {
              throw new Error('GN executable is not resolvable with Brave build PATH after adding Chromium buildtools/linux64: '
                + (lookup.error?.message || lookup.stderr || 'command -v gn returned no path'))
            }
            const gnPath = lookup.stdout.trim()
            console.log('SANDIUM_GN_RESOLVED_PATH=' + gnPath)
            const version = spawnSync(gnPath, ['--version'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (version.error) {
              throw new Error('GN failed to spawn at ' + gnPath + ': ' + version.error.message)
            }
            if (version.status !== 0) {
              throw new Error('GN --version failed with status ' + version.status
                + '; stdout=' + (version.stdout || '') + '; stderr=' + (version.stderr || ''))
            }
            console.log('SANDIUM_GN_EXECUTABLE_PREFLIGHT=PASS')
            console.log('SANDIUM_GN_VERSION=' + version.stdout.trim())
            NODE
      - generate-sandium-brave-version-gni
      - run:
          name: Prepare source overlay and branding before GN
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            OUT="$HOME/project/src/out/android_Debug_arm64"
            if [[ "${SANDIUM_BUILD_OUTPUT_CACHE_HIT:-false}" == "true" ]]; then
              echo "GN_GRAPH_MODE=REUSE_RESTORED_CHECKPOINT"
              cd src/brave
              set +e
              SANDIUM_CI_PREPARE_RESTORED_GRAPH=true pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false --gn clang_diagnostic_dir:\"clang-crashreports\" 2>&1 | tee "$HOME/project/build-diagnostics/prepare-restored-graph.log"
              status=${PIPESTATUS[0]}
              set -e
              cd "$HOME/project"
              if [[ "$status" -ne 0 ]]; then
                echo "SANDIUM_RESTORED_GRAPH_PREPARATION_FAILED=$status; refusing to regenerate a restored graph"
                exit "$status"
              fi
              echo "SANDIUM_PREPARE_ONLY=SKIPPED_VALIDATED_GRAPH_REUSED"
            else
              echo "GN_GRAPH_MODE=FRESHLY_PREPARED_BEFORE_COMPILE"
              cd src/brave
              set +e
              pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --force_gn_gen --use_remoteexec true --gn use_siso:true --gn use_reclient:false --gn clang_diagnostic_dir:\"clang-crashreports\" --prepare_only 2>&1 | tee "$HOME/project/build-diagnostics/prepare-only.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$HOME/project/build-diagnostics/prepare-only-exit.txt"
              cd "$HOME/project"
              if [[ "$status" -ne 0 ]]; then
                echo "GN_PREPARE_FAILED=$status; refusing to start the long compile window"
                exit "$status"
              fi
              echo "SANDIUM_PREPARE_ONLY=PASS"
            fi
            ARGS="$OUT/args.gn"
            GENERATED_ARGS="$OUT/args_generated.gni"
            IMPORT_LINE='import("//out/android_Debug_arm64/args_generated.gni")'
            if [[ ! -s "$ARGS" ]] ||
               [[ ! -s "$GENERATED_ARGS" ]] ||
               ! grep -Fqx "$IMPORT_LINE" "$ARGS" ||
               grep -Eq '^[[:space:]]*(use_siso|use_reclient|use_remoteexec)[[:space:]]*=' "$ARGS" ||
               ! grep -Eq '^[[:space:]]*use_siso[[:space:]]*=[[:space:]]*true[[:space:]]*$' "$GENERATED_ARGS" ||
               ! grep -Eq '^[[:space:]]*use_reclient[[:space:]]*=[[:space:]]*false[[:space:]]*$' "$GENERATED_ARGS" ||
               ! grep -Eq '^[[:space:]]*use_remoteexec[[:space:]]*=[[:space:]]*true[[:space:]]*$' "$GENERATED_ARGS"; then
              echo "GN_PREPARE_MISSING_REQUIRED_SISO_ARGS=true"
              echo "EXPECTED_GN_ARGS_FILE=$ARGS"
              echo "EXPECTED_GENERATED_GN_ARGS_FILE=$GENERATED_ARGS"
              if [[ -s "$ARGS" ]]; then
                echo "ARGS_GN_IMPORTS_AND_OVERRIDES:"
                grep -E 'args_generated\\.gni|^[[:space:]]*(use_siso|use_reclient|use_remoteexec)[[:space:]]*=' "$ARGS" || true
              else
                echo "GN_ARGS_FILE_EXISTS=false"
              fi
              if [[ -s "$GENERATED_ARGS" ]]; then
                echo "GENERATED_GN_REQUIRED_ARGS:"
                grep -E '^[[:space:]]*(use_siso|use_reclient|use_remoteexec)[[:space:]]*=' "$GENERATED_ARGS" || true
              else
                echo "GENERATED_GN_ARGS_FILE_EXISTS=false"
              fi
              echo "Refusing to spend a compile window with ineffective Siso GN args."
              exit 22
            fi
            echo "GN_PREPARE_ARG_SOURCE=ARGS_GENERATED_GNI_IMPORTED"
            echo "GN_PREPARE_REQUIRED_SISO_ARGS=PASS"
      - normalize-sandium-source-baseline
      - run:
          name: Compile window 2 using same target and remote action cache
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ "<< pipeline.parameters.run_sandium_compile_windows >>" != "true" ]]; then
              echo "SANDIUM_PREFLIGHT_ONLY=true"
              echo "COMPILE_WINDOW_2_SKIPPED_BY_EXPLICIT_SAFETY_GATE=true"
              echo "125" > "$HOME/project/build-diagnostics/compile-window-2-exit.txt"
              : > "$HOME/project/build-diagnostics/compile-window-2.log"
              : > "$HOME/project/build-diagnostics/compile-window-2-remote-cache-log-candidates.txt"
              exit 0
            fi
            python3 src/brave/ci/siso/build_state.py fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
            cd src/brave
            started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            remaining_compile_seconds="$(( 3300 - elapsed_seconds - 300 ))"
            if [[ "$remaining_compile_seconds" -le 0 ]]; then
              echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; refusing to compile without handover margin"
              exit 5
            fi
            echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
            echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
            set +e
            BUILD_FORCE_GN_GEN=()
            if [[ "${SANDIUM_BUILD_OUTPUT_CACHE_HIT:-false}" != "true" ]]; then
              echo "GN_GRAPH_MODE=FRESHLY_PREPARED_BEFORE_COMPILE"
            else
              echo "GN_GRAPH_MODE=REUSE_RESTORED_CHECKPOINT"
            fi
            python3 "$HOME/project/src/brave/ci/siso/run_compile_window.py" --root "$HOME/project" --stage stage-2 --stage-start-epoch-file "$HOME/.sandium-stage-start-epoch" --max-stage-seconds 3300 --handover-reserve-seconds 300 --metrics-poll-interval-seconds 15
            status=$?
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-2-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-2.log"
            evidence="$HOME/project/build-diagnostics/compile-window-2-remote-cache-log-candidates.txt"
            if grep -Eai 'local:[[:space:]]*[0-9]+[[:space:]]+remote:|remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              echo "COMPILE_WINDOW_FAILURE_DEFERRED_FOR_CHECKPOINT=$status"
            else
              echo "COMPILE_WINDOW_STATUS_ACCEPTED_FOR_HANDOVER=$status"
            fi
      - save_cache:
          key: sandium-siso-v4-android-debug-arm64-stage2-{{ .BuildNum }}
          paths:
            - sandium-siso-cache
      - run:
          name: Checkpoint Stage-2 output and capture validated Siso statistics
          command: |
            set -euo pipefail
            status="$(cat build-diagnostics/compile-window-2-exit.txt)"
            COMPLETE=false
            if [[ "$status" == "0" || -s src/out/android_Debug_arm64/apks/Bravearm64.apk ]]; then
              COMPLETE=true
            fi
            python3 src/brave/ci/siso/build_state.py record --commit "$CIRCLE_SHA1" --stage stage-2 --compile-complete "$COMPLETE" --artifact-verified auto --log build-diagnostics/compile-window-2.log
            python3 src/brave/ci/siso/build_state.py fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
            mkdir -p sandium-output
            if [[ -s src/out/android_Debug_arm64/apks/Bravearm64.apk && "$(stat -c %s src/out/android_Debug_arm64/apks/Bravearm64.apk)" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-2
            else
              echo "APK_NOT_YET_AVAILABLE=stage-2"
            fi
      - run:
          name: Pack stage-2 cumulative Siso checkpoint
          command: |
            set -euo pipefail
            if [[ "<< pipeline.parameters.run_sandium_compile_windows >>" != "true" ]]; then
              echo "SANDIUM_CHECKPOINT_HANDOVER=NO_COMPILE_NO_CHECKPOINT stage=stage-2"
              echo "SANDIUM_CHECKPOINT_PACK_SKIPPED=true reason=preflight_only"
              exit 0
            fi
            python3 src/brave/ci/siso/checkpoint.py pack --root "$HOME/project" --stage stage-2
      - run:
          name: Publish stage-2 checkpoint files for cross-workflow recovery
          command: |
            set -euo pipefail
            if [[ "<< pipeline.parameters.run_sandium_compile_windows >>" != "true" ]]; then
              echo "CHECKPOINT_ARTIFACT_PUBLISH_SKIPPED=stage-2 reason=preflight_only"
              exit 0
            fi
            mkdir -p build-diagnostics/checkpoint-artifact
            cp -f sandium-checkpoint.tar.zst sandium-checkpoint.meta build-diagnostics/checkpoint-artifact/
            cp -f sandium-action-frontier.txt build-diagnostics/checkpoint-artifact/ 2>/dev/null || true
            echo "CHECKPOINT_ARTIFACT_STAGED=stage-2"
      - save_cache:
          name: Save stage-2 resumable build checkpoint for the next stage or workflow
          key: sandium-checkpoint-v7-{{ .Branch }}-stage-2-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - sandium-checkpoint.tar.zst
            - sandium-checkpoint.meta
            - sandium-action-frontier.txt
      - save_cache:
          key: sandium-apk-v4-{{ .Branch }}-{{ .Revision }}-android-debug-arm64-stage2-{{ .BuildNum }}
          paths:
            - sandium-output
      - run:
          name: Include verified APK in downloadable stage-2 artifacts
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -s sandium-output/Brave-debug-arm64.apk ]]; then
              cp -f sandium-output/Brave-debug-arm64.apk build-diagnostics/
              cp -f sandium-output/build-manifest.json build-diagnostics/ 2>/dev/null || true
              cp -f sandium-output/build-state.json build-diagnostics/ 2>/dev/null || true
              echo "APK_ARTIFACT_STAGED=stage-2"
            else
              echo "APK_NOT_YET_AVAILABLE=stage-2"
            fi
      - store_artifacts:
          path: build-diagnostics
          destination: stage-2-compile-continuation
      - run:
          name: Propagate compile failure only after saving resumable state
          command: |
            set -euo pipefail
            status_file="$HOME/project/build-diagnostics/compile-window-2-exit.txt"
            if [[ ! -s "$status_file" ]]; then
              echo "COMPILE_EXIT_STATUS_MISSING=$status_file"
              exit 90
            fi
            status="$(cat "$status_file")"
            if [[ "$status" == "125" && "<< pipeline.parameters.run_sandium_compile_windows >>" != "true" ]]; then
              echo "BUILD_STAGE_PREFLIGHT_ONLY_HANDOVER_ALLOWED=true stage=2 status=125"
              exit 0
            fi
            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              echo "BUILD_STAGE_FAILED_AFTER_CHECKPOINT_SAVE=true status=$status"
              exit "$status"
            fi
            echo "BUILD_STAGE_HANDOVER_ALLOWED=true status=$status"
  stage-3-compile-continuation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      - restore-sandium-apk-cache
      - run:
          name: Exit this stage when a verified APK cache exists
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_VERIFIED_APK_CACHE_HIT:-false}" == "true" ]]; then
              echo "VERIFIED_APK_REUSED=true; no Chromium compile or dependency setup required"
              circleci-agent step halt
            fi
      - checkout:
          path: brave-core
      - snapshot-sandium-source-cache-inputs
      - restore-sandium-source
      - run:
          name: Place Brave Core checkout after restoring Chromium source
          command: |
            set -euo pipefail
            test -d brave-core/.git
            test ! -e src/brave
            mkdir -p src
            mv brave-core src/brave
            test -d src/brave/.git
      - validate-sandium-source-cache-inputs
      - restore-sandium-build-output:
          stage_index: 3
      - restore-sandium-siso-cache
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse pinned Node dependencies; install only after lockfile change
          command: |
            set -euo pipefail
            LOCK_HASH="$(sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}')"
            if [[ -d src/brave/node_modules && -s src/brave/.sandium-pnpm-lock.sha256 && "$(cat src/brave/.sandium-pnpm-lock.sha256)" == "$LOCK_HASH" ]]; then
              echo "PNPM_DEPENDENCIES=REUSED"
            else
              cd src/brave
              pnpm install --frozen-lockfile --prefer-offline
              cd "$HOME/project"
              sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
              echo "PNPM_DEPENDENCIES=INSTALLED"
            fi
      - ensure-sandium-brave-child-dependencies
      - install-sandium-android-build-deps
      - ensure-sandium-depot-tools
      - run:
          name: Preflight GN executable in this stage's fresh environment
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            GN_DIR="$ROOT/src/buildtools/linux64"
            GN_BIN="$GN_DIR/gn"
            if [[ ! -x "$GN_BIN" ]]; then
              echo "SANDIUM_GN_EXECUTABLE_PREFLIGHT=FAIL"
              echo "Expected Chromium GN binary is missing or not executable: $GN_BIN"
              echo "Checking restored source/buildtools layout:"
              ls -la "$ROOT/src/buildtools" "$ROOT/src/buildtools/linux64" 2>&1 || true
              find "$ROOT/src" -type f \( -path '*/buildtools/linux64/gn' -o -name gn \) 2>/dev/null | head -n 30 || true
              exit 1
            fi
            echo "export PATH=$GN_DIR:\$PATH" >> "$BASH_ENV"
            export PATH="$GN_DIR:$PATH"
            echo "SANDIUM_GN_EXPECTED_PATH=$GN_BIN"
            test -x "$GN_BIN"
            "$GN_BIN" --version
            cd "$ROOT/src/brave"
            node --input-type=module - \<<'NODE'
            import { spawnSync } from 'node:child_process'
            import config from './build/commands/lib/config.ts'
            const options = config.defaultOptions
            const lookup = spawnSync('bash', ['-c', 'command -v gn'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (lookup.error || lookup.status !== 0 || !lookup.stdout.trim()) {
              throw new Error('GN executable is not resolvable with Brave build PATH: '
                + (lookup.error?.message || lookup.stderr || 'command -v gn returned no path'))
            }
            const gnPath = lookup.stdout.trim()
            console.log('SANDIUM_GN_RESOLVED_PATH=' + gnPath)
            const version = spawnSync(gnPath, ['--version'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (version.error) {
              throw new Error('GN failed to spawn at ' + gnPath + ': ' + version.error.message)
            }
            if (version.status !== 0) {
              throw new Error('GN --version failed with status ' + version.status
                + '; stdout=' + (version.stdout || '') + '; stderr=' + (version.stderr || ''))
            }
            console.log('SANDIUM_GN_EXECUTABLE_PREFLIGHT=PASS')
            console.log('SANDIUM_GN_VERSION=' + version.stdout.trim())
            NODE
      - configure-sandium-remote-cache
      - generate-sandium-brave-version-gni
      - run:
          name: Prepare source overlay and branding before GN
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_BUILD_OUTPUT_CACHE_HIT:-false}" != "true" ]]; then
              echo "SANDIUM_CHECKPOINT_HANDOVER_GATE=FAIL; a continuation stage has no validated predecessor graph"
              exit 42
            fi
            mkdir -p build-diagnostics
            cd src/brave
            set +e
            SANDIUM_CI_PREPARE_RESTORED_GRAPH=true pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false --gn clang_diagnostic_dir:\"clang-crashreports\" 2>&1 | tee "$HOME/project/build-diagnostics/prepare-restored-graph.log"
            status=${PIPESTATUS[0]}
            set -e
            cd "$HOME/project"
            if [[ "$status" -ne 0 ]]; then

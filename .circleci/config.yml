          name: Place Brave Core checkout after restoring Chromium source
          command: |
            set -euo pipefail
            test -d brave-core/.git
            test ! -e src/brave
            mkdir -p src
            mv brave-core src/brave
            test -d src/brave/.git
      - validate-sandium-source-cache-inputs
      - restore-sandium-build-output:
          stage_index: 4
      - restore-sandium-siso-cache
      - install-sandium-node
      - restore-sandium-pnpm-cache

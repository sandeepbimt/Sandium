# SANDIUM five-stage Android debug APK CI.
# APK builds are opt-in; the pipeline parameter defaults to false.

version: 2.1

parameters:
  run_sandium_android_apk_build:
    type: boolean
    default: false

commands:
  install-sandium-node:
    steps:
      - run:
          name: Install pinned Node and pnpm
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential ca-certificates curl python-is-python3 python3-setuptools xz-utils
            NODE_VERSION=24.16.0
            curl --fail --location --silent --show-error "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            sudo mkdir -p /opt/sandium-node
            sudo tar -xJf /tmp/node.tar.xz -C /opt/sandium-node --strip-components=1
            echo "export PATH=/opt/sandium-node/bin:\$PATH" >> "$BASH_ENV"
            export PATH="/opt/sandium-node/bin:$PATH"
            node --version
            npm install --global pnpm@11.11.0
            pnpm --version

  restore-sandium-source:
    steps:
      - restore_cache:
          keys:
            - sandium-src-v5-chromium-156.1.100.0-
      - run:
          name: Validate restored Chromium source cache or record cold start
          command: |
            set -euo pipefail
            if [[ -f src/chrome/VERSION ]]; then
              python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            text = Path("src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            print("RESTORED_CHROMIUM_VERSION=" + actual)
            if actual != "156.1.100.0":
                raise SystemExit("Source cache pin mismatch; refusing to build from it.")
            manifest_path = Path(".sandium-source-cache-manifest.json")
            if not manifest_path.is_file():
                raise SystemExit("Source cache manifest missing; refusing to build.")
            manifest = json.loads(manifest_path.read_text())
            chromium_sha = subprocess.check_output(["git", "-C", "src", "rev-parse", "HEAD"], text=True).strip()
            version_sha256 = __import__("hashlib").sha256(Path("src/chrome/VERSION").read_bytes()).hexdigest()
            if manifest.get("schema") != 2:
                raise SystemExit("Unsupported source-cache manifest schema.")
            if manifest.get("chromium_version") != actual:
                raise SystemExit("Source-cache manifest version does not match the checked-out source.")
            if manifest.get("chromium_commit") != chromium_sha:
                raise SystemExit("Cached Chromium commit does not match manifest.")
            if manifest.get("version_file_sha256") != version_sha256:
                raise SystemExit("Cached Chromium VERSION file hash does not match manifest.")
            print("SOURCE_CACHE_FINGERPRINT=PASS")
            print("SOURCE_CACHE_SCOPE=CHROMIUM_ONLY")
            PY
            else
              echo "SOURCE_CACHE=COLD_MISS"
              if [[ "${CIRCLE_JOB:-}" != "stage-1-source-foundation" ]]; then
                echo "Required source cache missing in a compile stage."
                exit 2
              fi
            fi

  restore-sandium-build-output:
    steps:
      - restore_cache:
          keys:
            - sandium-out-v3-{{ .Branch }}-chromium-156.1.100.0-android-debug-arm64-
      - run:
          name: Validate cached Android build output against source and GN inputs
          command: |
            set -euo pipefail
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            if [[ ! -d "$OUT" ]]; then
              echo "BUILD_OUTPUT_CACHE=COLD_MISS"
              exit 0
            fi
            if python3 "$STATE" check --mode cache --commit "${CIRCLE_SHA1:?}"; then
              echo "BUILD_OUTPUT_CACHE=COMPATIBLE"
              if python3 "$STATE" check --mode compiled --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_COMPILED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
              if python3 "$STATE" check --mode verified --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_VERIFIED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
            else
              echo "BUILD_OUTPUT_CACHE=INCOMPATIBLE; discarding stale output directory"
              rm -rf "$OUT"
            fi

  restore-sandium-pnpm-cache:
    steps:
      - restore_cache:
          keys:
            - sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-

  restore-sandium-apk-cache:
    steps:
      - restore_cache:
          keys:
            - sandium-apk-v3-{{ .Branch }}-{{ .Revision }}-chromium-156.1.100.0-android-debug-arm64-
      - run:
          name: Verify reusable APK artifact without checking out Brave source
          command: |
            set -euo pipefail
            if python3 - "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}" \<<'PY'
            import hashlib, json, re, sys, zipfile
            from pathlib import Path
            output=Path("sandium-output")
            apk=output/"Brave-debug-arm64.apk"
            try:
                state=json.loads((output/"build-state.json").read_text())
                manifest=json.loads((output/"build-manifest.json").read_text())
            except (OSError, json.JSONDecodeError):
                raise SystemExit("Cached APK metadata is missing")
            expected_commit=sys.argv[1]
            if state.get("source_commit") != expected_commit or manifest.get("source_commit") != expected_commit:
                raise SystemExit("Cached APK was built from a different source revision")
            if state.get("target") != "android-arm64-debug-apk" or state.get("build_config") != "Debug":
                raise SystemExit("Cached APK target/config mismatch")
            if state.get("compile_complete") is not True or state.get("artifact_verified") is not True:
                raise SystemExit("Cached APK state is not marked complete and verified")
            if manifest.get("artifact_verified") is not True or manifest.get("apksigner_verification") != "PASS" or manifest.get("apk_zip_integrity") != "PASS":
                raise SystemExit("Cached APK lacks successful signature/integrity evidence")
            if not apk.is_file() or apk.stat().st_size < 1_000_000:
                raise SystemExit("Cached APK is absent or unexpectedly small")
            digest=hashlib.sha256(apk.read_bytes()).hexdigest()
            size=apk.stat().st_size
            if digest != state.get("apk_sha256") or digest != manifest.get("apk_sha256") or size != state.get("apk_bytes") or size != manifest.get("apk_bytes"):
                raise SystemExit("Cached APK does not match its SHA-256/size records")
            with zipfile.ZipFile(apk) as archive:
                if archive.testzip() is not None:
                    raise SystemExit("Cached APK ZIP CRC integrity failed")
                names=set(archive.namelist())
                if "AndroidManifest.xml" not in names or not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                    raise SystemExit("Cached APK lacks Android manifest or DEX")
            badging=(output/"apk-badging.txt").read_text()
            match=re.search(r"^package: name='([^']+)'", badging, re.M)
            if not match or match.group(1) != manifest.get("app_package_name"):
                raise SystemExit("Cached APK package metadata mismatch")
            if not (output/"apksigner-verify.txt").is_file() or not (output/"sha256.txt").is_file():
                raise SystemExit("Cached APK handover evidence is incomplete")
            if manifest.get("build_input_fingerprint") != state.get("build_input_fingerprint"):
                raise SystemExit("Cached APK build-input fingerprint mismatch")
            print("VERIFIED_APK_CACHE=HIT")
            print("APK_SHA256="+digest)
            PY
            then
              echo 'export SANDIUM_VERIFIED_APK_CACHE_HIT=true' >> "$BASH_ENV"
            else
              echo "VERIFIED_APK_CACHE=MISS"
              rm -rf sandium-output
              mkdir -p sandium-output
              echo 'export SANDIUM_VERIFIED_APK_CACHE_HIT=false' >> "$BASH_ENV"
            fi


  install-sandium-android-build-deps:
    steps:
      - run:
          name: Install Android build dependencies on this fresh machine
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            test -x src/build/install-build-deps.sh
            sudo src/build/install-build-deps.sh --android
            echo "ANDROID_BUILD_DEPS_INSTALLED_ON_CURRENT_JOB=true"

  configure-sandium-remote-cache:
    steps:
      - run:
          name: Configure SANDIUM-only BuildBuddy backend
          command: |
            set -euo pipefail
            : "${BUILDBUDDY_API_KEY:?Missing protected CircleCI environment variable BUILDBUDDY_API_KEY}"
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=sandium/android-arm64/ci
            cd src/brave
            python3 ci/siso/write_buildbuddy_env.py
            if grep -Fq "$BUILDBUDDY_API_KEY" .env; then
              echo "BuildBuddy API key unexpectedly appears in generated .env"
              exit 1
            fi
            git check-ignore -q .env
            cd "$HOME/project"
            grep -Fxq 'rbe_service=remote.buildbuddy.io:443' src/brave/.env
            grep -Fxq 'projects_chrome_custom_vars_reapi_instance=sandium/android-arm64/ci' src/brave/.env
            grep -Fxq 'use_remoteexec=false' src/brave/.env
            echo "REMOTE_EXECUTION_CONFIGURED_FOR_SYNC_ONLY=true"
            echo "REMOTE_EXECUTION_AND_CACHE_USAGE=REQUIRES_GENERATED_ARGS_AND_SISO_STATS"

jobs:
  stage-1-source-foundation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      - restore-sandium-apk-cache
      - run:
          name: Exit this stage when a verified APK cache exists
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_VERIFIED_APK_CACHE_HIT:-false}" == "true" ]]; then
              echo "VERIFIED_APK_REUSED=true; no Chromium compile or dependency setup required"
              circleci-agent step halt
            fi
      - restore-sandium-source
      - checkout:
          path: src/brave
      - run:
          name: Verify source pins before any expensive work
          command: |
            set -euo pipefail
            cd src/brave
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"
            python3 - \<<'PY'
            import json
            from pathlib import Path
            p=json.loads(Path("package.json").read_text())
            actual=(p["version"],p["config"]["projects"]["chrome"]["tag"])
            expected=("1.100.10","156.1.100.0")
            print("BRAVE_CORE_VERSION="+actual[0])
            print("CHROMIUM_PIN="+actual[1])
            if actual != expected: raise SystemExit(f"Expected {expected}, got {actual}")
            PY
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Synchronize pinned source and dependencies with shallow history
          no_output_timeout: 40m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            cd src/brave
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=sandium/android-arm64/ci
            python3 ci/siso/write_buildbuddy_env.py
            set +e
            timeout --signal=INT --kill-after=30s 32m pnpm run sync --target_os=android --target_arch=arm64 --no-history 2>&1 | tee "$HOME/project/build-diagnostics/source-sync.log"
            sync_status=${PIPESTATUS[0]}
            set -e
            echo "$sync_status" > "$HOME/project/build-diagnostics/source-sync-exit.txt"
            if [[ "$sync_status" -ne 0 ]]; then
              echo "SOURCE_SYNC_FAILED_OR_TIMED_OUT=$sync_status; preserve diagnostics and do not start compilation"
              exit "$sync_status"
            fi
            cd "$HOME/project"
            sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
            python3 - \<<'PY'
            import shutil, subprocess
            # Brave downstream patches rewrite chrome/VERSION to the Brave product
            # version, so validate Chromium via its pinned Git tag instead.
            actual = subprocess.check_output(
                ["git", "-C", "src", "describe", "--tags", "--exact-match", "HEAD"],
                text=True,
            ).strip()
            print("CHROMIUM_SOURCE_TAG=" + actual)
            if actual != "156.1.100.0":
                raise SystemExit(f"Chromium source tag mismatch: {actual}")
            free = shutil.disk_usage(".").free
            print(f"FREE_DISK_AFTER_SYNC_BYTES={free}")
            if free < 20 * 1024**3:
                raise SystemExit("Less than 20 GiB free after source sync")
            PY
            mkdir -p build-diagnostics
            git -C src rev-parse HEAD > build-diagnostics/chromium-commit.txt
            python3 - \<<'PY'
            import hashlib, json
            from pathlib import Path
            p = Path("src/chrome/VERSION")
            manifest = {
              "schema": 2,
              "chromium_commit": __import__("subprocess").check_output(["git","-C","src","rev-parse","HEAD"], text=True).strip(),
              "chromium_version": "156.1.100.0",
              "version_file_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "target": "android-arm64-debug-apk"
            }
            Path(".sandium-source-cache-manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
            PY
      - run:
          name: Verify Chromium-only cache boundary
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/chrome/VERSION
            test "$(git -C src rev-parse HEAD)" = "$(cat build-diagnostics/chromium-commit.txt)"
            echo "CACHE_ROOT=src"
            echo "FRESH_BRAVE_CORE_CHECKOUT_EXCLUDED=true"
      - run:
          name: Record source-cache footprint before save
          command: |
            set -euo pipefail
            du -sb src | awk '{print "SOURCE_CACHE_BYTES=" $1}'
            df -B1 . | tail -n 1
      - save_cache:
          key: sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-{{ .BuildNum }}
          paths:
            - src/brave/node_modules
            - src/brave/.sandium-pnpm-lock.sha256
            - ~/.local/share/pnpm/store
      - run:
          name: Temporarily exclude Brave Core from the Chromium-only source cache
          command: |
            set -euo pipefail
            test -d src/brave/.git
            test -f .gclient
            test -f .brave_latest_successful_sync.json
            test -f src/chrome/VERSION
            test ! -e "$HOME/sandium-brave-core-cache-exclusion"
            mv src/brave "$HOME/sandium-brave-core-cache-exclusion"
            test -d src/.git
            test ! -e src/brave
            echo "CHROMIUM_SOURCE_CACHE_EXCLUDES_BRAVE_CORE=true"
      - save_cache:
          key: sandium-src-v5-chromium-156.1.100.0-{{ .BuildNum }}
          paths:
            - src
            - .gclient
            - .gclient_entries
            - .brave_latest_successful_sync.json
            - .sandium-source-cache-manifest.json
      - run:
          name: Restore Brave Core checkout after the source-cache save
          command: |
            set -euo pipefail
            test -d "$HOME/sandium-brave-core-cache-exclusion/.git"
            test ! -e src/brave
            mv "$HOME/sandium-brave-core-cache-exclusion" src/brave
            test "$(git -C src/brave rev-parse HEAD)" = "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"
      - run:
          name: Confirm source-cache save request
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/chrome/VERSION
            echo "SOURCE_CACHE_SAVE_REQUESTED=true"
            echo "CACHE_SAVE_IS_NOT_YET_PROVEN_UNTIL_NEXT_RUN_RESTORES_IT=true"
      - store_artifacts:
          path: build-diagnostics
          destination: stage-1-source-foundation

  stage-2-graph-and-compile-window:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      - restore-sandium-apk-cache
      - run:
          name: Exit this stage when a verified APK cache exists
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_VERIFIED_APK_CACHE_HIT:-false}" == "true" ]]; then
              echo "VERIFIED_APK_REUSED=true; no Chromium compile or dependency setup required"
              circleci-agent step halt
            fi
      - restore-sandium-source
      - checkout:
          path: src/brave
      - restore-sandium-build-output
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse pinned Node dependencies; install only after lockfile change
          command: |
            set -euo pipefail
            LOCK_HASH="$(sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}')"
            if [[ -d src/brave/node_modules && -s src/brave/.sandium-pnpm-lock.sha256 && "$(cat src/brave/.sandium-pnpm-lock.sha256)" == "$LOCK_HASH" ]]; then
              echo "PNPM_DEPENDENCIES=REUSED"
            else
              cd src/brave
              pnpm install --frozen-lockfile --prefer-offline
              cd "$HOME/project"
              sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
              echo "PNPM_DEPENDENCIES=INSTALLED"
            fi
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Validate fingerprint, configure GN and compile window 1
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            p=Path("src/chrome/VERSION").read_text()
            fields=dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$",p,re.M))
            v=".".join(fields[k] for k in ("MAJOR","MINOR","BUILD","PATCH"))
            if v != "156.1.100.0": raise SystemExit("Invalid Chromium pin")
            Path("build-diagnostics/fingerprint.json").write_text(json.dumps({
              "brave_core_commit":subprocess.check_output(["git","-C","src/brave","rev-parse","HEAD"],text=True).strip(),
              "chromium_commit":subprocess.check_output(["git","-C","src","rev-parse","HEAD"],text=True).strip(),
              "chromium_version":v,"target":"android-arm64","config":"Debug","format":"apk",
              "siso_revision":"c574896b272b40aac6e44c228ee0b471ea7e3d7d",
              "build_command_args":["Debug","--target_os=android","--target_arch=arm64","--target_android_output_format=apk","--use_remoteexec","true","--gn","use_siso:true","--gn","use_reclient:false"]
            },indent=2)+"\n")
            PY
            cd src/brave
            started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            remaining_compile_seconds="$(( 3000 - elapsed_seconds - 600 ))"
            if [[ "$remaining_compile_seconds" -gt 2400 ]]; then remaining_compile_seconds=2400; fi
            if [[ "$remaining_compile_seconds" -le 0 ]]; then
              echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; refusing to compile without handover margin"
              exit 5
            fi
            echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
            echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
            set +e
            timeout --signal=INT --kill-after=30s "${remaining_compile_seconds}s" pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-1.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-1-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-1.log"
            evidence="$HOME/project/build-diagnostics/compile-window-1-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 124 ]]; then exit "$status"; fi
            echo "INTERMEDIATE_WINDOW_STOP_ACCEPTED=$status"
      - run:
          name: Validate effective GN flags and checkpoint Stage-2 output
          command: |
            set -euo pipefail
            ARGS=src/out/android_Debug_arm64/args.gn
            if [[ ! -s "$ARGS" ]]; then
              echo "Expected generated GN arguments at $ARGS."
              find src/out -name args.gn -type f -print || true
              exit 4
            fi
            status="$(cat build-diagnostics/compile-window-1-exit.txt)"
            COMPLETE=false
            if [[ "$status" == "0" || -s src/out/android_Debug_arm64/apks/Bravearm64.apk ]]; then
              COMPLETE=true
            fi
            python3 src/brave/ci/siso/build_state.py record --commit "$CIRCLE_SHA1" --stage stage-2 --compile-complete "$COMPLETE" --artifact-verified auto --log build-diagnostics/compile-window-1.log
            python3 src/brave/ci/siso/build_state.py fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
            mkdir -p sandium-output
            if [[ -s src/out/android_Debug_arm64/apks/Bravearm64.apk && "$(stat -c %s src/out/android_Debug_arm64/apks/Bravearm64.apk)" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-2
            else
              echo "APK_NOT_YET_AVAILABLE=stage-2"
            fi
      - save_cache:
          key: sandium-out-v3-{{ .Branch }}-chromium-156.1.100.0-android-debug-arm64-stage2-{{ .BuildNum }}
          paths:
            - src/out/android_Debug_arm64
      - save_cache:
          key: sandium-apk-v3-{{ .Branch }}-{{ .Revision }}-chromium-156.1.100.0-android-debug-arm64-stage2-{{ .BuildNum }}
          paths:
            - sandium-output
      - run:
          name: Include verified APK in downloadable stage-2 artifacts
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -s sandium-output/Brave-debug-arm64.apk ]]; then
              cp -f sandium-output/Brave-debug-arm64.apk build-diagnostics/
              cp -f sandium-output/build-manifest.json build-diagnostics/ 2>/dev/null || true
              cp -f sandium-output/build-state.json build-diagnostics/ 2>/dev/null || true
              echo "APK_ARTIFACT_STAGED=stage-2"
            else
              echo "APK_NOT_YET_AVAILABLE=stage-2"
            fi
      - store_artifacts:
          path: build-diagnostics
          destination: stage-2-compile-window

  stage-3-compile-continuation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      - restore-sandium-apk-cache
      - run:
          name: Exit this stage when a verified APK cache exists
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_VERIFIED_APK_CACHE_HIT:-false}" == "true" ]]; then
              echo "VERIFIED_APK_REUSED=true; no Chromium compile or dependency setup required"
              circleci-agent step halt
            fi
      - restore-sandium-source
      - checkout:
          path: src/brave
      - restore-sandium-build-output
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse pinned Node dependencies; install only after lockfile change
          command: |
            set -euo pipefail
            LOCK_HASH="$(sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}')"
            if [[ -d src/brave/node_modules && -s src/brave/.sandium-pnpm-lock.sha256 && "$(cat src/brave/.sandium-pnpm-lock.sha256)" == "$LOCK_HASH" ]]; then
              echo "PNPM_DEPENDENCIES=REUSED"
            else
              cd src/brave
              pnpm install --frozen-lockfile --prefer-offline
              cd "$HOME/project"
              sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
              echo "PNPM_DEPENDENCIES=INSTALLED"
            fi
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Compile window 2 using same target and remote action cache
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 src/brave/ci/siso/build_state.py fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
            cd src/brave
            started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            remaining_compile_seconds="$(( 3000 - elapsed_seconds - 600 ))"
            if [[ "$remaining_compile_seconds" -gt 2400 ]]; then remaining_compile_seconds=2400; fi
            if [[ "$remaining_compile_seconds" -le 0 ]]; then
              echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; refusing to compile without handover margin"
              exit 5
            fi
            echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
            echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
            set +e
            timeout --signal=INT --kill-after=30s "${remaining_compile_seconds}s" pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-2.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-2-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-2.log"
            evidence="$HOME/project/build-diagnostics/compile-window-2-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 124 ]]; then exit "$status"; fi
            echo "INTERMEDIATE_WINDOW_STOP_ACCEPTED=$status"
      - run:
          name: Checkpoint Stage-3 output and capture validated Siso statistics
          command: |
            set -euo pipefail
            status="$(cat build-diagnostics/compile-window-2-exit.txt)"
            COMPLETE=false
            if [[ "$status" == "0" || -s src/out/android_Debug_arm64/apks/Bravearm64.apk ]]; then
              COMPLETE=true
            fi
            python3 src/brave/ci/siso/build_state.py record --commit "$CIRCLE_SHA1" --stage stage-3 --compile-complete "$COMPLETE" --artifact-verified auto --log build-diagnostics/compile-window-2.log
            python3 src/brave/ci/siso/build_state.py fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
            mkdir -p sandium-output
            if [[ -s src/out/android_Debug_arm64/apks/Bravearm64.apk && "$(stat -c %s src/out/android_Debug_arm64/apks/Bravearm64.apk)" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-3
            else
              echo "APK_NOT_YET_AVAILABLE=stage-3"
            fi
      - save_cache:
          key: sandium-out-v3-{{ .Branch }}-chromium-156.1.100.0-android-debug-arm64-stage3-{{ .BuildNum }}
          paths:
            - src/out/android_Debug_arm64
      - save_cache:
          key: sandium-apk-v3-{{ .Branch }}-{{ .Revision }}-chromium-156.1.100.0-android-debug-arm64-stage3-{{ .BuildNum }}
          paths:
            - sandium-output
      - run:
          name: Include verified APK in downloadable stage-3 artifacts
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -s sandium-output/Brave-debug-arm64.apk ]]; then
              cp -f sandium-output/Brave-debug-arm64.apk build-diagnostics/
              cp -f sandium-output/build-manifest.json build-diagnostics/ 2>/dev/null || true
              cp -f sandium-output/build-state.json build-diagnostics/ 2>/dev/null || true
              echo "APK_ARTIFACT_STAGED=stage-3"
            else
              echo "APK_NOT_YET_AVAILABLE=stage-3"
            fi
      - store_artifacts:
          path: build-diagnostics
          destination: stage-3-compile-continuation

  stage-4-finish-and-package:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      - restore-sandium-apk-cache
      - run:
          name: Exit Stage 4 immediately when verified APK is reusable
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_VERIFIED_APK_CACHE_HIT:-false}" == "true" ]]; then
              echo "VERIFIED_APK_REUSED=true; skipping Chromium checkout, dependencies and compilation"
              circleci-agent step halt
            fi
      - restore-sandium-source
      - checkout:
          path: src/brave
      - restore-sandium-build-output
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse pinned Node dependencies, install only on cache miss
          command: |
            set -euo pipefail
            LOCK_HASH="$(sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}')"
            if [[ -d src/brave/node_modules && -s src/brave/.sandium-pnpm-lock.sha256 && "$(cat src/brave/.sandium-pnpm-lock.sha256)" == "$LOCK_HASH" ]]; then
              echo "PNPM_DEPENDENCIES=REUSED"
            else
              cd src/brave
              pnpm install --frozen-lockfile --prefer-offline
              cd "$HOME/project"
              sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
              echo "PNPM_DEPENDENCIES=INSTALLED"
            fi
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Final incremental compile, package and verify if APK appears
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics sandium-output
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            LOG="$HOME/project/build-diagnostics/compile-window-3.log"
            status=0

            if python3 "$STATE" check --mode compiled --commit "$CIRCLE_SHA1"; then
              echo "FINAL_COMPILE_SKIPPED=COMPLETED_COMPILE_STATE"
              : > "$LOG"
            else
              python3 "$STATE" fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
              cd src/brave
              set +e
            started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            remaining_compile_seconds="$(( 3000 - elapsed_seconds - 600 ))"
            if [[ "$remaining_compile_seconds" -gt 2400 ]]; then remaining_compile_seconds=2400; fi
            if [[ "$remaining_compile_seconds" -le 0 ]]; then
              echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; refusing to compile without handover margin"
              exit 5
            fi
            echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
            echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
              timeout --signal=INT --kill-after=30s "${remaining_compile_seconds}s" pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$LOG"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$HOME/project/build-diagnostics/compile-window-3-exit.txt"
              if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
                echo "Final compile window failed (status=$status)"
                exit "$status"
              fi
              if [[ "$status" -eq 124 ]]; then
                echo "FINAL_COMPILE_WINDOW_TIMED_OUT=124; preserving partial output for the next run"
              fi
              cd "$HOME/project"
            fi

            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)|local:[[:space:]]*[0-9]+[[:space:]]+remote:' "$LOG" > build-diagnostics/compile-window-3-remote-cache-log-candidates.txt; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < build-diagnostics/compile-window-3-remote-cache-log-candidates.txt)"
            else
              : > build-diagnostics/compile-window-3-remote-cache-log-candidates.txt
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
            fi

            COMPLETE=false
            if [[ "$status" -eq 0 || -s "$OUT/apks/Bravearm64.apk" ]]; then
              COMPLETE=true
            fi
            python3 "$STATE" record --commit "$CIRCLE_SHA1" --stage stage-4 --compile-complete "$COMPLETE" --artifact-verified auto --log "$LOG"
            if [[ -s "$OUT/apks/Bravearm64.apk" && "$(stat -c %s "$OUT/apks/Bravearm64.apk")" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-4
            else
              echo "APK_NOT_YET_AVAILABLE=stage-4; output cache will be kept for the next run"
            fi
      - save_cache:
          key: sandium-out-v3-{{ .Branch }}-chromium-156.1.100.0-android-debug-arm64-stage4-{{ .BuildNum }}
          paths:
            - src/out/android_Debug_arm64
      - save_cache:
          key: sandium-apk-v3-{{ .Branch }}-{{ .Revision }}-chromium-156.1.100.0-android-debug-arm64-stage4-{{ .BuildNum }}
          paths:
            - sandium-output
      - run:
          name: Include verified APK in downloadable stage-4 artifacts
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -s sandium-output/Brave-debug-arm64.apk ]]; then
              cp -f sandium-output/Brave-debug-arm64.apk build-diagnostics/
              cp -f sandium-output/build-manifest.json build-diagnostics/ 2>/dev/null || true
              cp -f sandium-output/build-state.json build-diagnostics/ 2>/dev/null || true
              echo "APK_ARTIFACT_STAGED=stage-4"
            else
              echo "APK_NOT_YET_AVAILABLE=stage-4"
            fi
      - store_artifacts:
          path: build-diagnostics
          destination: stage-4-finish-build

  stage-5-verify-publish:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      - restore-sandium-apk-cache
      - run:
          name: Independently verify a cached APK and skip all build work on a hit
          command: |
            set -euo pipefail
            if [[ "${SANDIUM_VERIFIED_APK_CACHE_HIT:-false}" != "true" ]]; then
              echo "VERIFIED_APK_CACHE=MISS; Stage 5 will perform the fourth bounded compile window"
              exit 0
            fi
            python3 - \<<'PY'
            import hashlib, json, re, zipfile
            from pathlib import Path
            out=Path("sandium-output")
            apk=out/"Brave-debug-arm64.apk"
            manifest=json.loads((out/"build-manifest.json").read_text())
            state=json.loads((out/"build-state.json").read_text())
            digest=hashlib.sha256(apk.read_bytes()).hexdigest()
            if digest != manifest.get("apk_sha256") or digest != state.get("apk_sha256"):
                raise SystemExit("APK hash differs between artifact, state and manifest")
            if not manifest.get("artifact_verified") or manifest.get("apksigner_verification") != "PASS":
                raise SystemExit("APK signature verification record is missing")
            if manifest.get("build_input_fingerprint") != state.get("build_input_fingerprint"):
                raise SystemExit("APK and state build fingerprints differ")
            with zipfile.ZipFile(apk) as archive:
                if archive.testzip() is not None:
                    raise SystemExit("APK ZIP CRC integrity failure")
                names=set(archive.namelist())
                if "AndroidManifest.xml" not in names or not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                    raise SystemExit("APK is missing Android manifest or DEX")
            badging=(out/"apk-badging.txt").read_text()
            match=re.search(r"^package: name='([^']+)'",badging,re.M)
            if not match or match.group(1) != manifest.get("app_package_name"):
                raise SystemExit("APK package name evidence does not match")
            print("APK_INTEGRITY=PASS")
            print("APK_SIGNATURE_VERIFICATION=PASS")
            print("APK_SHA256="+digest)
            print("APK_BYTES="+str(apk.stat().st_size))
            print("APK_PACKAGE="+manifest["app_package_name"])
            print("APK_ARTIFACT_VERIFIED=true")
            print("SISO_REMOTE_BACKEND_PROVEN="+str(manifest.get("remote_execution_usage", {}).get("proven_from_siso_stats", False)).lower())
            PY
            echo "VERIFIED_APK_REUSED=true; no Chromium checkout, dependency setup or compile is needed"
            circleci-agent step halt
      - restore-sandium-source
      - checkout:
          path: src/brave
      - restore-sandium-build-output
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse pinned Node dependencies; install only on cache miss
          command: |
            set -euo pipefail
            LOCK_HASH="$(sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}')"
            if [[ -d src/brave/node_modules && -s src/brave/.sandium-pnpm-lock.sha256 && "$(cat src/brave/.sandium-pnpm-lock.sha256)" == "$LOCK_HASH" ]]; then
              echo "PNPM_DEPENDENCIES=REUSED"
            else
              cd src/brave
              pnpm install --frozen-lockfile --prefer-offline
              cd "$HOME/project"
              sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
              echo "PNPM_DEPENDENCIES=INSTALLED"
            fi
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Final incremental compile window 4 with Siso remote execution
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics sandium-output
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            LOG="$HOME/project/build-diagnostics/compile-window-4.log"
            status=0
            if [[ -s "$OUT/apks/Bravearm64.apk" && "$(stat -c %s "$OUT/apks/Bravearm64.apk")" -ge 1000000 ]]; then
              echo "FINAL_STAGE_COMPILE_SKIPPED=APK_ALREADY_PRESENT_IN_RESTORED_OUTPUT"
              : > "$LOG"
            else
              python3 "$STATE" fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
              cd src/brave
              started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
              elapsed_seconds="$(( $(date +%s) - started_at ))"
              remaining_compile_seconds="$(( 3000 - elapsed_seconds - 600 ))"
              if [[ "$remaining_compile_seconds" -gt 2400 ]]; then remaining_compile_seconds=2400; fi
              if [[ "$remaining_compile_seconds" -le 0 ]]; then
                echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; preserving state and handover time"
                status=5
              else
                echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
                echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
                set +e
                timeout --signal=INT --kill-after=30s "${remaining_compile_seconds}s" pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$LOG"
                status=${PIPESTATUS[0]}
                set -e
              fi
            fi
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-4-exit.txt"
            evidence="$HOME/project/build-diagnostics/compile-window-4-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)|local:[[:space:]]*[0-9]+[[:space:]]+remote:' "$LOG" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
            else
              : > "$evidence"
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
            fi
            echo "FINAL_COMPILE_WINDOW_STATUS=$status"
      - run:
          name: Checkpoint Stage 5 output and package APK if it appeared
          command: |
            set -euo pipefail
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            status="$(cat build-diagnostics/compile-window-4-exit.txt)"
            COMPLETE=false
            if [[ "$status" == "0" || -s "$OUT/apks/Bravearm64.apk" ]]; then COMPLETE=true; fi
            python3 "$STATE" record --commit "$CIRCLE_SHA1" --stage stage-5 --compile-complete "$COMPLETE" --artifact-verified auto --log build-diagnostics/compile-window-4.log
            python3 "$STATE" fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.json
            if [[ -s "$OUT/apks/Bravearm64.apk" && "$(stat -c %s "$OUT/apks/Bravearm64.apk")" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-5
            else
              echo "APK_NOT_YET_AVAILABLE_AFTER_FIVE_STAGE_WINDOWS=true"
            fi
      - save_cache:
          key: sandium-out-v3-{{ .Branch }}-chromium-156.1.100.0-android-debug-arm64-stage5-{{ .BuildNum }}
          paths:
            - src/out/android_Debug_arm64
      - save_cache:
          key: sandium-apk-v3-{{ .Branch }}-{{ .Revision }}-chromium-156.1.100.0-android-debug-arm64-stage5-{{ .BuildNum }}
          paths:
            - sandium-output
      - run:
          name: Include verified APK in downloadable stage-5 artifacts
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -s sandium-output/Brave-debug-arm64.apk ]]; then
              cp -f sandium-output/Brave-debug-arm64.apk build-diagnostics/
              cp -f sandium-output/build-manifest.json build-diagnostics/ 2>/dev/null || true
              cp -f sandium-output/build-state.json build-diagnostics/ 2>/dev/null || true
              echo "APK_ARTIFACT_STAGED=stage-5"
            else
              echo "APK_NOT_YET_AVAILABLE=stage-5"
            fi
      - store_artifacts:
          path: build-diagnostics
          destination: stage-5-finish-build
      - run:
          name: Fail clearly if no APK exists after all five stages; otherwise verify it independently
          command: |
            set -euo pipefail
            if [[ ! -s sandium-output/Brave-debug-arm64.apk ]]; then
              echo "APK_NOT_YET_AVAILABLE_AFTER_FIVE_STAGE_WINDOWS=true"
              exit 23
            fi
            python3 - \<<'PY'
            import hashlib, json, zipfile
            from pathlib import Path
            out=Path("sandium-output")
            apk=out/"Brave-debug-arm64.apk"
            manifest=json.loads((out/"build-manifest.json").read_text())
            state=json.loads((out/"build-state.json").read_text())
            digest=hashlib.sha256(apk.read_bytes()).hexdigest()
            if digest != manifest.get("apk_sha256") or digest != state.get("apk_sha256"):
                raise SystemExit("APK hash differs between artifact, state and manifest")
            if not manifest.get("artifact_verified") or manifest.get("apksigner_verification") != "PASS":
                raise SystemExit("APK signature verification record is missing")
            if manifest.get("build_input_fingerprint") != state.get("build_input_fingerprint"):
                raise SystemExit("APK and state build fingerprints differ")
            with zipfile.ZipFile(apk) as archive:
                if archive.testzip() is not None:
                    raise SystemExit("APK ZIP CRC integrity failure")
                names=set(archive.namelist())
                if "AndroidManifest.xml" not in names or not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                    raise SystemExit("APK is missing Android manifest or DEX")
            print("APK_INTEGRITY=PASS")
            print("APK_SIGNATURE_VERIFICATION=PASS")
            print("APK_SHA256="+digest)
            print("APK_BYTES="+str(apk.stat().st_size))
            print("APK_PACKAGE="+manifest["app_package_name"])
            print("APK_ARTIFACT_VERIFIED=true")
            print("SISO_REMOTE_BACKEND_PROVEN="+str(manifest.get("remote_execution_usage", {}).get("proven_from_siso_stats", False)).lower())
            PY

workflows:
  sandium-android-debug-apk:
    when: << pipeline.parameters.run_sandium_android_apk_build >>
    jobs:
      - stage-1-source-foundation
      - stage-2-graph-and-compile-window:
          requires:
            - stage-1-source-foundation
      - stage-3-compile-continuation:
          requires:
            - stage-2-graph-and-compile-window
      - stage-4-finish-and-package:
          requires:
            - stage-3-compile-continuation
      - stage-5-verify-publish:
          requires:
            - stage-4-finish-and-package

              echo "PNPM_DEPENDENCIES=INSTALLED"
            fi
      - ensure-sandium-brave-child-dependencies
      - install-sandium-android-build-deps
      - ensure-sandium-depot-tools
      - run:
          name: Preflight GN executable in this stage's fresh environment
          command: |
            set -euo pipefail

version: 2.1
parameters:
  run_sandium_android_apk_build:
    type: boolean
    default: false
  # Explicit Stage 1-only bootstrap: performs the guarded first compile window
  # and publishes a resumable checkpoint without scheduling Stages 2–5.
  run_sandium_stage1_bootstrap:
    type: boolean
    default: false
  run_sandium_ci_smoke_test:
    type: boolean
    default: false
  # Keep the duplicate standalone gate opt-in; full builds already run it in Stage 1 before Chromium restore.
  run_sandium_fast_regression:
    type: boolean
    default: false
  # APK builds are opt-in, but an explicitly requested APK build runs all compile windows by default.
  run_sandium_compile_windows:
    type: boolean
    default: true
  run_sandium_checkpoint_discovery_probe:
    type: boolean
    default: false
  # Runs historical checkpoint ranking/restore validation only; never compiles or authorizes a cold build.
  run_sandium_checkpoint_discovery:
    type: boolean
    default: false
  run_sandium_checkpoint_unit_tests:
    type: boolean
    default: false
  run_sandium_checkpoint_restore_validation:
    type: boolean
    default: false
commands:
  sandium-smoke-checkpoint:
    parameters:
      stage:
        type: integer
      previous_stage:
        type: integer
    steps:
      - run:
          name: Run lightweight SANDIUM smoke checks and persist stage checkpoint
          command: |
            set -euo pipefail
            if [[ "<< parameters.stage >>" == "2" ]]; then
              python3 tests/ci/test_siso_build_state.py
              python3 tests/ci/test_timeout_policy.py
              python3 tests/ci/test_smoke_checkpoint.py
              python3 tests/ci/test_siso_remote_preflight.py
              python3 tests/ci/test_siso_checkpoint_catalog.py
            fi
            python3 ci/smoke/checkpoint.py "<< parameters.stage >>" "<< parameters.previous_stage >>"
  generate-sandium-brave-version-gni:
    steps:
      - run:
          name: Generate and validate Brave version.gni before GN
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            BRAVE="$ROOT/src/brave"
            VERSION="$ROOT/src/chrome/VERSION"
            VERSION_CHROMIUM="$ROOT/src/chrome/VERSION.chromium"
            test -s "$VERSION" || { echo "SANDIUM_REQUIRED_INPUT_MISSING=src/chrome/VERSION"; exit 1; }
            test -s "$VERSION_CHROMIUM" || { echo "SANDIUM_REQUIRED_INPUT_MISSING=src/chrome/VERSION.chromium"; exit 1; }
            cd "$BRAVE"
            python3 build/util/version.py gen ../chrome/VERSION
            test -s build/version.gni || { echo "SANDIUM_BRAVE_VERSION_GNI=FAIL"; exit 1; }
            grep -q '^brave_version = ' build/version.gni
            grep -q '^chrome_version_string = ' build/version.gni
            echo "SANDIUM_BRAVE_VERSION_GNI=GENERATED_AND_VALIDATED"
            grep -E '^(brave_version|chrome_version_string) = ' build/version.gni
  install-sandium-node:
    steps:
      - run:
          name: Install pinned Node and pnpm
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential ca-certificates curl python-is-python3 python3-setuptools xz-utils
            NODE_VERSION=24.16.0
            curl --fail --location --silent --show-error "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            sudo mkdir -p /opt/sandium-node
            sudo tar -xJf /tmp/node.tar.xz -C /opt/sandium-node --strip-components=1
            echo "export PATH=/opt/sandium-node/bin:\$PATH" >> "$BASH_ENV"
            export PATH="/opt/sandium-node/bin:$PATH"
            node --version
            npm install --global pnpm@11.11.0
            pnpm --version
  snapshot-sandium-source-cache-inputs:
    steps:
      - run:
          name: Snapshot stable source-cache identity files before restoring Chromium
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            # Brave Core is checked out under brave-core for this workflow,
            # matching the build workflows; Chromium is restored separately into src.
            SOURCE="$ROOT/brave-core"
            SNAPSHOT="$ROOT/.sandium-source-cache-inputs"
            test -d "$SOURCE/.git"
            rm -rf "$SNAPSHOT"
            mkdir -p "$SNAPSHOT"
            for relative in \
              ci/pins/chromium-tag.txt \
              DEPS \
              package.json \
              pnpm-lock.yaml \
              build/commands/lib/config.ts \
              build/commands/lib/syncUtils.ts \
              build/commands/scripts/sync.ts; do
              test -s "$SOURCE/$relative"
              mkdir -p "$SNAPSHOT/$(dirname "$relative")"
              cp -f "$SOURCE/$relative" "$SNAPSHOT/$relative"
            done
            echo "SANDIUM_SOURCE_CACHE_INPUT_SNAPSHOT=PASS"
  validate-sandium-source-cache-inputs:
    steps:
      - run:
          name: Validate Brave sync-input fingerprint against restored Chromium cache
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            python3 "$ROOT/src/brave/ci/siso/source_cache_key.py" --root "$ROOT"
            expected="$(python3 - "$ROOT/.sandium-source-cache-manifest.json" \<<'PY'
            import json, sys
            from pathlib import Path
            manifest=json.loads(Path(sys.argv[1]).read_text())
            print(manifest.get("brave_sync_inputs_fingerprint", ""))
            PY
            )"
            actual="$(sed -n 's/^fingerprint=//p' "$ROOT/.sandium-source-cache-key.txt")"
            if [[ -z "$expected" || -z "$actual" ]]; then
              echo "SANDIUM_SOURCE_CACHE_INPUT_FINGERPRINT=INVALID_OR_MISSING"
              exit 34
            fi
            if [[ "$expected" != "$actual" ]]; then
              echo "SANDIUM_SOURCE_CACHE_INPUT_FINGERPRINT=MISMATCH"
              echo "CACHED_BRAVE_SYNC_INPUTS=$expected"
              echo "CURRENT_BRAVE_SYNC_INPUTS=$actual"
              exit 35
            fi
            echo "SANDIUM_SOURCE_CACHE_INPUT_FINGERPRINT=PASS"
  restore-sandium-source:
    steps:
      - restore_cache:
          name: Restore Chromium source by stable Brave sync-input identity
          keys:
            - sandium-src-v7-{{ checksum ".sandium-source-cache-inputs/ci/pins/chromium-tag.txt" }}-{{ checksum ".sandium-source-cache-inputs/DEPS" }}-{{ checksum ".sandium-source-cache-inputs/package.json" }}-{{ checksum ".sandium-source-cache-inputs/pnpm-lock.yaml" }}-{{ checksum ".sandium-source-cache-inputs/build/commands/lib/config.ts" }}-{{ checksum ".sandium-source-cache-inputs/build/commands/lib/syncUtils.ts" }}-{{ checksum ".sandium-source-cache-inputs/build/commands/scripts/sync.ts" }}-
            - sandium-src-v6-{{ .Branch }}-
            - sandium-src-v6-
      - run:
          name: Validate restored Chromium source cache or record cold start
          command: |
            set -euo pipefail
            valid_cache=false
            if [[ -d src/.git && -f src/chrome/VERSION ]]; then
              if python3 - \<<'PY'
            import hashlib, json, re, subprocess, sys
            from pathlib import Path
            try:
                tag = subprocess.check_output(
                    ["git", "-C", "src", "describe", "--tags", "--exact-match", "HEAD"],
                    text=True, stderr=subprocess.PIPE,
                ).strip()
                if not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", tag):
                    raise ValueError(f"invalid Chromium source tag: {tag!r}")
                manifest = json.loads(Path(".sandium-source-cache-manifest.json").read_text())
                chromium_sha = subprocess.check_output(
                    ["git", "-C", "src", "rev-parse", "HEAD"], text=True
                ).strip()
                version_sha256 = hashlib.sha256(Path("src/chrome/VERSION").read_bytes()).hexdigest()
                if manifest.get("schema") != 3:
                    raise ValueError("unsupported source-cache manifest schema")
                if manifest.get("chromium_version") != tag or manifest.get("chromium_tag") != tag:
                    raise ValueError("source-cache tag does not match the restored Chromium checkout")
                if manifest.get("chromium_commit") != chromium_sha:
                    raise ValueError("cached Chromium commit does not match the source manifest")
                if manifest.get("version_file_sha256") != version_sha256:
                    raise ValueError("cached VERSION file hash does not match the source manifest")
                if not Path(".gclient").is_file():
                    raise ValueError("cached .gclient file is missing")
                gclient_sha256 = hashlib.sha256(Path(".gclient").read_bytes()).hexdigest()
                if manifest.get("gclient_sha256") != gclient_sha256:
                    raise ValueError("cached .gclient file does not match the source manifest")
                print("RESTORED_CHROMIUM_SOURCE_TAG=" + tag)
                print("SOURCE_CACHE_FINGERPRINT=PASS")
            except Exception as exc:
                print("SOURCE_CACHE_VALIDATION_ERROR=" + str(exc), file=sys.stderr)
                raise SystemExit(1)
            PY
              then
                valid_cache=true
              fi
            fi
            if [[ "$valid_cache" == "true" ]]; then
              echo "SOURCE_CACHE=HIT"
              echo "SOURCE_CACHE_SCOPE=CHROMIUM_ONLY"
            else
              echo "SOURCE_CACHE=INVALID_OR_COLD_MISS"
              if [[ "$CIRCLE_JOB" != "stage-1-source-foundation" ]]; then
                echo "Required validated Chromium source cache missing in compile stage."
                exit 2
              fi
              rm -rf src
              rm -f .gclient .gclient_entries .brave_latest_successful_sync.json .sandium-source-cache-manifest.json
              echo "SOURCE_CACHE=INVALID_COLD_START"
            fi
  ensure-sandium-brave-child-dependencies:
    steps:
      - run:
          name: Restore missing Brave child dependencies without syncing Chromium
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            BRAVE="$ROOT/src/brave"
            OUT="$ROOT/src/out/android_Debug_arm64"
            required=(
              "$BRAVE/third_party/bip39wally-core-native/BUILD.gn"
              "$BRAVE/vendor/bat-native-tweetnacl/BUILD.gn"
            )
            missing=false
            for path in "${required[@]}"; do
              if [[ ! -s "$path" ]]; then
                echo "SANDIUM_REQUIRED_BRAVE_DEPENDENCY_MISSING=$path"
                missing=true
              fi
            done
            if [[ "$missing" == "true" ]]; then
              test -s "$BRAVE/package.json"
              test -s "$ROOT/src/DEPS"
              before_commit="$(git -C "$ROOT/src" rev-parse HEAD)"
              before_tag="$(git -C "$ROOT/src" describe --tags --exact-match HEAD)"
              mkdir -p "$ROOT/build-diagnostics"
              cd "$BRAVE"
              set +e
              pnpm run sync --target_os=android --target_arch=arm64 --no-history --sync_chromium=false 2>&1 | tee "$ROOT/build-diagnostics/continuation-brave-deps-sync.log"
              sync_status=${PIPESTATUS[0]}
              set -e
              cd "$ROOT"
              if [[ "$sync_status" -ne 0 ]]; then
                echo "SANDIUM_CONTINUATION_BRAVE_DEPS_SYNC=FAIL status=$sync_status"
                exit "$sync_status"
              fi
              after_commit="$(git -C "$ROOT/src" rev-parse HEAD)"
              after_tag="$(git -C "$ROOT/src" describe --tags --exact-match HEAD)"
              if [[ "$after_commit" != "$before_commit" || "$after_tag" != "$before_tag" ]]; then
                echo "SANDIUM_CHROMIUM_PIN_PRESERVATION=FAIL before=$before_tag@$before_commit after=$after_tag@$after_commit"
                exit 35
              fi
              echo "SANDIUM_CONTINUATION_BRAVE_DEPS_SYNC=PASS"
            else
              echo "SANDIUM_CONTINUATION_BRAVE_DEPS_SYNC=SKIPPED_ALL_REQUIRED_DEPS_PRESENT"
            fi
            for path in "${required[@]}"; do
              test -s "$path" || {
                echo "SANDIUM_REQUIRED_BRAVE_DEPENDENCY_STILL_MISSING=$path"
                exit 33
              }
            done
            test -s "$OUT/build.ninja"
            test -s "$OUT/build.ninja.stamp"
            echo "SANDIUM_REQUIRED_BRAVE_GN_DEPENDENCIES=PASS"
  restore-sandium-build-output:
    parameters:
      stage_index:
        type: integer
    steps:
      - when:
          condition:
            equal: [1, << parameters.stage_index >>]
          steps:
            # Checkpoints are cumulative: stage N contains useful work from stages 1..N.
            # Try higher stages first so a lower-stage cache saved more recently cannot
            # mask a later-stage checkpoint. Within each stage, CircleCI still chooses
            # the newest matching cache; manifest/build-state validation rejects
            # corrupt or incompatible candidates.
            - restore_cache:
                name: Restore highest-stage prior-workflow SANDIUM checkpoint candidate
                keys:
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-5-
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-4-
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-3-
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-2-
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-1-
      - when:
          condition:
            equal: [2, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore this workflow's stage 1 checkpoint
                keys:
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-1-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-1-
      - when:
          condition:
            equal: [3, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore this workflow's stage 2 checkpoint
                keys:
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-2-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-2-
      - when:
          condition:
            equal: [4, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore this workflow's stage 3 checkpoint
                keys:
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-3-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-3-
      - when:
          condition:
            equal: [5, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore this workflow's stage 4 checkpoint
                keys:
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-4-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  - sandium-checkpoint-v7-{{ .Branch }}-stage-4-
      - run:
          name: Ensure zstd is available for compressed build checkpoints
          command: |
            set -euo pipefail
            if ! command -v zstd >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              sudo rm -f /etc/apt/sources.list.d/google-chrome.list
              sudo apt-get update
              sudo apt-get install -y zstd
            fi
            zstd --version
      - when:
          condition:
            equal: [1, << parameters.stage_index >>]
          steps:
            - run:
                name: Discover and restore best compatible checkpoint from prior workflows
                command: |
                  set -euo pipefail
                  python3 src/brave/ci/siso/checkpoint_artifact_discovery.py --root "$HOME/project"
      - run:
          name: Restore and integrity-check compressed Siso checkpoint
          command: |
            set -euo pipefail
            python3 src/brave/ci/siso/checkpoint.py restore --root "$HOME/project"
      - run:
          name: Validate restored Android build output and enforce stage handover
          command: |
            set -euo pipefail
            STAGE_INDEX=<< parameters.stage_index >>
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            cache_hit=false
            # Output metadata alone is insufficient: resuming Siso requires a
            # non-empty regular state file AND journal from the same checkpoint.
            SISO_STATE="$OUT/.siso_fs_state"
            SISO_JOURNAL="$OUT/.siso_fs_state.journal"
            siso_pair_valid=false
            if [[ -f "$SISO_STATE" && ! -L "$SISO_STATE" && -s "$SISO_STATE" &&
                  -f "$SISO_JOURNAL" && ! -L "$SISO_JOURNAL" && -s "$SISO_JOURNAL" ]]; then
              siso_pair_valid=true
            fi
            if [[ -d "$OUT" ]] &&
               python3 "$STATE" check --mode cache --commit "${CIRCLE_SHA1:?}"; then
              cache_hit=true
              if [[ "$siso_pair_valid" == "true" ]]; then
                echo "BUILD_OUTPUT_CACHE=COMPATIBLE_RESUMABLE_SISO"
                echo "SANDIUM_RESUME_MODE=FULL_SISO_STATE_AND_OUTPUTS"
              else
                # A missing Siso state pair must not invalidate compatible compiled
                # outputs. Ninja/Siso can re-evaluate output timestamps and compile
                # only stale/missing outputs; never discard the restored output tree.
                echo "BUILD_OUTPUT_CACHE=COMPATIBLE_OUTPUTS_ONLY"
                echo "SANDIUM_RESUME_MODE=INCREMENTAL_FROM_RESTORED_OUTPUTS"
              fi
              if python3 "$STATE" check --mode compiled --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_COMPILED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
              if python3 "$STATE" check --mode verified --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_VERIFIED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
            else
              if [[ -d "$OUT" && "$siso_pair_valid" != "true" ]]; then
                echo "BUILD_OUTPUT_CACHE=OUTPUT_ONLY_SISO_STATE_MISSING stage=$STAGE_INDEX"
                echo "SANDIUM_CHECKPOINT_RESUMABILITY=REJECTED_MISSING_STATE_PAIR"
              else
                echo "BUILD_OUTPUT_CACHE=MISS_OR_INCOMPATIBLE stage=$STAGE_INDEX"
              fi
              # Keep output intact until Stage 1 has proven no compatible resumable checkpoint exists.
            fi
            if [[ "$cache_hit" == "true" ]]; then
              echo 'export SANDIUM_BUILD_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              echo "SANDIUM_CHECKPOINT_HANDOVER_GATE=PASS"
              echo "SANDIUM_CHECKPOINT_RESUME=RESTORED_PRIOR_COMPILED_WORK"
            else
              echo 'export SANDIUM_BUILD_OUTPUT_CACHE_HIT=false' >> "$BASH_ENV"
              if [[ "$STAGE_INDEX" == "1" && -s .sandium-checkpoint-discovery-status ]] &&
                 { grep -Fxq "NO_COMPATIBLE_CANDIDATE" .sandium-checkpoint-discovery-status ||
                   grep -Fxq "NO_RESUMABLE_SISO_CANDIDATE" .sandium-checkpoint-discovery-status; }; then
                echo "SANDIUM_CHECKPOINT_HANDOVER_GATE=FAIL; no compatible prior-work checkpoint exists; cold start is prohibited"
                echo "SANDIUM_CHECKPOINT_RESUME=NO_COMPATIBLE_PRIOR_WORK_FOUND"
                echo "REQUIRED_PRIOR_WORK_CHECKPOINT=MISS"
                echo "REFUSING_UNVERIFIED_COLD_REBUILD=true"
                exit 42
              else
                echo "SANDIUM_CHECKPOINT_HANDOVER_GATE=FAIL; stage $STAGE_INDEX has no validated reusable checkpoint and no safe cold-start authorization" >&2
                echo "REQUIRED_PRIOR_WORK_CHECKPOINT=MISS"
                echo "REFUSING_UNVERIFIED_COLD_REBUILD=true"
                exit 42
              fi
            fi
  restore-sandium-siso-cache:
    steps:
      - restore_cache:
          name: Restore shared content-addressed Siso action cache across branches
          keys:
            - sandium-siso-v4-android-debug-arm64-
            - sandium-siso-v3-{{ .Branch }}-android-debug-arm64-
            - sandium-siso-v3-
      - run:
          name: Validate persistent Siso local action cache
          command: |
            set -euo pipefail
            mkdir -p sandium-siso-cache
            du -sb sandium-siso-cache | awk '{print "SISO_LOCAL_CACHE_BYTES=" $1}'
            echo "SISO_LOCAL_CACHE_DIRECTORY=$HOME/project/sandium-siso-cache"
            echo "SISO_LOCAL_CACHE_RESTORE_COMPLETED=true"
  restore-sandium-pnpm-cache:
    steps:
      - restore_cache:
          keys:
            - sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-
  restore-sandium-apk-cache:
    steps:
      - restore_cache:
          keys:
            - sandium-apk-v4-{{ .Branch }}-{{ .Revision }}-android-debug-arm64-
      - run:
          name: Verify reusable APK artifact without checking out Brave source
          command: |
            set -euo pipefail
            if python3 - "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}" \<<'PY'
            import hashlib, json, re, sys, zipfile
            from pathlib import Path
            output=Path("sandium-output")
            apk=output/"Brave-debug-arm64.apk"
            try:
                state=json.loads((output/"build-state.json").read_text())
                manifest=json.loads((output/"build-manifest.json").read_text())
            except (OSError, json.JSONDecodeError):
                raise SystemExit("Cached APK metadata is missing")
            expected_commit=sys.argv[1]
            if state.get("source_commit") != expected_commit or manifest.get("source_commit") != expected_commit:
                raise SystemExit("Cached APK was built from a different source revision")
            if state.get("target") != "android-arm64-debug-apk" or state.get("build_config") != "Debug":
                raise SystemExit("Cached APK target/config mismatch")
            chromium_version = state.get("chromium_version")
            if not isinstance(chromium_version, str) or not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", chromium_version):
                raise SystemExit("Cached APK lacks a valid resolved Chromium source tag")
            if manifest.get("chromium_version") != chromium_version:
                raise SystemExit("Cached APK manifest/state Chromium tags disagree")
            if state.get("compile_complete") is not True or state.get("artifact_verified") is not True:
                raise SystemExit("Cached APK state is not marked complete and verified")
            if manifest.get("artifact_verified") is not True or manifest.get("apksigner_verification") != "PASS" or manifest.get("apk_zip_integrity") != "PASS":
                raise SystemExit("Cached APK lacks successful signature/integrity evidence")
            if not apk.is_file() or apk.stat().st_size < 1_000_000:
                raise SystemExit("Cached APK is absent or unexpectedly small")
            digest=hashlib.sha256(apk.read_bytes()).hexdigest()
            size=apk.stat().st_size
            if digest != state.get("apk_sha256") or digest != manifest.get("apk_sha256") or size != state.get("apk_bytes") or size != manifest.get("apk_bytes"):
                raise SystemExit("Cached APK does not match its SHA-256/size records")
            with zipfile.ZipFile(apk) as archive:
                if archive.testzip() is not None:
                    raise SystemExit("Cached APK ZIP CRC integrity failed")
                names=set(archive.namelist())
                if "AndroidManifest.xml" not in names or not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                    raise SystemExit("Cached APK lacks Android manifest or DEX")
            badging=(output/"apk-badging.txt").read_text()
            match=re.search(r"^package: name='([^']+)'", badging, re.M)
            if not match or match.group(1) != manifest.get("app_package_name"):
                raise SystemExit("Cached APK package metadata mismatch")
            if not (output/"apksigner-verify.txt").is_file() or not (output/"sha256.txt").is_file():
                raise SystemExit("Cached APK handover evidence is incomplete")
            if manifest.get("build_input_fingerprint") != state.get("build_input_fingerprint"):
                raise SystemExit("Cached APK build-input fingerprint mismatch")
            print("VERIFIED_APK_CACHE=HIT")
            print("APK_SHA256="+digest)
            PY
            then
              echo 'export SANDIUM_VERIFIED_APK_CACHE_HIT=true' >> "$BASH_ENV"
            else
              echo "VERIFIED_APK_CACHE=MISS"
              rm -rf sandium-output
              mkdir -p sandium-output
              echo 'export SANDIUM_VERIFIED_APK_CACHE_HIT=false' >> "$BASH_ENV"
            fi
  ensure-sandium-depot-tools:
    steps:
      - restore_cache:
          keys:
            - sandium-depot-tools-v1
      - run:
          name: Ensure autoninja is available to the Brave build environment
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            DEPOT_TOOLS="$HOME/depot_tools"
            if [[ ! -x "$DEPOT_TOOLS/autoninja" ]]; then
              rm -rf "$DEPOT_TOOLS"
              git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
            fi
            # A fresh depot_tools checkout has wrappers but may not yet have
            # its hermetic Python bootstrap. Ensure it before any wrapper runs.
            if [[ ! -s "$DEPOT_TOOLS/python3_bin_reldir.txt" ]]; then
              echo "SANDIUM_DEPOT_TOOLS_BOOTSTRAP=START"
              "$DEPOT_TOOLS/update_depot_tools"
            fi
            test -s "$DEPOT_TOOLS/python3_bin_reldir.txt" || {
              echo "SANDIUM_DEPOT_TOOLS_BOOTSTRAP=FAIL; python3_bin_reldir.txt missing after update_depot_tools"
              exit 127
            }
            test -x "$DEPOT_TOOLS/autoninja" || {
              echo "SANDIUM_AUTONINJA_PREFLIGHT=FAIL; depot_tools/autoninja is missing"
              exit 127
            }
            echo "SANDIUM_DEPOT_TOOLS_BOOTSTRAP=PASS"
            echo "export PATH=$DEPOT_TOOLS:$ROOT/src/buildtools/linux64:\$PATH" >> "$BASH_ENV"
            export PATH="$DEPOT_TOOLS:$ROOT/src/buildtools/linux64:$PATH"
            echo "SANDIUM_DEPOT_TOOLS_PATH=$DEPOT_TOOLS"
            echo "SANDIUM_DEPOT_TOOLS_REVISION=$(git -C "$DEPOT_TOOLS" rev-parse HEAD)"
            echo "SANDIUM_AUTONINJA_PATH=$(command -v autoninja)"
            cd "$ROOT/src/brave"
            node --input-type=module -e 'import { spawnSync } from "node:child_process"; import config from "./build/commands/lib/config.ts"; const options = config.defaultOptions; const depotTools = process.env.HOME + "/depot_tools"; const baseEnv = options.env || process.env; const env = { ...baseEnv, PATH: depotTools + ":" + (baseEnv.PATH || process.env.PATH || "") }; const lookup = spawnSync("bash", ["-c", "command -v autoninja"], { cwd: config.srcDir, env, encoding: "utf8" }); const resolved = lookup.stdout.trim(); if (lookup.error || lookup.status !== 0 || !resolved.startsWith(depotTools + "/")) { console.error("autoninja must resolve from initialized depot_tools: " + (lookup.error?.message || lookup.stderr || resolved || "no path")); process.exit(1); } console.log("SANDIUM_AUTONINJA_BUILD_ENV_PREFLIGHT=PASS path=" + resolved);'
      - save_cache:
          key: sandium-depot-tools-v1
          paths:
            - ~/depot_tools
  install-sandium-android-build-deps:
    steps:
      - run:
          name: Install Android build dependencies on this fresh machine
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            test -x src/build/install-build-deps.sh
            sudo src/build/install-build-deps.sh --android
            echo "ANDROID_BUILD_DEPS_INSTALLED_ON_CURRENT_JOB=true"
  configure-sandium-remote-cache:
    steps:
      - run:
          name: Configure SANDIUM-only BuildBuddy backend
          command: |
            set -euo pipefail
            : "${BUILDBUDDY_API_KEY:?Missing protected CircleCI environment variable BUILDBUDDY_API_KEY}"
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=default
            export SANDIUM_SISO_CACHE_DIR="$HOME/project/sandium-siso-cache"
            export SANDIUM_ENABLE_TRUSTED_RE_CACHE_WRITE=true
            cd src/brave
            python3 ci/siso/write_buildbuddy_env.py
            if grep -Fq "$BUILDBUDDY_API_KEY" .env; then
              echo "BuildBuddy API key unexpectedly appears in generated .env"
              exit 1
            fi
            git check-ignore -q .env
            cd "$HOME/project"
            grep -Fxq 'rbe_service=remote.buildbuddy.io:443' src/brave/.env
            grep -Fxq 'projects_chrome_custom_vars_reapi_instance=default' src/brave/.env
            grep -Fxq 'use_remoteexec=true' src/brave/.env
            grep -Fxq "siso_cache_dir=$HOME/project/sandium-siso-cache" src/brave/.env
            HELPER="$HOME/project/src/brave/ci/siso/buildbuddy-credential-helper.py"
            test -x "$HELPER"
            grep -Fxq "projects_chrome_custom_vars_reapi_credential_helper=$HELPER" src/brave/.env
            grep -Fq "$HELPER" "$HOME/project/.gclient"
            # Explicitly pass the non-Google REAPI credential helper to every Siso process.
            echo "export SISO_CREDENTIAL_HELPER=\"$HELPER\"" >> "$BASH_ENV"
            export SISO_CREDENTIAL_HELPER="$HELPER"
            python3 - "$HELPER" \<<'PY'
            import json, os, subprocess, sys
            helper = sys.argv[1]
            key = os.environ.get("BUILDBUDDY_API_KEY", "")
            if not key:
                raise SystemExit("BuildBuddy API key is missing")
            proc = subprocess.run(
                [sys.executable, helper, "get"],
                input=json.dumps({"uri": "https://remote.buildbuddy.io:443"}),
                text=True, capture_output=True, timeout=10, check=False,
            )
            if proc.returncode:
                raise SystemExit("BuildBuddy credential-helper protocol failed: " + proc.stderr[:1000])
            try:
                value = json.loads(proc.stdout)
            except json.JSONDecodeError:
                raise SystemExit("BuildBuddy credential helper returned invalid JSON")
            if value.get("headers", {}).get("x-buildbuddy-api-key") != [key]:
                raise SystemExit("BuildBuddy credential helper returned an unexpected header")
            print("SANDIUM_CREDENTIAL_HELPER_PROTOCOL=PASS secret_value_redacted=true")
            PY
            SISORC="$HOME/project/src/build/config/siso/.sisorc"
            grep -Fq -- '-local_cache_enable' "$SISORC"
            grep -Fq -- "-cache_dir \"$HOME/project/sandium-siso-cache\"" "$SISORC"
            grep -Fq -- '-re_cache_enable_write=true' "$SISORC"
            echo 'export SISO_LIMITS=local=8,remote=80' >> "$BASH_ENV"
            echo "SISO_CREDENTIAL_HELPER_CONFIGURED=$HELPER"
            echo "SISO_LOCAL_CACHE_CONFIGURED=true"
            echo "SISO_TRUSTED_REMOTE_CACHE_WRITE_CONFIGURED=true"
            echo "SISO_LIMITS=local=8,remote=80"
            echo "REMOTE_EXECUTION_CONFIGURED=true"
            echo "REMOTE_EXECUTION_AND_CACHE_USAGE=VERIFY_FROM_SISO_STATS"

  normalize-sandium-source-baseline:
    steps:
      - run:
          name: Normalize source filesystem baseline for Siso continuation
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            SRC_DIR="$ROOT/src"
            SRC_OUT="$SRC_DIR/out"
            OUT_DIR="$SRC_OUT/android_Debug_arm64"
            SOURCE_TIMESTAMP_EPOCH=946684800
            test -s "$SRC_DIR/DEPS"
            test -s "$SRC_DIR/chrome/VERSION"
            test -s "$SRC_DIR/build/config/compiler/compiler.gni"
            test -s "$SRC_DIR/brave/build/commands/lib/build.ts"
            test -s "$OUT_DIR/build.ninja"
            test -s "$OUT_DIR/args.gn"
            test -s "$OUT_DIR/args_generated.gni"
            test -e "$OUT_DIR/build.ninja.stamp"

            # Match SANDFOX's deterministic source-time baseline. Keep GN/Ninja
            # outputs and Git metadata untouched; skip Node dependencies because
            # they are not Ninja source inputs and may contain many files.
            find "$SRC_DIR" \( -name .git -o -name node_modules -o -path "$SRC_OUT" \) -prune -o -exec touch -h -d "@$SOURCE_TIMESTAMP_EPOCH" {} +

            for input in \
              "$SRC_DIR" \
              "$SRC_DIR/DEPS" \
              "$SRC_DIR/chrome/VERSION" \
              "$SRC_DIR/build/config/compiler/compiler.gni" \
              "$SRC_DIR/brave/build/commands/lib/build.ts"; do
              test -e "$input" || { echo "SOURCE_TIMESTAMP_VERIFY=FAIL missing=$input" >&2; exit 1; }
              actual="$(stat -c '%Y' "$input")"
              test "$actual" -eq "$SOURCE_TIMESTAMP_EPOCH" || {
                echo "SOURCE_TIMESTAMP_VERIFY=FAIL path=$input actual=$actual expected=$SOURCE_TIMESTAMP_EPOCH" >&2
                exit 1
              }
            done
            stamp_time="$(stat -c '%Y' "$OUT_DIR/build.ninja.stamp")"
            test "$stamp_time" -gt "$SOURCE_TIMESTAMP_EPOCH" || {
              echo "SOURCE_TIMESTAMP_VERIFY=FAIL build.ninja.stamp is not newer than normalized source" >&2
              exit 1
            }
            printf '%s\n' \
              "SOURCE_TIMESTAMP_POLICY=epoch_946684800_full_tree_v1" \
              "SOURCE_TIMESTAMP_VERIFY=PASS source_epoch=$SOURCE_TIMESTAMP_EPOCH build_ninja_stamp_epoch=$stamp_time" \
              > "$ROOT/build-diagnostics/source-timestamp-policy.txt"
            cat "$ROOT/build-diagnostics/source-timestamp-policy.txt"

jobs:
  sandium-fast-regression-gate:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Fast Siso compile-window regression gate (no Chromium restore/build)
          command: |
            set -euo pipefail
            python3 -m py_compile ci/siso/remote_preflight.py ci/siso/run_compile_window.py ci/siso/checkpoint.py ci/siso/build_state.py ci/siso/checkpoint_catalog.py ci/siso/checkpoint_artifact_discovery.py
            python3 tests/ci/test_siso_remote_preflight.py
            python3 tests/ci/test_run_compile_window.py
            python3 tests/ci/test_siso_checkpoint.py
            python3 tests/ci/test_siso_checkpoint_catalog.py
            python3 tests/ci/test_siso_checkpoint_artifact_discovery.py
            python3 tests/ci/test_resumable_pipeline_contract.py
  stage-1-source-foundation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - run:
          name: Start stage budget clock before restoration and handover
          command: date +%s > "$HOME/.sandium-stage-start-epoch"
      # Do not short-circuit on APK existence: Stage 1 must resume compatible compiled work.
      # The cumulative build-output checkpoint, not the APK cache, determines resume state.
      - checkout:
          path: brave-core
      # Catch Python syntax/runtime-import regressions before restoring/syncing
      # the large Chromium source tree, so a trivial preflight bug costs seconds.
      - run:
          name: Fast Siso preflight regression gate before Chromium restore
          command: |
            set -euo pipefail
            cd "$HOME/project/brave-core"
            python3 -m py_compile ci/siso/remote_preflight.py ci/siso/run_compile_window.py ci/siso/checkpoint.py
            python3 tests/ci/test_siso_remote_preflight.py
            python3 tests/ci/test_run_compile_window.py
            python3 tests/ci/test_siso_checkpoint.py
      - snapshot-sandium-source-cache-inputs
      - restore-sandium-source
      - run:
          name: Place Brave Core checkout after restoring Chromium source
          command: |
            set -euo pipefail
            test -d brave-core/.git
            test ! -e src/brave
            mkdir -p src
            mv brave-core src/brave
            test -d src/brave/.git
      - run:
          name: Validate Brave checkout metadata and manual Chromium pin
          command: |
            set -euo pipefail
            cd src/brave
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            python3 - \<<'PY'
            import json, re
            from pathlib import Path
            p=json.loads(Path("package.json").read_text())
            brave_version=p["version"]
            declared_tag=p["config"]["projects"]["chrome"]["tag"]
            pins = [
                line.strip()
                for line in Path("ci/pins/chromium-tag.txt").read_text().splitlines()
                if line.strip() and not line.lstrip().startswith("#")
            ]
            if len(pins) != 1 or not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", pins[0]):
                raise SystemExit("Manual Chromium pin file must contain exactly one four-part numeric tag")
            pinned_tag=pins[0]
            print("BRAVE_CORE_VERSION="+brave_version)
            print("BRAVE_DECLARED_CHROMIUM_TAG="+declared_tag)
            print("SANDIUM_PINNED_CHROMIUM_TAG="+pinned_tag)
            print("CHROMIUM_UPDATE_POLICY=MANUAL_PIN")
            if declared_tag != pinned_tag:
                print("BRAVE_DECLARED_TAG_DIFFERS_FROM_MANUAL_PIN=true")
                print("BRAVE_DECLARED_TAG_OVERRIDE=MANUAL_PIN_WINS")
            if not re.fullmatch(r"\d+\.\d+\.\d+", brave_version):
                raise SystemExit(f"Invalid Brave Core version in package.json: {brave_version!r}")
            if not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", declared_tag):
                raise SystemExit(f"Invalid declared Chromium tag in package.json: {declared_tag!r}")
            PY
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Synchronize pinned source and dependencies with shallow history
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            # The CircleCI checkout places this Sandium/Brave-Core fork at
            # src/brave; the workspace root contains cached Chromium, not a
            # second copy of the Sandium source files. Validate in place.
            cd "$HOME/project/src/brave"
            echo "SANDIUM_SYNC_OVERLAY=CHECKOUT_SOURCE"
            test -s build/commands/lib/config.ts
            test -s build/commands/lib/syncUtils.ts
            test -s ci/siso/write_buildbuddy_env.py
            test -s ci/siso/chromium_pin.py
            grep -q "chromiumAlreadyAtPinnedRef" build/commands/lib/syncUtils.ts
            grep -q "gclientHash: getGclientConfigHash()" build/commands/lib/syncUtils.ts
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=default
            export SANDIUM_SISO_CACHE_DIR="$HOME/project/sandium-siso-cache"
            export SANDIUM_ENABLE_TRUSTED_RE_CACHE_WRITE=true
            python3 ci/siso/write_buildbuddy_env.py
            python3 ci/siso/chromium_pin.py --workspace "$HOME/project"
            set +e
            # Keep dependency installation explicit, then syntax-check the
            # retry fix before invoking sync (which can start Chromium hooks).
            pnpm install --frozen-lockfile --yes
            node --check build/commands/lib/depotTools.js
            set +e
            timeout --signal=INT --kill-after=30s 32m node ./build/commands/scripts/sync.ts --target_os=android --target_arch=arm64 --no-history 2>&1 | tee "$HOME/project/build-diagnostics/source-sync.log"
            sync_status=${PIPESTATUS[0]}
            set -e
            echo "$sync_status" > "$HOME/project/build-diagnostics/source-sync-exit.txt"
            if [[ "$sync_status" -ne 0 ]]; then
              echo "SOURCE_SYNC_FAILED_OR_TIMED_OUT=$sync_status; preserve diagnostics and do not start compilation"
              exit "$sync_status"
            fi
            cd "$HOME/project"
            SISO_BIN="$HOME/project/src/third_party/siso/cipd/siso"
            if [[ ! -x "$SISO_BIN" ]]; then
              echo "SANDIUM_SISO_VERSION_VERIFY=FAIL missing=$SISO_BIN"
              find "$HOME/project/src/third_party/siso" -maxdepth 4 -type f -name siso -print 2>/dev/null | head -n 20 || true
              exit 1
            fi
            "$SISO_BIN" version 2>&1 | tee build-diagnostics/siso-version.txt
            if ! grep -Fq "v1.5.28" build-diagnostics/siso-version.txt; then
              echo "SANDIUM_SISO_VERSION_VERIFY=FAIL expected=v1.5.28"
              exit 1
            fi
            echo "SANDIUM_SISO_VERSION_VERIFY=PASS expected=v1.5.28"
            echo "SANDIUM_SISO_VERSION_PIN_REVISION=git_revision:bc45e8f67ae0f37d337190ad64aa8bb440c791eb"
            sha256sum src/brave/pnpm-lock.yaml | awk '{print $1}' > src/brave/.sandium-pnpm-lock.sha256
            python3 - \<<'PY'
            import re, shutil, subprocess
            from pathlib import Path
            actual = subprocess.check_output(
                ["git", "-C", "src", "describe", "--tags", "--exact-match", "HEAD"],
                text=True,
            ).strip()
            pin_lines = [
                line.strip()
                for line in Path("src/brave/ci/pins/chromium-tag.txt").read_text().splitlines()
                if line.strip() and not line.lstrip().startswith("#")
            ]
            if len(pin_lines) != 1:
                raise SystemExit("Manual Chromium pin file changed or became invalid during sync")
            pinned_tag = pin_lines[0]
            print("CHROMIUM_SOURCE_TAG=" + actual)
            print("SANDIUM_PINNED_CHROMIUM_TAG=" + pinned_tag)
            if actual != pinned_tag:
                raise SystemExit(f"Resolved Chromium tag {actual!r} differs from manual pin {pinned_tag!r}")
            if not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", actual):
                raise SystemExit(f"Chromium source tag is not a four-part numeric version: {actual!r}")
            Path("build-diagnostics/chromium-source-tag.txt").write_text(actual + "\n")
            free = shutil.disk_usage(".").free
            print(f"FREE_DISK_AFTER_SYNC_BYTES={free}")
            if free < 20 * 1024**3:
                raise SystemExit("Less than 20 GiB free after source sync")
            PY
            mkdir -p build-diagnostics
            git -C src rev-parse HEAD > build-diagnostics/chromium-commit.txt
            python3 "$HOME/project/src/brave/ci/siso/source_cache_key.py" --root "$HOME/project"
            python3 - \<<'PY'
            import hashlib, json, re, subprocess
            from pathlib import Path
            p = Path("src/chrome/VERSION")
            tag = subprocess.check_output(
              ["git", "-C", "src", "describe", "--tags", "--exact-match", "HEAD"],
              text=True,
            ).strip()
            if not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid Chromium source tag for cache manifest: {tag!r}")
            manifest = {
              "schema": 3,
              "chromium_commit": subprocess.check_output(["git","-C","src","rev-parse","HEAD"], text=True).strip(),
              "chromium_version": tag,
              "chromium_tag": tag,
              "manual_chromium_pin": tag,
              "version_file_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "gclient_sha256": hashlib.sha256(Path(".gclient").read_bytes()).hexdigest() if Path(".gclient").is_file() else None,
              "brave_sync_inputs_fingerprint": next(
                (line.split("=", 1)[1] for line in Path(".sandium-source-cache-key.txt").read_text().splitlines()
                 if line.startswith("fingerprint=")), ""
              ),
              "target": "android-arm64-debug-apk"
            }
            Path(".sandium-source-cache-manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
            PY
      - run:
          name: Verify Chromium-only cache boundary
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/chrome/VERSION
            test "$(git -C src rev-parse HEAD)" = "$(cat build-diagnostics/chromium-commit.txt)"
            echo "CACHE_ROOT=src"
            echo "FRESH_BRAVE_CORE_CHECKOUT_EXCLUDED=true"
      - run:
          name: Record pre-exclusion source tree footprint
          command: |
            set -euo pipefail
            du -sb src | awk '{print "SOURCE_TREE_BYTES_BEFORE_EXCLUSIONS=" $1}'
            df -B1 . | tail -n 1
      - save_cache:
          key: sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-{{ .BuildNum }}
          paths:
            - src/brave/node_modules
            - src/brave/.sandium-pnpm-lock.sha256
            - ~/.local/share/pnpm/store
      - run:
          name: Temporarily exclude Brave Core and Android build output from the source cache
          command: |
            set -euo pipefail
            test -d src/brave/.git
            test -f .gclient
            test -f .brave_latest_successful_sync.json
            test -f src/chrome/VERSION
            test ! -e "$HOME/sandium-brave-core-cache-exclusion"
            test ! -e "$HOME/sandium-build-output-cache-exclusion"
            mv src/brave "$HOME/sandium-brave-core-cache-exclusion"
            if [[ -d src/out ]]; then
              mv src/out "$HOME/sandium-build-output-cache-exclusion"
              echo "CHROMIUM_SOURCE_CACHE_EXCLUDES_ANDROID_BUILD_OUTPUT=true"
            else
              echo "CHROMIUM_SOURCE_CACHE_EXCLUDES_ANDROID_BUILD_OUTPUT=ALREADY_ABSENT"
            fi
            test -d src/.git
            test ! -e src/brave
            test ! -e src/out
            echo "CHROMIUM_SOURCE_CACHE_EXCLUDES_BRAVE_CORE=true"
      - run:
          name: Record exact Chromium-only source cache contents
          command: |
            set -euo pipefail
            test -d src/.git
            test ! -e src/brave
            test ! -e src/out
            du -sb src | awk '{print "SOURCE_CACHE_BYTES=" $1}'
            echo "SOURCE_CACHE_CONTAINS_COMPILED_OUTPUT=false"
      - save_cache:
          name: Save Chromium source for reuse across branches with identical sync inputs
          key: sandium-src-v7-{{ checksum ".sandium-source-cache-inputs/ci/pins/chromium-tag.txt" }}-{{ checksum ".sandium-source-cache-inputs/DEPS" }}-{{ checksum ".sandium-source-cache-inputs/package.json" }}-{{ checksum ".sandium-source-cache-inputs/pnpm-lock.yaml" }}-{{ checksum ".sandium-source-cache-inputs/build/commands/lib/config.ts" }}-{{ checksum ".sandium-source-cache-inputs/build/commands/lib/syncUtils.ts" }}-{{ checksum ".sandium-source-cache-inputs/build/commands/scripts/sync.ts" }}-{{ .BuildNum }}
          paths:
            - src
            - .gclient
            - .gclient_entries
            - .brave_latest_successful_sync.json
            - .sandium-source-cache-manifest.json
      - run:
          name: Restore Brave Core and local build output after source-cache save
          command: |
            set -euo pipefail
            if [[ -d "$HOME/sandium-build-output-cache-exclusion" ]]; then
              test ! -e src/out
              mv "$HOME/sandium-build-output-cache-exclusion" src/out
            fi
            test -d "$HOME/sandium-brave-core-cache-exclusion/.git"
            test ! -e src/brave
            mv "$HOME/sandium-brave-core-cache-exclusion" src/brave
            test "$(git -C src/brave rev-parse HEAD)" = "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"
      - run:
          name: Confirm source-cache save request
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/chrome/VERSION
            echo "SOURCE_CACHE_SAVE_REQUESTED=true"
            echo "CACHE_SAVE_IS_NOT_YET_PROVEN_UNTIL_NEXT_RUN_RESTORES_IT=true"
      - run:
          name: Validate committed Brave build failure diagnostics before compilation
          command: |
            set -euo pipefail
            node --check src/brave/build/commands/lib/util.ts
            node --check src/brave/build/commands/lib/build.ts
            node - \<<'NODE'
            const fs = require('node:fs')
            const assert = require('node:assert/strict')
            const source = fs.readFileSync('src/brave/build/commands/lib/util.ts', 'utf8')
            const runStart = source.indexOf('  run: (')
            const runEnd = source.indexOf('  runGit:', runStart)
            assert.ok(runStart >= 0 && runEnd > runStart, 'Unable to isolate util.run')
            const run = source.slice(runStart, runEnd)
            assert.ok(run.includes('if (prog.error)'), 'Spawn failures must be reported explicitly')
            assert.ok(run.includes('Failed to spawn command:'), 'Spawn diagnostics must include command and cwd')
            assert.ok(run.includes('Command failed:'), 'Non-zero exits must include command and status')
            assert.ok(!run.includes('process.exit'), 'util.run must throw rather than truncate phase diagnostics')
            assert.ok(!run.includes('console.log(prog.stdout && prog.stdout.toString())'),
              'Inherited stdio must never print undefined as the failure reason')
            assert.ok(source.includes('SANDIUM_OVERRIDE_RECONCILIATION_FAILED='),
              'Per-file Chromium overlay diagnostics must remain enabled')
            const build = fs.readFileSync('src/brave/build/commands/lib/build.ts', 'utf8')
            assert.ok(build.includes('function writePhaseDiagnostic') && build.includes('writeSync(fd, message +'),
              'Build phase markers must be written synchronously before process termination')
            console.log('SANDIUM_RUNNER_FAILURE_DIAGNOSTICS=PASS')
            console.log('SANDIUM_SYNCHRONOUS_PHASE_MARKERS=PASS')
            console.log('SANDIUM_OVERRIDE_RECONCILIATION_DIAGNOSTICS=PASS')
            NODE
      - run:
          name: Test build command failure and Chromium override cleanup before compilation
          command: |
            set -euo pipefail
            cd src/brave
            pnpm test-unit build/commands/lib/util.test.ts --runInBand --coverage=false
            cd "$HOME/project"
            echo "SANDIUM_OVERRIDE_CLEANUP_REGRESSION_TESTS=PASS"
      - restore-sandium-build-output:
          stage_index: 1
      - restore-sandium-siso-cache
      - install-sandium-android-build-deps
      - ensure-sandium-depot-tools
      - configure-sandium-remote-cache
      - run:
          name: Preflight GN executable using the build environment
          command: |
            set -euo pipefail
            GN_DIR="$HOME/project/src/buildtools/linux64"
            GN_BIN="$GN_DIR/gn"
            if [[ ! -x "$GN_BIN" ]]; then
              echo "SANDIUM_GN_EXECUTABLE_PREFLIGHT=FAIL"
              echo "Expected Chromium GN binary is missing or not executable: $GN_BIN"
              echo "Searching source checkout for a GN executable to diagnose source/cache layout:"
              find "$HOME/project/src" -type f -path '*/buildtools/linux64/gn' -o -type f -name gn 2>/dev/null | head -n 30 || true
              exit 1
            fi
            echo "export PATH=$GN_DIR:\$PATH" >> "$BASH_ENV"
            export PATH="$GN_DIR:$PATH"
            echo "SANDIUM_GN_EXPECTED_PATH=$GN_BIN"
            cd src/brave
            node --input-type=module - \<<'NODE'
            import { spawnSync } from 'node:child_process'
            import config from './build/commands/lib/config.ts'
            const options = config.defaultOptions
            const lookup = spawnSync('bash', ['-c', 'command -v gn'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (lookup.error || lookup.status !== 0 || !lookup.stdout.trim()) {
              throw new Error('GN executable is not resolvable with Brave build PATH after adding Chromium buildtools/linux64: '
                + (lookup.error?.message || lookup.stderr || 'command -v gn returned no path'))
            }
            const gnPath = lookup.stdout.trim()
            console.log('SANDIUM_GN_RESOLVED_PATH=' + gnPath)
            const version = spawnSync(gnPath, ['--version'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (version.error) {
              throw new Error('GN failed to spawn at ' + gnPath + ': ' + version.error.message)
            }
            if (version.status !== 0) {
              throw new Error('GN --version failed with status ' + version.status
                + '; stdout=' + (version.stdout || '') + '; stderr=' + (version.stderr || ''))
            }
            console.log('SANDIUM_GN_EXECUTABLE_PREFLIGHT=PASS')
            console.log('SANDIUM_GN_VERSION=' + version.stdout.trim())

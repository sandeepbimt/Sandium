              exit "$status"
            fi
            echo "SANDIUM_PREPARE_ONLY=PASS"
            cd "$HOME/project"
      - run:
          name: Generate Brave version.gni prerequisite before GN
          command: |
            set -euo pipefail
            cd src/brave
            test -s ../chrome/VERSION || { echo "Missing synced Chromium chrome/VERSION"; exit 1; }
            test -s ../chrome/VERSION.chromium || { echo "Missing Brave-managed upstream VERSION.chromium sidecar; refusing to fabricate version metadata"; exit 1; }
            # Reproduce Brave's own DEPS hook exactly. The source sync intentionally
            # uses --nohooks, so this required generated GN input must be materialized
            # explicitly before invoking gn gen.
            python3 build/util/version.py gen ../chrome/VERSION
            test -s build/version.gni
            grep -q '^brave_version = ' build/version.gni
            grep -q '^chrome_version_string = ' build/version.gni
            echo "SANDIUM_BRAVE_VERSION_GNI=GENERATED"
            grep -E '^(brave_version|chrome_version_string) = ' build/version.gni
            cd "$HOME/project"
      - run:
          name: Validate fingerprint, configure GN and compile window 1
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            v=subprocess.check_output(
              ["git","-C","src","describe","--tags","--exact-match","HEAD"], text=True
            ).strip()
            if not re.fullmatch(r"\d+\.\d+\.\d+\.\d+",v):
              raise SystemExit(f"Invalid Chromium source tag: {v!r}")
            Path("build-diagnostics/fingerprint.json").write_text(json.dumps({
              "brave_core_commit":subprocess.check_output(["git","-C","src/brave","rev-parse","HEAD"],text=True).strip(),
              "chromium_commit":subprocess.check_output(["git","-C","src","rev-parse","HEAD"],text=True).strip(),
              "chromium_version":v,"target":"android-arm64","config":"Debug","format":"apk",
              "siso_revision":"c574896b272b40aac6e44c228ee0b471ea7e3d7d",
              "build_command_args":["Debug","--target_os=android","--target_arch=arm64","--target_android_output_format=apk","--use_remoteexec","true","--gn","use_siso:true","--gn","use_reclient:false"]

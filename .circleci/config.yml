            echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
              # Recheck critical Brave GN inputs immediately before Siso starts.
              for required in \
                "$HOME/project/src/brave/third_party/bip39wally-core-native/BUILD.gn" \

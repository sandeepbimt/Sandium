            fi
            echo "GN_GRAPH_MODE=REUSE_RESTORED_CHECKPOINT"
            echo "SANDIUM_PREPARE_ONLY=SKIPPED_VALIDATED_GRAPH_REUSED"
      - normalize-sandium-source-baseline
      - run:
          name: Final incremental compile window 5 with Siso remote execution
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics sandium-output
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            LOG="$HOME/project/build-diagnostics/compile-window-5.log"
            status=0
            if [[ -s "$OUT/apks/Bravearm64.apk" && "$(stat -c %s "$OUT/apks/Bravearm64.apk")" -ge 1000000 ]]; then
              echo "FINAL_STAGE_COMPILE_SKIPPED=APK_ALREADY_PRESENT_IN_RESTORED_OUTPUT"
              : > "$LOG"
            else
              python3 "$STATE" fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
              cd src/brave
              started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
              elapsed_seconds="$(( $(date +%s) - started_at ))"
              remaining_compile_seconds="$(( 3300 - elapsed_seconds - 300 ))"
              if [[ "$remaining_compile_seconds" -le 0 ]]; then
                echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; preserving state and handover time"
                status=5
              else
                echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
                echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
                set +e
                # Recheck critical Brave GN inputs immediately before Siso starts.
              for required in \
                "$HOME/project/src/brave/third_party/bip39wally-core-native/BUILD.gn" \
                "$HOME/project/src/brave/vendor/bat-native-tweetnacl/BUILD.gn" \
                "$HOME/project/$OUT/build.ninja" \
                "$HOME/project/$OUT/build.ninja.stamp"; do
                if [[ ! -s "$required" ]]; then
                  echo "SANDIUM_PRECOMPILE_INPUT_GATE=FAIL missing=$required"
                  exit 43
                fi
              done
              echo "SANDIUM_PRECOMPILE_INPUT_GATE=PASS brave_gn_deps_and_prepared_graph_present=true"
              BUILD_FORCE_GN_GEN=()
                if [[ "${SANDIUM_BUILD_OUTPUT_CACHE_HIT:-false}" != "true" ]]; then
                  echo "GN_GRAPH_MODE=FRESHLY_PREPARED_BEFORE_COMPILE"
                else
                  echo "GN_GRAPH_MODE=REUSE_RESTORED_CHECKPOINT"
                fi
                python3 "$HOME/project/src/brave/ci/siso/run_compile_window.py" --root "$HOME/project" --stage stage-5 --stage-start-epoch-file "$HOME/.sandium-stage-start-epoch" --max-stage-seconds 3300 --handover-reserve-seconds 300 --metrics-poll-interval-seconds 15
                status=$?
                set -e
              fi
            fi
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-5-exit.txt"
            evidence="$HOME/project/build-diagnostics/compile-window-5-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)|local:[[:space:]]*[0-9]+[[:space:]]+remote:' "$LOG" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
            else
              : > "$evidence"
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
            fi
            echo "FINAL_COMPILE_WINDOW_STATUS=$status"
      - run:
          name: Checkpoint Stage 5 output and package APK if it appeared
          command: |
            set -euo pipefail
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            status="$(cat build-diagnostics/compile-window-5-exit.txt)"
            COMPLETE=false
            if [[ "$status" == "0" || -s "$OUT/apks/Bravearm64.apk" ]]; then COMPLETE=true; fi
            python3 "$STATE" record --commit "$CIRCLE_SHA1" --stage stage-5 --compile-complete "$COMPLETE" --artifact-verified auto --log build-diagnostics/compile-window-5.log
            python3 "$STATE" fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.json
            if [[ -s "$OUT/apks/Bravearm64.apk" && "$(stat -c %s "$OUT/apks/Bravearm64.apk")" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-5
            else
              echo "APK_NOT_YET_AVAILABLE_AFTER_FIVE_STAGE_WINDOWS=true"
            fi
      - save_cache:
          key: sandium-siso-v4-android-debug-arm64-stage5-{{ .BuildNum }}
          paths:
            - sandium-siso-cache
      - run:
          name: Pack stage-5 cumulative Siso checkpoint
          command: |
            set -euo pipefail
            if [[ "<< pipeline.parameters.run_sandium_compile_windows >>" != "true" ]]; then
              echo "SANDIUM_CHECKPOINT_HANDOVER=NO_COMPILE_NO_CHECKPOINT stage=stage-5"
              echo "SANDIUM_CHECKPOINT_PACK_SKIPPED=true reason=preflight_only"
              exit 0
            fi
            python3 src/brave/ci/siso/checkpoint.py pack --root "$HOME/project" --stage stage-5
      - run:
          name: Publish stage-5 checkpoint files for cross-workflow recovery
          command: |
            set -euo pipefail
            if [[ "<< pipeline.parameters.run_sandium_compile_windows >>" != "true" ]]; then
              echo "CHECKPOINT_ARTIFACT_PUBLISH_SKIPPED=stage-5 reason=preflight_only"
              exit 0
            fi
            mkdir -p build-diagnostics/checkpoint-artifact
            cp -f sandium-checkpoint.tar.zst sandium-checkpoint.meta build-diagnostics/checkpoint-artifact/
            cp -f sandium-action-frontier.txt build-diagnostics/checkpoint-artifact/ 2>/dev/null || true
            echo "CHECKPOINT_ARTIFACT_STAGED=stage-5"
      - save_cache:
          name: Save stage-5 resumable build checkpoint for the next stage or workflow
          key: sandium-checkpoint-v7-{{ .Branch }}-stage-5-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - sandium-checkpoint.tar.zst
            - sandium-checkpoint.meta
            - sandium-action-frontier.txt
      - save_cache:
          key: sandium-apk-v4-{{ .Branch }}-{{ .Revision }}-android-debug-arm64-stage5-{{ .BuildNum }}
          paths:
            - sandium-output
      - run:
          name: Include verified APK in downloadable stage-5 artifacts
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -s sandium-output/Brave-debug-arm64.apk ]]; then
              cp -f sandium-output/Brave-debug-arm64.apk build-diagnostics/
              cp -f sandium-output/build-manifest.json build-diagnostics/ 2>/dev/null || true
              cp -f sandium-output/build-state.json build-diagnostics/ 2>/dev/null || true
              echo "APK_ARTIFACT_STAGED=stage-5"
            else
              echo "APK_NOT_YET_AVAILABLE=stage-5"
            fi
      - store_artifacts:
          path: build-diagnostics
          destination: stage-5-finish-build
      - run:
          name: Fail clearly if no APK exists after all five stages; otherwise verify it independently
          command: |
            set -euo pipefail
            if [[ ! -s sandium-output/Brave-debug-arm64.apk ]]; then
              echo "APK_NOT_YET_AVAILABLE_AFTER_FIVE_STAGE_WINDOWS=true"
              exit 23
            fi
            python3 - \<<'PY'
            import hashlib, json, zipfile
            from pathlib import Path
            out=Path("sandium-output")
            apk=out/"Brave-debug-arm64.apk"
            manifest=json.loads((out/"build-manifest.json").read_text())
            state=json.loads((out/"build-state.json").read_text())
            digest=hashlib.sha256(apk.read_bytes()).hexdigest()
            if digest != manifest.get("apk_sha256") or digest != state.get("apk_sha256"):
                raise SystemExit("APK hash differs between artifact, state and manifest")
            if not manifest.get("artifact_verified") or manifest.get("apksigner_verification") != "PASS":
                raise SystemExit("APK signature verification record is missing")
            if manifest.get("build_input_fingerprint") != state.get("build_input_fingerprint"):
                raise SystemExit("APK and state build fingerprints differ")
            with zipfile.ZipFile(apk) as archive:
                if archive.testzip() is not None:
                    raise SystemExit("APK ZIP CRC integrity failure")
                names=set(archive.namelist())
                if "AndroidManifest.xml" not in names or not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                    raise SystemExit("APK is missing Android manifest or DEX")
            print("APK_INTEGRITY=PASS")
            print("APK_SIGNATURE_VERIFICATION=PASS")
            print("APK_SHA256="+digest)
            print("APK_BYTES="+str(apk.stat().st_size))
            print("APK_PACKAGE="+manifest["app_package_name"])
            print("APK_ARTIFACT_VERIFIED=true")
            print("SISO_REMOTE_BACKEND_PROVEN="+str(manifest.get("remote_execution_usage", {}).get("proven_from_siso_stats", False)).lower())
            PY
  sandium-checkpoint-discovery-probe:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Probe CircleCI API token and historical checkpoint artifact listing (no build)
          command: python3 ci/siso/checkpoint_discovery_probe.py
  sandium-checkpoint-discovery:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout:
          path: brave-core
      - snapshot-sandium-source-cache-inputs
      - restore-sandium-source
      - run:
          name: Place Brave Core checkout after restoring Chromium source
          command: |
            set -euo pipefail
            test -d brave-core/.git
            test ! -e src/brave
            mkdir -p src
            mv brave-core src/brave
            test -d src/brave/.git
      - validate-sandium-source-cache-inputs
      - run:
          name: Install zstd for checkpoint archive validation
          command: |
            set -euo pipefail
            if ! command -v zstd >/dev/null 2>&1; then
              sudo rm -f /etc/apt/sources.list.d/google-chrome.list
              sudo apt-get update
              sudo apt-get install -y zstd
            fi
            zstd --version
      - run:
          name: Discover, rank, and validate historical checkpoint (no compilation)
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            python3 "$ROOT/src/brave/ci/siso/checkpoint_artifact_discovery.py" --root "$ROOT" --require-siso-state
            STATUS="$(cat "$ROOT/.sandium-checkpoint-discovery-status" 2>/dev/null || true)"
            echo "SANDIUM_CHECKPOINT_DISCOVERY_STATUS=$STATUS"
            if [[ "$STATUS" == "RESTORED" ]]; then
              META="$ROOT/sandium-checkpoint.meta"
              python3 - "$META" \<<'PY'
            import json, sys
            from pathlib import Path
            meta=json.loads(Path(sys.argv[1]).read_text())
            print("SANDIUM_CHECKPOINT_SELECTED_STAGE=" + str(meta.get("stage", "unknown")))
            print("SANDIUM_CHECKPOINT_SELECTED_SOURCE_COMMIT=" + str(meta.get("source_commit", "unknown")))
            print("SANDIUM_CHECKPOINT_SELECTED_CHROMIUM_COMMIT=" + str(meta.get("chromium_commit", "unknown")))
            print("SANDIUM_CHECKPOINT_SELECTED_PROGRESS=" + json.dumps(meta.get("progress", {}), sort_keys=True))
            print("SANDIUM_CHECKPOINT_SELECTED_BUILD_STATE_SHA256=" + str(meta.get("state_sha256")))
            out=Path(sys.argv[1]).parent / "src" / "out" / "android_Debug_arm64"
            siso_present = []
            for name in (".siso_fs_state", ".siso_fs_state.journal"):
                path=out / name
                present=path.is_file() and not path.is_symlink() and path.stat().st_size > 0
                siso_present.append(present)
                print("SANDIUM_CHECKPOINT_" + name.upper().replace(".", "_") + "_PRESENT=" + str(present).lower())
            if all(siso_present):
                print("SANDIUM_CHECKPOINT_RESUMABILITY=RESUMABLE_SISO_STATE")
            else:
                print("SANDIUM_CHECKPOINT_RESUMABILITY=OUTPUT_ONLY_SISO_STATE_MISSING")
                print("SANDIUM_COMPILE_AUTHORIZATION=NOT_GRANTED")
            PY
            elif [[ "$STATUS" == "NO_RESUMABLE_SISO_CANDIDATE" ]]; then
              echo "SANDIUM_CHECKPOINT_DISCOVERY=COMPLETE_NO_RESUMABLE_SISO_CANDIDATE"
              echo "SANDIUM_COMPILE_AUTHORIZATION=NOT_GRANTED"
            elif [[ "$STATUS" == "NO_COMPATIBLE_CANDIDATE" ]]; then
              echo "SANDIUM_CHECKPOINT_DISCOVERY=COMPLETE_NO_COMPATIBLE_CANDIDATE"
              echo "SANDIUM_COLD_START_AUTHORIZATION=NOT_GRANTED_BY_THIS_JOB"
            else
              echo "SANDIUM_CHECKPOINT_DISCOVERY=INCOMPLETE_OR_FAILED status=$STATUS" >&2
              exit 78
            fi
  sandium-checkpoint-restore-validation:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout:
          path: brave-core
      - snapshot-sandium-source-cache-inputs
      - restore-sandium-source
      - run:
          name: Place Brave Core checkout after restoring Chromium source
          command: |
            set -euo pipefail
            test -d brave-core/.git
            test ! -e src/brave
            mkdir -p src
            mv brave-core src/brave
            test -d src/brave/.git
      - validate-sandium-source-cache-inputs
      - restore-sandium-build-output:
          stage_index: 1
      - run:
          name: Report validated checkpoint handoff and expected next-stage reuse
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            OUT="$ROOT/src/out/android_Debug_arm64"
            STATE="$ROOT/src/brave/ci/siso/build_state.py"
            META="$ROOT/sandium-checkpoint.meta"
            test -s "$OUT/.sandium-build-state.json"
            test -s "$META"
            EXPECTED_COMMIT="$(git -C "$ROOT/src/brave" rev-parse HEAD)"
            python3 "$STATE" check --mode cache --commit "$EXPECTED_COMMIT"
            python3 - "$META" "$OUT/.sandium-build-state.json" \<<'PY'
            import json, sys
            from pathlib import Path
            meta = json.loads(Path(sys.argv[1]).read_text())
            state = json.loads(Path(sys.argv[2]).read_text())
            fields = ("source_commit", "chromium_commit", "chromium_version",
                      "target", "build_config", "build_input_fingerprint", "gn_args_sha256")
            mismatches = [key for key in fields if meta.get(key) != state.get(key)]
            if mismatches:
                raise SystemExit("CHECKPOINT_HANDOFF=FAIL metadata_state_mismatch=" + ",".join(mismatches))
            # The cache-mode build_state check above validates current build-input
            # compatibility. Exact Git HEAD equality is too strict for a checkpoint
            # created before a CI-only commit; the manifest and state must agree
            # with each other, while build_state.py decides whether inputs are reusable.
            progress = meta.get("progress", {})
            print("SANDIUM_CHECKPOINT_RESTORED_STAGE=" + str(meta.get("stage", "unknown")))
            print("SANDIUM_CHECKPOINT_SOURCE_COMMIT=" + str(state.get("source_commit", "unknown")))
            print("SANDIUM_CHECKPOINT_SOURCE_COMMIT_COMPATIBILITY=VALIDATED_BY_BUILD_STATE")
            print("SANDIUM_CHECKPOINT_BUILD_IDENTITY_MATCH=PASS")
            print("SANDIUM_CHECKPOINT_PROGRESS=" + json.dumps(progress, sort_keys=True))
            print("SANDIUM_CHECKPOINT_OUTPUT_BYTES=" + str(progress.get("output_bytes", "unknown")))
            print("SANDIUM_CHECKPOINT_HANDOFF=PASS")
            PY
            echo "SANDIUM_CHECKPOINT_RESTORE_VALIDATION=PASS"
  sandium-checkpoint-unit-tests:
    machine:
      image: ubuntu-2404:current

version: 2.1

parameters:
  # Keep the existing parameter name so current API triggers/integration do not need reconfiguration.
  run_sandium_rbe_preflight:
    type: boolean
    default: false

jobs:
  sandium-bare-source-preflight:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - run:
          name: Verify Bare source and existing Sandium remote-build configuration (no build)
          command: |
            set -euo pipefail

            echo "=== SANDIUM BARE SOURCE PREFLIGHT ONLY ==="
            echo "CIRCLE_PROJECT_USERNAME=${CIRCLE_PROJECT_USERNAME:-<unset>}"
            echo "CIRCLE_PROJECT_REPONAME=${CIRCLE_PROJECT_REPONAME:-<unset>}"
            test "${CIRCLE_PROJECT_REPONAME:-}" = "Sandium" || {
              echo "Expected the existing CircleCI project Sandium; stopping."
              exit 1
            }
            test -n "${CIRCLE_SHA1:-}" || {
              echo "CIRCLE_SHA1 is unavailable; stopping."
              exit 1
            }

            # Reuse the endpoint and instance already defined by the existing Sandium CI configuration.
            # Do not introduce new CircleCI variable assignments or rotate/recreate the protected key.
            REAPI_ADDRESS="remote.buildbuddy.io:443"
            REAPI_INSTANCE="sandium/android-arm64/ci"
            : "${BUILDBUDDY_API_KEY:?Existing BuildBuddy credential is unavailable in this CircleCI context; stop without recreating it}"

            BARE_COMMIT="a5a7ef74f3b77d45720b8c502cbacc30f2f3dbd5"
            CHROMIUM_COMMIT="1228231501697ff7a4a0150ea8ae6df37bb99331"
            CHROMIUM_VERSION="156.0.8078.25"
            TMP_ROOT="$(mktemp -d)"
            trap 'rm -rf "${TMP_ROOT}"' EXIT

            git init "${TMP_ROOT}/bare"
            git -C "${TMP_ROOT}/bare" remote add origin https://github.com/BareBrowser/bare-browser.git
            git -C "${TMP_ROOT}/bare" fetch --depth=1 origin "${BARE_COMMIT}"
            git -C "${TMP_ROOT}/bare" checkout --detach FETCH_HEAD
            test "$(git -C "${TMP_ROOT}/bare" rev-parse HEAD)" = "${BARE_COMMIT}"

            BUILDING_FILE="${TMP_ROOT}/bare/BUILDING.md"
            README_FILE="${TMP_ROOT}/bare/README.md"
            test -s "${BUILDING_FILE}"
            test -s "${README_FILE}"
            grep -Fq "${CHROMIUM_COMMIT}" "${BUILDING_FILE}"
            grep -Fq "${CHROMIUM_VERSION}" "${BUILDING_FILE}"
            grep -Fq 'git am' "${README_FILE}"

            PATCH_COUNT="$(find "${TMP_ROOT}/bare/patches" -maxdepth 1 -type f -name '*.patch' | wc -l | tr -d ' ')"
            test "${PATCH_COUNT}" -gt 0
            PATCH_DIGEST="$(find "${TMP_ROOT}/bare/patches" -maxdepth 1 -type f -name '*.patch' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"

            echo "BARE_COMMIT=${BARE_COMMIT}"
            echo "CHROMIUM_COMMIT=${CHROMIUM_COMMIT}"
            echo "CHROMIUM_VERSION=${CHROMIUM_VERSION}"
            echo "BARE_PATCH_COUNT=${PATCH_COUNT}"
            echo "BARE_PATCH_SERIES_SHA256=${PATCH_DIGEST}"
            echo "REAPI_ADDRESS=${REAPI_ADDRESS}"
            echo "REAPI_INSTANCE=${REAPI_INSTANCE}"
            echo "BUILDBUDDY_CREDENTIAL_PRESENT=yes"
            echo "CACHE_NAMESPACE=existing_sandium_android_arm64_ci"
            echo "BARE_SOURCE_PREFLIGHT=PASS"
            echo "REMOTE_EXECUTION_TESTED=no"
            echo "CHROMIUM_SOURCE_SYNC_RUN=no"
            echo "GN_GENERATION_RUN=no"
            echo "COMPILATION_RUN=no"
            echo "APK_BUILD_RUN=no"
            echo "This job checks the pinned Bare patch repository only. It does not sync Chromium, generate GN, compile, package an APK, change credentials or clear caches."

workflows:
  sandium-bare-source-preflight:
    when: << pipeline.parameters.run_sandium_rbe_preflight >>
    jobs:
      - sandium-bare-source-preflight

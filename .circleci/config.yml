            const version = spawnSync(gnPath, ['--version'], {
              cwd: config.srcDir, env: options.env, encoding: 'utf8',
            })
            if (version.error) {
              throw new Error('GN failed to spawn at ' + gnPath + ': ' + version.error.message)
            }
            if (version.status !== 0) {
              throw new Error('GN --version failed with status ' + version.status
                + '; stdout=' + (version.stdout || '') + '; stderr=' + (version.stderr || ''))
            }

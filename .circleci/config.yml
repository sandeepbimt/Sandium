            cd src/brave
            started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            remaining_compile_seconds="$(( 3000 - elapsed_seconds - 600 ))"
            if [[ "$remaining_compile_seconds" -gt 2400 ]]; then remaining_compile_seconds=2400; fi
            if [[ "$remaining_compile_seconds" -le 0 ]]; then

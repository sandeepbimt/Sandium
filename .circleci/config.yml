# SANDIUM five-stage Android debug APK CI.
# APK builds are opt-in; the pipeline parameter defaults to false.

version: 2.1

parameters:
  run_sandium_android_apk_build:
    type: boolean
    default: false

commands:
  install-sandium-node:
    steps:
      - run:
          name: Install pinned Node and pnpm
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential ca-certificates curl python-is-python3 python3-setuptools xz-utils
            NODE_VERSION=24.16.0
            curl --fail --location --silent --show-error "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            sudo mkdir -p /opt/sandium-node
            sudo tar -xJf /tmp/node.tar.xz -C /opt/sandium-node --strip-components=1
            echo "export PATH=/opt/sandium-node/bin:\$PATH" >> "$BASH_ENV"
            export PATH="/opt/sandium-node/bin:$PATH"
            node --version
            npm install --global pnpm@11.11.0
            pnpm --version

  restore-sandium-source:
    steps:
      - restore_cache:
          keys:
            - sandium-src-v3-chromium-156.0.8078.39-
      - run:
          name: Validate restored Chromium source cache or record cold start
          command: |
            set -euo pipefail
            if [[ -f src/brave/src/chrome/VERSION ]]; then
              python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            print("RESTORED_CHROMIUM_VERSION=" + actual)
            if actual != "156.0.8078.39":
                raise SystemExit("Source cache pin mismatch; refusing to build from it.")
            manifest_path = Path(".sandium-source-cache-manifest.json")
            if not manifest_path.is_file():
                raise SystemExit("Source cache manifest missing; refusing to build.")
            manifest = json.loads(manifest_path.read_text())
            chromium_sha = subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip()
            version_sha256 = __import__("hashlib").sha256(Path("src/brave/src/chrome/VERSION").read_bytes()).hexdigest()
            if manifest.get("schema") != 2:
                raise SystemExit("Unsupported source-cache manifest schema.")
            if manifest.get("chromium_version") != actual:
                raise SystemExit("Source-cache manifest version does not match the checked-out source.")
            if manifest.get("chromium_commit") != chromium_sha:
                raise SystemExit("Cached Chromium commit does not match manifest.")
            if manifest.get("version_file_sha256") != version_sha256:
                raise SystemExit("Cached Chromium VERSION file hash does not match manifest.")
            print("SOURCE_CACHE_FINGERPRINT=PASS")
            print("SOURCE_CACHE_SCOPE=CHROMIUM_ONLY")
            PY
            else
              echo "SOURCE_CACHE=COLD_MISS"
              if [[ "${CIRCLE_JOB:-}" != "stage-1-source-foundation" ]]; then
                echo "Required source cache missing in a compile stage."
                exit 2
              fi
            fi

  restore-sandium-build-output:
    steps:
      - restore_cache:
          keys:
            - sandium-out-v1-{{ .Branch }}-chromium-156.0.8078.39-android-debug-arm64-
      - run:
          name: Validate cached Android build output against source and GN inputs
          command: |
            set -euo pipefail
            OUT=src/brave/src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            if [[ ! -d "$OUT" ]]; then
              echo "BUILD_OUTPUT_CACHE=COLD_MISS"
              exit 0
            fi
            if python3 "$STATE" check --mode cache --commit "${CIRCLE_SHA1:?}"; then
              echo "BUILD_OUTPUT_CACHE=COMPATIBLE"
              if python3 "$STATE" check --mode compiled --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_COMPILED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
              if python3 "$STATE" check --mode verified --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_VERIFIED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
            else
              echo "BUILD_OUTPUT_CACHE=INCOMPATIBLE; discarding stale output directory"
              rm -rf "$OUT"
            fi

  restore-sandium-pnpm-cache:
    steps:
      - restore_cache:
          keys:
            - sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-

  restore-sandium-build-output:
    steps:
      - restore_cache:
          keys:
            - sandium-out-v1-{{ .Branch }}-chromium-156.0.8078.39-android-debug-arm64-
      - run:
          name: Validate cached Android build output against source and GN inputs
          command: |
            set -euo pipefail
            OUT=src/brave/src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            if [[ ! -d "$OUT" ]]; then
              echo "BUILD_OUTPUT_CACHE=COLD_MISS"
              exit 0
            fi
            if python3 "$STATE" check --mode cache --commit "${CIRCLE_SHA1:?}"; then
              echo "BUILD_OUTPUT_CACHE=COMPATIBLE"
              if python3 "$STATE" check --mode compiled --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_COMPILED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
              if python3 "$STATE" check --mode verified --commit "$CIRCLE_SHA1"; then
                echo 'export SANDIUM_VERIFIED_OUTPUT_CACHE_HIT=true' >> "$BASH_ENV"
              fi
            else
              echo "BUILD_OUTPUT_CACHE=INCOMPATIBLE; discarding stale output directory"
              rm -rf "$OUT"
            fi

  restore-sandium-pnpm-cache:
    steps:
      - restore_cache:
          keys:
            - sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-

  install-sandium-android-build-deps:
    steps:
      - run:
          name: Install Android build dependencies on this fresh machine
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            test -x src/brave/src/build/install-build-deps.sh
            sudo src/brave/src/build/install-build-deps.sh --android
            echo "ANDROID_BUILD_DEPS_INSTALLED_ON_CURRENT_JOB=true"

  configure-sandium-remote-cache:
    steps:
      - run:
          name: Configure SANDIUM-only BuildBuddy backend
          command: |
            set -euo pipefail
            : "${BUILDBUDDY_API_KEY:?Missing protected CircleCI environment variable BUILDBUDDY_API_KEY}"
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=sandium/android-arm64/ci
            cd src/brave
            python3 ci/siso/write_buildbuddy_env.py
            if grep -Fq "$BUILDBUDDY_API_KEY" .env; then
              echo "BuildBuddy API key unexpectedly appears in generated .env"
              exit 1
            fi
            git check-ignore -q .env
            cd "$HOME/project"
            grep -Fxq 'rbe_service=remote.buildbuddy.io:443' src/brave/.env
            grep -Fxq 'projects_chrome_custom_vars_reapi_instance=sandium/android-arm64/ci' src/brave/.env
            grep -Fxq 'use_remoteexec=false' src/brave/.env
            echo "REMOTE_EXECUTION_CONFIGURED_FOR_SYNC_ONLY=true"
            echo "REMOTE_EXECUTION_AND_CACHE_USAGE=REQUIRES_GENERATED_ARGS_AND_SISO_STATS"

jobs:
  stage-1-source-foundation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - run:
          name: Verify source pins before any expensive work
          command: |
            set -euo pipefail
            cd src/brave
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"
            python3 - \<<'PY'
            import json
            from pathlib import Path
            p=json.loads(Path("package.json").read_text())
            actual=(p["version"],p["config"]["projects"]["chrome"]["tag"])
            expected=("1.100.10","156.0.8078.39")
            print("BRAVE_CORE_VERSION="+actual[0])
            print("CHROMIUM_PIN="+actual[1])
            if actual != expected: raise SystemExit(f"Expected {expected}, got {actual}")
            PY
      - restore-sandium-source
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Synchronize pinned source and dependencies with shallow history
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            cd src/brave
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=sandium/android-arm64/ci
            python3 ci/siso/write_buildbuddy_env.py
            pnpm run sync --target_os=android --target_arch=arm64 --no-history
            cd "$HOME/project"
            sudo ./src/brave/src/build/install-build-deps.sh --android
            python3 - \<<'PY'
            import re, shutil
            from pathlib import Path
            text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            if actual != "156.0.8078.39":
                raise SystemExit(f"Chromium pin mismatch: {actual}")
            free = shutil.disk_usage(".").free
            print(f"FREE_DISK_AFTER_SYNC_BYTES={free}")
            if free < 20 * 1024**3:
                raise SystemExit("Less than 20 GiB free after source sync")
            PY
            mkdir -p build-diagnostics
            git -C src/brave/src rev-parse HEAD > build-diagnostics/chromium-commit.txt
            python3 - \<<'PY'
            import hashlib, json
            from pathlib import Path
            p = Path("src/brave/src/chrome/VERSION")
            manifest = {
              "schema": 2,
              "chromium_commit": __import__("subprocess").check_output(["git","-C","src/brave/src","rev-parse","HEAD"], text=True).strip(),
              "chromium_version": "156.0.8078.39",
              "version_file_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "target": "android-arm64-debug-apk"
            }
            Path(".sandium-source-cache-manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
            PY
      - run:
          name: Verify Chromium-only cache boundary
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/brave/src/chrome/VERSION
            test "$(git -C src/brave/src rev-parse HEAD)" = "$(cat build-diagnostics/chromium-commit.txt)"
            echo "CACHE_ROOT=src/brave/src"
            echo "FRESH_BRAVE_CORE_CHECKOUT_EXCLUDED=true"
      - run:
          name: Record source-cache footprint before save
          command: |
            set -euo pipefail
            du -sb src/brave/src | awk '{print "SOURCE_CACHE_BYTES=" $1}'
            df -B1 . | tail -n 1
      - save_cache:
          key: sandium-pnpm-v1-{{ .Branch }}-{{ checksum "src/brave/pnpm-lock.yaml" }}-{{ .BuildNum }}
          paths:
            - src/brave/node_modules
            - ~/.local/share/pnpm/store
      - save_cache:
          key: sandium-src-v3-chromium-156.0.8078.39-{{ .BuildNum }}
          paths:
            - src/brave/src
            - src/brave/.brave_gclient
            - src/brave/.brave_gclient_entries
            - src/brave/.gclient_entries
            - .sandium-source-cache-manifest.json
      - run:
          name: Confirm source-cache save request
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/brave/src/chrome/VERSION
            echo "SOURCE_CACHE_SAVE_REQUESTED=true"
            echo "CACHE_SAVE_IS_NOT_YET_PROVEN_UNTIL_NEXT_RUN_RESTORES_IT=true"
      - store_artifacts:
          path: build-diagnostics
          destination: stage-1-source-foundation

  stage-2-graph-and-compile-window:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - restore-sandium-source
      - restore-sandium-build-output
      - run:
          name: Skip compilation when reusable Chromium output already has an APK
          command: |
            set -euo pipefail
            if python3 src/brave/ci/siso/build_state.py check --mode compiled --commit "$CIRCLE_SHA1"; then
              echo "REUSABLE_APK_FOUND=true; skipping compilation setup in this stage"
              circleci-agent step halt
            fi
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse the pinned Brave Node dependency tree
          command: |
            set -euo pipefail
            cd src/brave
            pnpm install --frozen-lockfile --prefer-offline
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Validate fingerprint, configure GN and compile window 1
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            p=Path("src/brave/src/chrome/VERSION").read_text()
            fields=dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$",p,re.M))
            v=".".join(fields[k] for k in ("MAJOR","MINOR","BUILD","PATCH"))
            if v != "156.0.8078.39": raise SystemExit("Invalid Chromium pin")
            Path("build-diagnostics/fingerprint.json").write_text(json.dumps({
              "brave_core_commit":subprocess.check_output(["git","-C","src/brave","rev-parse","HEAD"],text=True).strip(),
              "chromium_commit":subprocess.check_output(["git","-C","src/brave/src","rev-parse","HEAD"],text=True).strip(),
              "chromium_version":v,"target":"android-arm64","config":"Debug","format":"apk",
              "siso_revision":"c574896b272b40aac6e44c228ee0b471ea7e3d7d",
              "build_command_args":["Debug","--target_os=android","--target_arch=arm64","--target_android_output_format=apk","--use_remoteexec","true","--gn","use_siso:true","--gn","use_reclient:false"]
            },indent=2)+"\n")
            PY
            cd src/brave
            set +e
            timeout --signal=INT --kill-after=30s 38m pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-1.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-1-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-1.log"
            evidence="$HOME/project/build-diagnostics/compile-window-1-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 124 ]]; then exit "$status"; fi
            echo "INTERMEDIATE_WINDOW_STOP_ACCEPTED=$status"
      - run:
          name: Validate effective GN flags and checkpoint Stage-2 output
          command: |
            set -euo pipefail
            ARGS=src/brave/src/out/android_Debug_arm64/args.gn
            if [[ ! -s "$ARGS" ]]; then
              echo "Expected generated GN arguments at $ARGS."
              find src/brave/src/out -name args.gn -type f -print || true
              exit 4
            fi
            status="$(cat build-diagnostics/compile-window-1-exit.txt)"
            COMPLETE=false
            if [[ "$status" == "0" || -s src/brave/src/out/android_Debug_arm64/apks/Bravearm64.apk ]]; then
              COMPLETE=true
            fi
            python3 src/brave/ci/siso/build_state.py record --commit "$CIRCLE_SHA1" --stage stage-2 --compile-complete "$COMPLETE" --artifact-verified auto --log build-diagnostics/compile-window-1.log
            python3 src/brave/ci/siso/build_state.py fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
      - save_cache:
          key: sandium-out-v1-{{ .Branch }}-chromium-156.0.8078.39-android-debug-arm64-stage2-{{ .BuildNum }}
          paths:
            - src/brave/src/out/android_Debug_arm64
      - store_artifacts:
          path: build-diagnostics
          destination: stage-2-compile-window

  stage-3-compile-continuation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - restore-sandium-source
      - restore-sandium-build-output
      - run:
          name: Skip compilation when reusable Chromium output already has an APK
          command: |
            set -euo pipefail
            if python3 src/brave/ci/siso/build_state.py check --mode compiled --commit "$CIRCLE_SHA1"; then
              echo "REUSABLE_APK_FOUND=true; skipping compilation setup in this stage"
              circleci-agent step halt
            fi
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse the pinned Brave Node dependency tree
          command: |
            set -euo pipefail
            cd src/brave
            pnpm install --frozen-lockfile --prefer-offline
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Compile window 2 using same target and remote action cache
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            version_text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", version_text, re.M))
            version = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            actual = {
              "brave_core_commit": subprocess.check_output(["git", "-C", "src/brave", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_commit": subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_version": version, "target": "android-arm64", "config": "Debug", "format": "apk",
              "siso_revision": "c574896b272b40aac6e44c228ee0b471ea7e3d7d",
              "build_command_args": ["Debug", "--target_os=android", "--target_arch=arm64", "--target_android_output_format=apk", "--use_remoteexec", "true", "--gn", "use_siso:true", "--gn", "use_reclient:false"]
            }
            fingerprint = Path("build-diagnostics/fingerprint.json")
            if not fingerprint.is_file():
                raise SystemExit("Stage 2 fingerprint missing from workspace.")
            expected = json.loads(fingerprint.read_text())
            stable_keys = ("brave_core_commit", "chromium_commit", "chromium_version", "target", "config", "format", "siso_revision", "build_command_args")
            if any(actual.get(key) != expected.get(key) for key in stable_keys):
                raise SystemExit(f"Build input fingerprint mismatch: expected={expected}, actual={actual}")
            if not expected.get("gn_args_sha256"):
                raise SystemExit("Stage 2 GN argument fingerprint is missing.")
            print("BUILD_INPUT_FINGERPRINT_MATCHES_STAGE_2=PASS")
            PY
            cd src/brave
            set +e
            timeout --signal=INT --kill-after=30s 38m pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-2.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-2-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-2.log"
            evidence="$HOME/project/build-diagnostics/compile-window-2-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 124 ]]; then exit "$status"; fi
            echo "INTERMEDIATE_WINDOW_STOP_ACCEPTED=$status"
      - run:
          name: Verify generated GN arguments against Stage 2
          command: |
            set -euo pipefail
            ARGS=src/brave/src/out/android_Debug_arm64/args.gn
            if [[ ! -s "$ARGS" ]]; then
              echo "Expected generated GN arguments at $ARGS."
              find src/brave/src/out -name args.gn -type f -print || true
              exit 4
            fi
            python3 - "$ARGS" build-diagnostics/fingerprint.json \<<'PY'
            import hashlib, json, sys
            from pathlib import Path
            args_path = Path(sys.argv[1])
            fingerprint = json.loads(Path(sys.argv[2]).read_text())
            actual = hashlib.sha256(args_path.read_bytes()).hexdigest()
            expected = fingerprint.get("gn_args_sha256")
            print("GN_ARGS_PATH=" + str(args_path))
            print("GN_ARGS_SHA256=" + actual)
            if not expected or actual != expected:
                raise SystemExit(f"GN arguments changed between stages: expected={expected}, actual={actual}")
            print("GN_ARGS_FINGERPRINT_MATCH=PASS")
            PY
      - store_artifacts:
          path: build-diagnostics
          destination: stage-3-compile-continuation

  stage-4-finish-and-package:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - restore-sandium-source
      - restore-sandium-build-output
      - install-sandium-node
      - restore-sandium-pnpm-cache
      - run:
          name: Reuse the pinned Brave Node dependency tree
          command: |
            set -euo pipefail
            cd src/brave
            pnpm install --frozen-lockfile --prefer-offline
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Finish compilation and require APK
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics sandium-output
            python3 - \<<'PY'
            import json, re, subprocess
            from pathlib import Path
            version_text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", version_text, re.M))
            version = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            actual = {
              "brave_core_commit": subprocess.check_output(["git", "-C", "src/brave", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_commit": subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_version": version, "target": "android-arm64", "config": "Debug", "format": "apk",
              "siso_revision": "c574896b272b40aac6e44c228ee0b471ea7e3d7d",
              "build_command_args": ["Debug", "--target_os=android", "--target_arch=arm64", "--target_android_output_format=apk", "--use_remoteexec", "true", "--gn", "use_siso:true", "--gn", "use_reclient:false"]
            }
            fingerprint = Path("build-diagnostics/fingerprint.json")
            if not fingerprint.is_file():
                raise SystemExit("Stage 2 fingerprint missing from workspace.")
            expected = json.loads(fingerprint.read_text())
            stable_keys = ("brave_core_commit", "chromium_commit", "chromium_version", "target", "config", "format", "siso_revision", "build_command_args")
            if any(actual.get(key) != expected.get(key) for key in stable_keys):
                raise SystemExit(f"Final build input fingerprint mismatch: expected={expected}, actual={actual}")
            if not expected.get("gn_args_sha256"):
                raise SystemExit("Stage 2 GN argument fingerprint is missing.")
            print("FINAL_BUILD_INPUT_FINGERPRINT_MATCHES_STAGE_2=PASS")
            PY
            cd src/brave
            set +e
            timeout --signal=INT --kill-after=30s 38m pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-3.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-3-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-3.log"
            evidence="$HOME/project/build-diagnostics/compile-window-3-remote-cache-log-candidates.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 0 ]]; then
              echo "Final compile window did not complete successfully (status=$status)"
              exit "$status"
            fi
            cd "$HOME/project"
            ARGS=src/brave/src/out/android_Debug_arm64/args.gn
            if [[ ! -s "$ARGS" ]]; then
              echo "Expected generated GN arguments at $ARGS."
              find src/brave/src/out -name args.gn -type f -print || true
              exit 4
            fi
            python3 - "$ARGS" build-diagnostics/fingerprint.json \<<'PY'
            import hashlib, json, sys
            from pathlib import Path
            args_path = Path(sys.argv[1])
            fingerprint = json.loads(Path(sys.argv[2]).read_text())
            actual = hashlib.sha256(args_path.read_bytes()).hexdigest()
            expected = fingerprint.get("gn_args_sha256")
            print("GN_ARGS_PATH=" + str(args_path))
            print("GN_ARGS_SHA256=" + actual)
            if not expected or actual != expected:
                raise SystemExit(f"GN arguments changed between stages: expected={expected}, actual={actual}")
            print("GN_ARGS_FINGERPRINT_MATCH=PASS")
            PY
            mapfile -t apks < <(find src/brave/src/out -type f -path '*/apks/Bravearm64.apk' -size +1M -print)
            if [[ "${#apks[@]}" -ne 1 ]]; then
              echo "Expected exactly one Bravearm64.apk, found ${#apks[@]}"
              find src/brave/src/out -type f -path '*/apks/*.apk' -printf '%p %s bytes\n' || true
              exit 3
            fi
            cp "${apks[0]}" sandium-output/Brave-debug-arm64.apk
            SDK=src/brave/src/third_party/android_sdk
            AAPT="$(find "$SDK" -type f -name aapt -perm -111 -print -quit 2>/dev/null || true)"
            APKSIGNER="$(find "$SDK" -type f -name apksigner -perm -111 -print -quit 2>/dev/null || true)"
            test -n "$AAPT" && test -n "$APKSIGNER" || { echo "Missing aapt or apksigner from the synced Android SDK."; exit 5; }
            "$AAPT" dump badging sandium-output/Brave-debug-arm64.apk > sandium-output/apk-badging.txt
            "$APKSIGNER" verify --verbose sandium-output/Brave-debug-arm64.apk > sandium-output/apksigner-verify.txt 2>&1
            python3 - sandium-output/Brave-debug-arm64.apk sandium-output/build-manifest.json "$CIRCLE_SHA1" \<<'PY'
            import hashlib, json, re, subprocess, sys, zipfile
            from pathlib import Path
            apk = Path(sys.argv[1])
            manifest_path = Path(sys.argv[2])
            source_commit = sys.argv[3]
            with zipfile.ZipFile(apk) as z:
                if z.testzip() is not None:
                    raise SystemExit("APK ZIP CRC integrity failed")
                names = set(z.namelist())
                if "AndroidManifest.xml" not in names:
                    raise SystemExit("APK is missing AndroidManifest.xml")
                if not any(name.startswith("classes") and name.endswith(".dex") for name in names):
                    raise SystemExit("APK is missing DEX bytecode")
            badging = Path("sandium-output/apk-badging.txt").read_text()
            match = re.search(r"^package: name='([^']+)'", badging, re.M)
            if not match:
                raise SystemExit("Cannot parse package name from aapt badging output")
            version_text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", version_text, re.M))
            chromium_version = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            if chromium_version != "156.0.8078.39":
                raise SystemExit(f"Unexpected Chromium version in APK source tree: {chromium_version}")
            fingerprint = json.loads(Path("build-diagnostics/fingerprint.json").read_text())
            manifest = {
                "source_commit": source_commit,
                "brave_core_commit": subprocess.check_output(["git", "-C", "src/brave", "rev-parse", "HEAD"], text=True).strip(),
                "chromium_commit": subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip(),
                "chromium_version": chromium_version,
                "android_target": "arm64",
                "build_config": "Debug",
                "artifact": apk.name,
                "apk_bytes": apk.stat().st_size,
                "apk_sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
                "app_package_name": match.group(1),
                "apk_zip_integrity": "PASS",
                "dalvik_bytecode_present": True,
                "apksigner_verification": "PASS",
                "build_fingerprint": fingerprint,
                "remote_execution_usage": "Must be established from compile logs; configuration is not proof"
            }
            manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
            print("APK_BYTES=" + str(manifest["apk_bytes"]))
            print("APK_SHA256=" + manifest["apk_sha256"])
            print("APK_PACKAGE=" + manifest["app_package_name"])
            print("APK_SIGNATURE_VERIFICATION=PASS")
            PY
            sha256sum sandium-output/Brave-debug-arm64.apk | tee sandium-output/sha256.txt
      - persist_to_workspace:
          root: .
          paths:
            - sandium-output/Brave-debug-arm64.apk
            - sandium-output/sha256.txt
            - sandium-output/build-manifest.json
            - sandium-output/apk-badging.txt
            - sandium-output/apksigner-verify.txt
      - store_artifacts:
          path: build-diagnostics
          destination: stage-4-finish-build

  stage-5-verify-publish:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Verify final APK, package metadata and signature record
          command: |
            set -euo pipefail
            python3 - \<<'PY'
            import hashlib, json, re, zipfile
            from pathlib import Path
            output = Path("sandium-output")
            apk = output / "Brave-debug-arm64.apk"
            manifest = json.loads((output / "build-manifest.json").read_text())
            expected_hash = (output / "sha256.txt").read_text().split()[0]
            actual_hash = hashlib.sha256(apk.read_bytes()).hexdigest()
            if actual_hash != expected_hash or actual_hash != manifest.get("apk_sha256"):
                raise SystemExit("APK SHA-256 does not match both Stage-4 records")
            if apk.stat().st_size != manifest.get("apk_bytes"):
                raise SystemExit("APK size does not match build manifest")
            with zipfile.ZipFile(apk) as archive:
                if archive.testzip() is not None:
                    raise SystemExit("APK ZIP CRC failure")
                names = set(archive.namelist())
                if "AndroidManifest.xml" not in names:
                    raise SystemExit("Missing AndroidManifest.xml")
                if not any(name.startswith("classes") and name.endswith(".dex") for name in names):
                    raise SystemExit("Missing DEX bytecode")
            badging = (output / "apk-badging.txt").read_text()
            match = re.search(r"^package: name='([^']+)'", badging, re.M)
            if not match or match.group(1) != manifest.get("app_package_name"):
                raise SystemExit("APK package metadata does not match build manifest")
            if manifest.get("apksigner_verification") != "PASS" or not (output / "apksigner-verify.txt").is_file():
                raise SystemExit("Stage-4 APK signature verification evidence is missing")
            if manifest.get("apk_zip_integrity") != "PASS" or manifest.get("dalvik_bytecode_present") is not True:
                raise SystemExit("Build manifest lacks required APK integrity checks")
            print("APK_INTEGRITY=PASS")
            print("APK_SIGNATURE_VERIFICATION=PASS")
            print("APK_PACKAGE=" + match.group(1))
            print("APK_SHA256=" + actual_hash)
            PY
      - store_artifacts:
          path: sandium-output
          destination: sandium-verified-android-debug-apk

workflows:
  sandium-android-debug-apk:
    when: << pipeline.parameters.run_sandium_android_apk_build >>
    jobs:
      - stage-1-source-foundation
      - stage-2-graph-and-compile-window:
          requires:
            - stage-1-source-foundation
      - stage-3-compile-continuation:
          requires:
            - stage-2-graph-and-compile-window
      - stage-4-finish-and-package:
          requires:
            - stage-3-compile-continuation
      - stage-5-verify-publish:
          requires:
            - stage-4-finish-and-package

# Isolated SANDIUM source-cache test only. No Chromium compilation/APK build.
version: 2.1

parameters:
  run_source_cache_test:
    type: boolean
    default: false
  save_source_cache:
    type: boolean
    default: true
  require_source_cache_restore:
    type: boolean
    default: false

jobs:
  source-cache-only:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - run:
          name: Install pinned Node and pnpm
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential ca-certificates curl python-is-python3 python3-setuptools xz-utils
            NODE_VERSION=24.16.0
            curl --fail --location --silent --show-error "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            sudo mkdir -p /opt/sandium-node
            sudo tar -xJf /tmp/node.tar.xz -C /opt/sandium-node --strip-components=1
            echo "export PATH=/opt/sandium-node/bin:\$PATH" >> "$BASH_ENV"
            export PATH="/opt/sandium-node/bin:$PATH"
            node --version
            npm install --global pnpm@11.11.0
            pnpm --version
      - restore_cache:
          keys:
            - sandium-src-v3-chromium-156.0.8078.39-
      - run:
          name: Verify restored cache or perform source-only sync
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            if [[ -f src/brave/src/chrome/VERSION ]]; then
              echo "SOURCE_CACHE_RESULT=RESTORED"
              python3 - -\<<'PY'
            import hashlib, json, subprocess, re
            from pathlib import Path
            version_file = Path("src/brave/src/chrome/VERSION")
            text = version_file.read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            if actual != "156.0.8078.39":
                raise SystemExit(f"Unexpected restored Chromium version: {actual}")
            manifest_path = Path(".sandium-source-cache-manifest.json")
            if not manifest_path.is_file():
                raise SystemExit("Restored cache has no manifest.")
            manifest = json.loads(manifest_path.read_text())
            commit = subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip()
            digest = hashlib.sha256(version_file.read_bytes()).hexdigest()
            if manifest.get("schema") != 2 or manifest.get("chromium_version") != actual or manifest.get("chromium_commit") != commit or manifest.get("version_file_sha256") != digest:
                raise SystemExit("Restored source cache manifest does not match the checkout.")
            print("SOURCE_CACHE_MANIFEST_VALID=PASS")
            print("RESTORED_CHROMIUM_COMMIT=" + commit)
            PY
              echo "SOURCE_CACHE_REUSE=PASS"
            else
              echo "SOURCE_CACHE_RESULT=COLD_MISS"
              if [[ "<< pipeline.parameters.require_source_cache_restore >>" == "true" ]]; then
                echo "REQUIRED_SOURCE_CACHE_RESTORE=MISSING"
                exit 42
              fi
              cd src/brave
              pnpm run sync --target_os=android --target_arch=arm64 --no-history
              cd "$HOME/project"
              test -f src/brave/src/chrome/VERSION
              python3 - -\<<'PY'
            import hashlib, json, subprocess, re
            from pathlib import Path
            version_file = Path("src/brave/src/chrome/VERSION")
            text = version_file.read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            if actual != "156.0.8078.39":
                raise SystemExit(f"Unexpected synced Chromium version: {actual}")
            manifest = {
              "schema": 2,
              "chromium_commit": subprocess.check_output(["git","-C","src/brave/src","rev-parse","HEAD"], text=True).strip(),
              "chromium_version": actual,
              "version_file_sha256": hashlib.sha256(version_file.read_bytes()).hexdigest(),
              "target": "android-arm64-debug-apk"
            }
            Path(".sandium-source-cache-manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
            print("SOURCE_SYNC=PASS")
            print("SYNCED_CHROMIUM_COMMIT=" + manifest["chromium_commit"])
            PY
              echo "SOURCE_CACHE_SAVE_REQUESTED=true"
            fi
            du -sh src/brave/src
            df -h .
      - when:
          condition: << pipeline.parameters.save_source_cache >>
          steps:
            - save_cache:
                key: sandium-src-v3-chromium-156.0.8078.39-{{ .BuildNum }}
                paths:
                  - src/brave/src
                  - src/brave/.brave_gclient
                  - src/brave/.brave_gclient_entries
                  - src/brave/.gclient_entries
                  - .sandium-source-cache-manifest.json
      - store_artifacts:
          path: build-diagnostics
          destination: source-cache-only

workflows:
  source-cache-only-test:
    when: << pipeline.parameters.run_source_cache_test >>
    jobs:
      - source-cache-only

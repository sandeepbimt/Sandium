version: 2.1

# SANDIUM BARE-ONLY CI CONTRACT
# Five-stage Bare APK attempt; each stage is source-pinned, time-bounded and
# publishes source-sync, Git trace, Siso, metrics and artifact diagnostics.
# Existing CircleCI project, BuildBuddy endpoint/instance and protected secret
# assignment are reused; no credentials are recreated or caches are deleted.

parameters:
  run_sandium_bare_source_preflight:
    type: boolean
    default: false
  run_sandium_bare_source_ready:
    type: boolean
    default: false
  run_sandium_bare_android_apk_build:
    type: boolean
    default: false
  run_sandium_bare_apk_once:
    type: boolean
    default: false

jobs:
  sandium-bare-source-preflight:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - run:
          name: Validate Bare adapter syntax, pins and unit tests
          command: |
            set -euo pipefail
            cd "$HOME/project/sandium-control"
            # GitHub/CircleCI checkouts may materialize this script without its executable bit.
            # Normalize the checked-out working-tree mode before validating the helper.
            test -f ci/siso/buildbuddy-credential-helper.py
            chmod 0755 ci/siso/buildbuddy-credential-helper.py
            test -x ci/siso/buildbuddy-credential-helper.py || { echo "SANDIUM_CREDENTIAL_HELPER_EXECUTABLE=FAIL" >&2; exit 1; }
            echo "SANDIUM_CREDENTIAL_HELPER_EXECUTABLE=PASS"
            python3 -m py_compile ci/bare/*.py ci/siso/*.py
            python3 ci/bare/test_siso_output_path_guard.py
            bash -n ci/bare/run_stage.sh
            bash -n ci/bare/prepare_source.sh
            bash -n ci/bare/bootstrap_chromium.sh
            bash -n ci/bare/package_artifact.sh
            python3 ci/bare/build_identity.py --help >/dev/null
            python3 ci/bare/configure_siso.py --help >/dev/null
            python3 ci/bare/checkpoint.py --help >/dev/null
            python3 ci/bare/stage_ledger.py --help >/dev/null
            python3 ci/bare/state_handoff.py --help >/dev/null
            python3 ci/bare/output_checkpoint.py --help >/dev/null
            python3 ci/bare/compiled_output_reuse_preflight.py --help >/dev/null
            python3 ci/bare/fast_apk.py --help >/dev/null
            python3 ci/bare/cache_fingerprint.py --help >/dev/null
            python3 ci/bare/source_cache_fingerprint.py --help >/dev/null
            python3 ci/bare/test_remaining_work.py
            python3 ci/bare/test_stage_work_gate.py
            python3 ci/bare/test_build_identity.py
            python3 ci/bare/test_stage_ledger.py
            python3 ci/bare/test_state_handoff.py
            python3 ci/bare/test_output_checkpoint.py
            python3 ci/bare/test_compiled_output_reuse_preflight.py
            python3 ci/bare/test_fast_apk.py
            python3 ci/bare/stage_contract.py
            grep -Fxq 'bare_commit=a5a7ef74f3b77d45720b8c502cbacc30f2f3dbd5' ci/bare/source-pin.txt
            grep -Fxq 'chromium_commit=1228231501697ff7a4a0150ea8ae6df37bb99331' ci/bare/source-pin.txt
            grep -Fxq 'chromium_version=156.0.8078.25' ci/bare/source-pin.txt
            grep -Fxq 'artifact_name=Sandium-debug-arm64.apk' ci/bare/source-pin.txt
            echo "SANDIUM_BARE_ADAPTER_SYNTAX=PASS"
            echo "SANDIUM_BARE_SOURCE_PINS=PASS"
            echo "CHROMIUM_SYNC_RUN=no"
            echo "GN_GENERATION_RUN=no"
            echo "COMPILATION_RUN=no"
            echo "APK_BUILD_RUN=no"
      - run:
          name: Inspect pinned Bare patch series and extension checksum
          command: |
            set -euo pipefail
            cd "$HOME/project/sandium-control"
            bash ci/bare/prepare_source.sh inspect
            python3 ci/bare/write_cache_identity.py
            test -s "$HOME/project/.sandium-bare-cache-identity.txt"
            test ! -e "$HOME/project/.gclient"
            test ! -e "$HOME/project/src"
            echo "SANDIUM_BARE_CACHE_IDENTITY=PASS"
            echo "CHROMIUM_CHECKOUT_CREATED=no"
            echo "EXISTING_CACHE_DATA_MODIFIED=no"

  sandium-bare-build-stage:
    parameters:
      stage_index:
        type: integer
    machine:
      image: ubuntu-2204:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - run:
          name: Start the full stage budget clock before any cache restore
          command: |
            set -euo pipefail
            date +%s > "$HOME/project/.sandium-stage-start-epoch"
            echo "SANDIUM_STAGE_INDEX=<< parameters.stage_index >>"
            echo "SANDIUM_STAGE_LIMIT_SECONDS=$([[ "<< parameters.stage_index >>" == "5" ]] && echo 3300 || echo 2820)"
            echo "SANDIUM_EXPENSIVE_APK_OPT_IN=EXPLICIT_PIPELINE_PARAMETER_REQUIRED"
      - run:
          name: Fingerprint source and build cache inputs
          command: |
            set -euo pipefail
            cd "$HOME/project"
            python3 sandium-control/ci/bare/source_cache_fingerprint.py --root "$HOME/project"
            python3 sandium-control/ci/bare/cache_fingerprint.py --root "$HOME/project"
            python3 sandium-control/ci/bare/output_cache_fingerprint.py --root "$HOME/project"
      - when:
          condition:
            equal: [1, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Prefer a verified APK, then the highest green stage state; ignore failed legacy stages
                keys:
                  - sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-5-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-4-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-3-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-2-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-1-
                  # One-time migration fallback: use only legacy Stage 1 state, never old failed Stage 2-5 entries.
                  - sandium-state-v3-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-1-
      - when:
          condition:
            equal: [2, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore Stage 1 APK/status metadata
                keys:
                  - sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-1-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - when:
          condition:
            equal: [3, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore Stage 2 APK/status metadata
                keys:
                  - sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-2-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - when:
          condition:
            equal: [4, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore Stage 3 APK/status metadata
                keys:
                  - sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-3-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - when:
          condition:
            equal: [5, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore Stage 4 APK/status metadata
                keys:
                  - sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-
                  - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-4-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - run:
          name: Reuse a verified APK before restoring the multi-gigabyte build output
          command: |
            set -euo pipefail
            set +e
            python3 "$HOME/project/sandium-control/ci/bare/fast_apk.py" \
              --root "$HOME/project" \
              --stage "<< parameters.stage_index >>" \
              --workflow-id "${CIRCLE_WORKFLOW_ID:-unknown}"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "SANDIUM_VERIFIED_APK_FAST_EXIT=true"
              circleci-agent step halt
            fi
            if [[ "$rc" -eq 1 ]]; then
              echo "SANDIUM_VERIFIED_APK_FAST_EXIT=false"
              exit 0
            fi
            echo "SANDIUM_VERIFIED_APK_FAST_EXIT=FAIL" >&2
            exit "$rc"
      - when:
          condition:
            equal: [1, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore the best green validated compiled-output checkpoint, stage 5 first
                keys:
                  # Prefer green checkpoints across all stages before considering interrupted runs.
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-5-
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-4-
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-3-
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-2-
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-1-
                  # Cross-fingerprint green fallback; exact source/build identity is still validated.
                  - sandium-output-good-v5-
                  # Explicit known-good legacy Stage 1 cache also precedes failed-stage caches.
                  - sandium-output-v3-McWgpQGHbvqEhFrJMdzVRrgSxHmI0HTzIzAXcMFauVo=-stage-1-
                  # Only if no green checkpoint exists, try interrupted snapshots, newest stage first.
                  - sandium-output-partial-v1-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-5-
                  - sandium-output-partial-v1-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-4-
                  - sandium-output-partial-v1-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-3-
                  - sandium-output-partial-v1-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-2-
                  - sandium-output-partial-v1-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-1-
                  - sandium-output-partial-v1-
      - when:
          condition:
            equal: [2, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore full compiled outputs from this workflow's Stage 1
                keys:
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-1-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - when:
          condition:
            equal: [3, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore full compiled outputs from this workflow's Stage 2
                keys:
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-2-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - when:
          condition:
            equal: [4, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore full compiled outputs from this workflow's Stage 3
                keys:
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-3-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - when:
          condition:
            equal: [5, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore full compiled outputs from this workflow's Stage 4
                keys:
                  - sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-4-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - run:
          name: Verify restored compiled-output checkpoint before source-cache work
          command: |
            set -euo pipefail
            ROOT="$HOME/project"
            CHECKPOINT="$ROOT/sandium-build-output-checkpoint"
            META="$CHECKPOINT/.sandium-output-checkpoint.meta.json"
            echo "SANDIUM_OUTPUT_CHECKPOINT_DIAGNOSTIC_STAGE=<< parameters.stage_index >>"
            echo "SANDIUM_OUTPUT_CHECKPOINT_DIAGNOSTIC_WORKFLOW=${CIRCLE_WORKFLOW_ID:-unknown}"
            echo "SANDIUM_OUTPUT_CHECKPOINT_DIAGNOSTIC_ROOT=$ROOT"
            echo "SANDIUM_OUTPUT_CHECKPOINT_DIAGNOSTIC_FINGERPRINT_FILE=$ROOT/sandium-control/.sandium-output-cache-fingerprint.txt"
            if [[ -s "$ROOT/sandium-control/.sandium-output-cache-fingerprint.txt" ]]; then
              sha256sum "$ROOT/sandium-control/.sandium-output-cache-fingerprint.txt"
              sed -n '1,3p' "$ROOT/sandium-control/.sandium-output-cache-fingerprint.txt"
            else
              echo "SANDIUM_OUTPUT_CHECKPOINT_FINGERPRINT_FILE=ABSENT"
            fi
            if [[ -L "$CHECKPOINT" ]]; then
              echo "SANDIUM_OUTPUT_CHECKPOINT_PATH_KIND=SYMLINK"
              ls -ld "$CHECKPOINT" || true
              exit 59
            elif [[ ! -e "$CHECKPOINT" ]]; then
              echo "SANDIUM_OUTPUT_CHECKPOINT_PATH_KIND=MISSING"
              echo "SANDIUM_OUTPUT_CHECKPOINT_RESTORE=MISS_OR_WRONG_PATH"
              ls -ld "$ROOT" || true
              find "$ROOT" -maxdepth 1 -mindepth 1 -name '*checkpoint*' -printf '%y %p\n' 2>/dev/null || true
              exit 59
            elif [[ ! -d "$CHECKPOINT" ]]; then
              echo "SANDIUM_OUTPUT_CHECKPOINT_PATH_KIND=NOT_DIRECTORY"
              stat "$CHECKPOINT" || true
              exit 59
            fi
            echo "SANDIUM_OUTPUT_CHECKPOINT_PATH_KIND=DIRECTORY"
            ls -ld "$CHECKPOINT"
            find "$CHECKPOINT" -maxdepth 1 -mindepth 1 -printf '%y %f %s bytes\n' | sed -n '1,30p'
            if [[ ! -f "$META" || -L "$META" ]]; then
              echo "SANDIUM_OUTPUT_CHECKPOINT_METADATA=ABSENT_OR_UNSAFE"
              exit 59
            fi
            echo "SANDIUM_OUTPUT_CHECKPOINT_METADATA=FOUND"
            stat -c 'metadata_bytes=%s metadata_mtime=%y' "$META"
            if [[ "<< parameters.stage_index >>" == "1" ]]; then
              python3 "$ROOT/sandium-control/ci/bare/output_checkpoint.py" preflight --root "$ROOT" --stage 1 --workflow-id "${CIRCLE_WORKFLOW_ID:-unknown}" --preserve-on-miss
            else
              python3 "$ROOT/sandium-control/ci/bare/output_checkpoint.py" preflight --root "$ROOT" --stage "<< parameters.stage_index >>" --workflow-id "${CIRCLE_WORKFLOW_ID:-unknown}" --required
            fi
            echo "SANDIUM_OUTPUT_CHECKPOINT_EARLY_PREFLIGHT=PASS"
      - restore_cache:
          name: Restore the pinned Chromium/Bare source and dependency cache
          keys:
            # Stable key: pinned source identity only, unaffected by CI-script edits.
            - sandium-source-v3-{{ checksum "sandium-control/.sandium-source-cache-fingerprint.txt" }}
            # Compatibility fallback for the already-saved 17 GiB v2 source cache.
            # Bootstrap pin checks still validate restored source before use.
            - sandium-source-v2-
      - run:
          name: Fail closed if a continuation stage lost its source cache
          command: |
            set -euo pipefail
            if [[ "<< parameters.stage_index >>" -gt 1 ]]; then
              test -d "$HOME/project/src/.git" || { echo "SANDIUM_SOURCE_CACHE=FAIL missing Chromium .git; refusing repeated cold sync" >&2; exit 42; }
              test -d "$HOME/project/bare-browser/.git" || { echo "SANDIUM_SOURCE_CACHE=FAIL missing pinned Bare checkout; refusing repeated cold sync" >&2; exit 42; }
              test -s "$HOME/project/.gclient" || { echo "SANDIUM_SOURCE_CACHE=FAIL missing .gclient; refusing repeated cold sync" >&2; exit 42; }
              test -s "$HOME/project/.gclient_entries" || { echo "SANDIUM_SOURCE_CACHE=FAIL missing .gclient_entries; refusing repeated cold sync" >&2; exit 42; }
              test -x "$HOME/depot_tools/gclient" || { echo "SANDIUM_SOURCE_CACHE=FAIL missing depot_tools; refusing repeated cold sync" >&2; exit 42; }
              echo "SANDIUM_SOURCE_CACHE=PASS continuation source reuse"
            elif [[ -d "$HOME/project/src/.git" ]]; then
              test -s "$HOME/project/.gclient" && test -s "$HOME/project/.gclient_entries" || { echo "SANDIUM_SOURCE_CACHE=FAIL incomplete restored source cache" >&2; exit 42; }
              echo "SANDIUM_SOURCE_CACHE=HIT stage-1"
            else
              echo "SANDIUM_SOURCE_CACHE=MISS stage-1 cold source sync is permitted once"
            fi
      - run:
          name: Validate or prepare pinned Chromium source without configuring GN
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            bash "$HOME/project/sandium-control/ci/bare/run_stage.sh" --prepare-source "<< parameters.stage_index >>"
      - when:
          condition:
            equal: [1, << parameters.stage_index >>]
          steps:
            - save_cache:
                name: Save the synchronized source tree before generated build output exists
                key: sandium-source-v3-{{ checksum "sandium-control/.sandium-source-cache-fingerprint.txt" }}
                paths:
                  - src
                  - .gclient
                  - .gclient_entries
                  - bare-browser
                  - /home/circleci/depot_tools
      - run:
          name: Build one bounded incremental window of the pinned Bare APK
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            bash "$HOME/project/sandium-control/ci/bare/run_stage.sh" "<< parameters.stage_index >>"
          teardown:
            - run:
                name: Preserve validated partial output on failure/cancel/timeout
                command: |
                  set +e
                  ROOT="$HOME/project"
                  CONTROL="$ROOT/sandium-control"
                  export PATH="$HOME/depot_tools:$ROOT/src/buildtools/linux64:$PATH"
                  if [[ ! -d "$ROOT/sandium-build-output-checkpoint" && -d "$ROOT/src/out/android_Debug_arm64" ]]; then
                    python3 "$CONTROL/ci/bare/output_checkpoint.py" pack-partial \
                      --root "$ROOT" --stage "<< parameters.stage_index >>" \
                      --workflow-id "${CIRCLE_WORKFLOW_ID:-unknown}" \
                      > "$ROOT/stage-<< parameters.stage_index >>-partial-checkpoint.log" 2>&1
                    rc=$?
                    echo "SANDIUM_PARTIAL_CHECKPOINT_EXIT_CODE=$rc"
                    cat "$ROOT/stage-<< parameters.stage_index >>-partial-checkpoint.log" 2>/dev/null || true
                  fi
                  if [[ -d "$ROOT/sandium-build-output-checkpoint" && ! -L "$ROOT/sandium-build-output-checkpoint" ]]; then
                    python3 "$CONTROL/ci/bare/checkpoint_quality.py" \
                      --root "$ROOT" --control "$CONTROL" \
                      --stage "<< parameters.stage_index >>" \
                      --workflow-id "${CIRCLE_WORKFLOW_ID:-unknown}" \
                      --allow-partial --produced
                    rc=$?
                    echo "SANDIUM_PARTIAL_CHECKPOINT_QUALITY_EXIT_CODE=$rc"
                  else
                    echo "SANDIUM_PARTIAL_CHECKPOINT_QUALITY=SKIP no safely packed checkpoint"
                  fi
                  exit 0
            - save_cache:
                name: Save validated partial outputs so the next Stage 1 resumes instead of restarting
                when: on_fail
                key: sandium-output-partial-v1-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-<< parameters.stage_index >>-{{ .Environment.CIRCLE_WORKFLOW_ID }}-{{ .BuildNum }}
                paths:
                  - sandium-build-output-checkpoint
            - save_cache:
                name: Save only a quality-validated green compiled-output checkpoint for reuse
                when: on_success
                key: sandium-output-good-v5-{{ checksum "sandium-control/.sandium-output-cache-fingerprint.txt" }}-stage-<< parameters.stage_index >>-{{ .Environment.CIRCLE_WORKFLOW_ID }}-{{ .BuildNum }}
                paths:
                  - sandium-build-output-checkpoint
            - save_cache:
                name: Save only successful stage metadata and state capsule for future selection
                when: on_success
                key: sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-<< parameters.stage_index >>-{{ .Environment.CIRCLE_WORKFLOW_ID }}-{{ .BuildNum }}
                paths:
                  - ci-handoff/stage-<< parameters.stage_index >>
                  - sandium-output
                  - sandium-stage-state.tar.zst
                  - sandium-stage-state.meta
                  - sandium-state-handoff-report.json
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-driver.log
                destination: diagnostics/stage-<< parameters.stage_index >>/driver.log
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-siso.log
                destination: diagnostics/stage-<< parameters.stage_index >>/siso.log
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-metrics.jsonl
                destination: diagnostics/stage-<< parameters.stage_index >>/metrics.jsonl
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-partial-checkpoint.log
                destination: diagnostics/stage-<< parameters.stage_index >>/partial-checkpoint.log
      - store_artifacts:
          name: Upload stage driver and Siso diagnostics
          path: stage-<< parameters.stage_index >>-driver.log
          destination: diagnostics/stage-<< parameters.stage_index >>/driver.log
      - store_artifacts:
          name: Upload compiled-output reuse dry-run and dirty-reason diagnostics
          path: stage-<< parameters.stage_index >>-reuse-preflight.log
          destination: diagnostics/stage-<< parameters.stage_index >>/reuse-preflight.log
      - store_artifacts:
          name: Upload no-build dirty-reason explanation when reuse fails
          path: stage-<< parameters.stage_index >>-reuse-explain.log
          destination: diagnostics/stage-<< parameters.stage_index >>/reuse-explain.log
      - store_artifacts:
          name: Upload Siso metrics
          path: stage-<< parameters.stage_index >>-metrics.jsonl
          destination: diagnostics/stage-<< parameters.stage_index >>/metrics.jsonl
      - store_artifacts:
          name: Upload Siso manifest preflight log when present
          path: stage-<< parameters.stage_index >>-manifest-preflight.log
          destination: diagnostics/stage-<< parameters.stage_index >>/manifest-preflight.log
      - store_artifacts:
          name: Upload Chromium fetch log when present
          path: sandium-fetch.log
          destination: diagnostics/stage-<< parameters.stage_index >>/fetch.log
      - store_artifacts:
          name: Upload gclient sync log when present
          path: sandium-gclient-sync.log
          destination: diagnostics/stage-<< parameters.stage_index >>/gclient-sync.log
      - store_artifacts:
          name: Upload gclient configuration log
          path: sandium-gclient-config.log
          destination: diagnostics/stage-<< parameters.stage_index >>/gclient-config.log
      - store_artifacts:
          name: Upload Git subprocess trace
          path: sandium-git-trace.log
          destination: diagnostics/stage-<< parameters.stage_index >>/git-trace.log
      - store_artifacts:
          name: Upload state handoff report
          path: sandium-state-handoff-report.json
          destination: diagnostics/stage-<< parameters.stage_index >>/state-handoff-report.json
      - store_artifacts:
          name: Upload stage ledger/status
          path: ci-handoff/stage-<< parameters.stage_index >>
          destination: diagnostics/stage-<< parameters.stage_index >>/handoff
      - store_artifacts:
          name: Upload APK and manifest when available
          path: sandium-output
          destination: artifacts/stage-<< parameters.stage_index >>


  sandium-bare-apk-required:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - run:
          name: Compute the build cache fingerprint before final artifact restore
          command: |
            set -euo pipefail
            python3 "$HOME/project/sandium-control/ci/bare/cache_fingerprint.py" --root "$HOME/project"
      - restore_cache:
          name: Restore final-stage source-bound ledger
          keys:
            - sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-
            - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-5-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
            - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-5-
            - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-4-
            - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-3-
            - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-2-
            - sandium-state-good-v4-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-1-
            # Legacy migration fallback is restricted to the known-good Stage 1 candidate.
            - sandium-state-v3-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-stage-1-
      - run:
          name: Require a verified APK from the five-stage build
          command: |
            set -euo pipefail
            STATUS="$HOME/project/ci-handoff/stage-5/status.txt"
            test -s "$STATUS" || { echo "SANDIUM_FINAL_APK_GATE=FAIL missing stage-5 status" >&2; exit 1; }
            cat "$STATUS"
            grep -qx "BUILD_FINISHED=true" "$STATUS" || { echo "SANDIUM_FINAL_APK_GATE=FAIL no verified APK after five stages" >&2; exit 1; }
            grep -qx "APK_ARCHIVE_VALID=true" "$STATUS"
            grep -qx "APK_SIGNATURE_VERIFIED=true" "$STATUS"
            APK="$HOME/project/sandium-output/Sandium-debug-arm64.apk"
            MANIFEST="$HOME/project/sandium-output/build-manifest.json"
            test -s "$APK" || { echo "SANDIUM_FINAL_APK_GATE=FAIL APK file is missing" >&2; exit 1; }
            test -s "$MANIFEST" || { echo "SANDIUM_FINAL_APK_GATE=FAIL build manifest is missing" >&2; exit 1; }
            python3 "$HOME/project/sandium-control/ci/bare/verify_final_apk.py" "$STATUS" "$APK" "$MANIFEST"
            echo "SANDIUM_FINAL_APK_GATE=PASS"
      - save_cache:
          name: Publish a verified APK cache for future five-stage fast paths
          key: sandium-verified-apk-v1-{{ checksum "sandium-control/.sandium-cache-fingerprint.txt" }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-{{ .BuildNum }}
          paths:
            - sandium-output
            - ci-handoff/stage-5
            - sandium-state-handoff-report.json


workflows:
  sandium-bare-source-preflight:
    when: << pipeline.parameters.run_sandium_bare_source_preflight >>
    jobs:
      - sandium-bare-source-preflight

  # Expensive APK builds are isolated to the dedicated build branch and require
  # an explicit pipeline parameter; review-branch pushes cannot launch them.
  sandium-bare-apk-once:
    when:
      and:
        - equal: [build/bare-apk-once-20261025, << pipeline.git.branch >>]
        - << pipeline.parameters.run_sandium_bare_apk_once >>
    jobs:
      - sandium-bare-build-stage:
          name: sandium-bare-stage-1
          stage_index: 1
      - sandium-bare-build-stage:
          name: sandium-bare-stage-2
          stage_index: 2
          requires:
            - sandium-bare-stage-1
      - sandium-bare-build-stage:
          name: sandium-bare-stage-3
          stage_index: 3
          requires:
            - sandium-bare-stage-2
      - sandium-bare-build-stage:
          name: sandium-bare-stage-4
          stage_index: 4
          requires:
            - sandium-bare-stage-3
      - sandium-bare-build-stage:
          name: sandium-bare-stage-5
          stage_index: 5
          requires:
            - sandium-bare-stage-4
      - sandium-bare-apk-required:
          requires:
            - sandium-bare-stage-5

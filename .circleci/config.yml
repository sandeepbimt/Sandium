      - run:
          name: Prepare source overlay and branding before GN
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            cd src/brave
            set +e
            pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true --gn use_siso:true --gn use_reclient:false --prepare_only 2>&1 | tee "$HOME/project/build-diagnostics/prepare-only.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/prepare-only-exit.txt"
            if [[ "$status" -ne 0 ]]; then

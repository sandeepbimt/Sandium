version: 2.1

# SANDIUM BARE-ONLY CI CONTRACT
# This branch intentionally exposes only a source-level preflight. The full
# five-stage build is not ready until source/output persistence and cache handover
# are proven. Do not copy old source-specific workflows into this config.
# Existing CircleCI project, BuildBuddy endpoint/instance, protected secret
# assignment and cache service are reused; no credentials or caches are recreated.

parameters:
  run_sandium_bare_source_preflight:
    type: boolean
    default: false
  run_sandium_bare_source_ready:
    type: boolean
    default: false
  run_sandium_bare_android_apk_build:
    type: boolean
    default: false

jobs:
  sandium-bare-source-preflight:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - run:
          name: Validate Bare adapter syntax, pins and unit tests
          command: |
            set -euo pipefail
            cd "$HOME/project/sandium-control"
            python3 -m py_compile \
              ci/bare/build_identity.py \
              ci/bare/configure_siso.py \
              ci/bare/checkpoint.py \
              ci/bare/stage_ledger.py \
              ci/bare/write_cache_identity.py \
              ci/bare/test_build_identity.py \
              ci/bare/stage_contract.py \
              ci/bare/test_stage_ledger.py
            bash -n ci/bare/run_stage.sh
            bash -n ci/bare/prepare_source.sh
            bash -n ci/bare/bootstrap_chromium.sh
            bash -n ci/bare/package_artifact.sh
            python3 ci/bare/build_identity.py --help >/dev/null
            python3 ci/bare/configure_siso.py --help >/dev/null
            python3 ci/bare/checkpoint.py --help >/dev/null
            python3 ci/bare/stage_ledger.py --help >/dev/null
            python3 ci/bare/test_build_identity.py
            python3 ci/bare/test_stage_ledger.py
            python3 ci/bare/stage_contract.py
            grep -Fxq 'bare_commit=a5a7ef74f3b77d45720b8c502cbacc30f2f3dbd5' ci/bare/source-pin.txt
            grep -Fxq 'chromium_commit=1228231501697ff7a4a0150ea8ae6df37bb99331' ci/bare/source-pin.txt
            grep -Fxq 'chromium_version=156.0.8078.25' ci/bare/source-pin.txt
            grep -Fxq 'artifact_name=Sandium-debug-arm64.apk' ci/bare/source-pin.txt
            echo "SANDIUM_BARE_ADAPTER_SYNTAX=PASS"
            echo "SANDIUM_BARE_SOURCE_PINS=PASS"
            echo "CHROMIUM_SYNC_RUN=no"
            echo "GN_GENERATION_RUN=no"
            echo "COMPILATION_RUN=no"
            echo "APK_BUILD_RUN=no"
      - run:
          name: Inspect pinned Bare patch series and extension checksum
          command: |
            set -euo pipefail
            cd "$HOME/project/sandium-control"
            bash ci/bare/prepare_source.sh inspect
            python3 ci/bare/write_cache_identity.py
            test -s "$HOME/project/.sandium-bare-cache-identity.txt"
            test ! -e "$HOME/project/.gclient"
            test ! -e "$HOME/project/src"
            echo "SANDIUM_BARE_CACHE_IDENTITY=PASS"
            echo "CHROMIUM_CHECKOUT_CREATED=no"
            echo "EXISTING_CACHE_DATA_MODIFIED=no"

  sandium-bare-build-not-ready:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - run:
          name: Fail closed until the Bare five-stage pipeline is reviewed
          command: |
            echo "SANDIUM_BARE_FULL_BUILD=BLOCKED"
            echo "Reason: the five-stage workflow has not yet been wired to the Bare source identity/checkpoint adapters."
            echo "The current CircleCI account's ability to persist the Chromium source and build output within existing limits is not proven."
            echo "No Chromium sync, compilation, APK packaging, credential mutation or cache deletion was attempted."
            exit 78

  sandium-bare-build-stage:
    parameters:
      stage_index:
        type: integer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - when:
          condition:
            not:
              equal: [1, << parameters.stage_index >>]
          steps:
            - attach_workspace:
                at: .
      - run:
          name: Record bounded stage start time
          command: |
            set -euo pipefail
            echo "export STAGE_START_TS=$(date +%s)" >> "$BASH_ENV"
            echo "SANDIUM_STAGE_INDEX=<< parameters.stage_index >>"
      - when:
          condition:
            not:
              equal: [1, << parameters.stage_index >>]
          steps:
            - run:
                name: Skip later stages if the APK is already verified
                command: |
                  set -euo pipefail
                  STATUS="$HOME/project/ci-handoff/stage-$((<< parameters.stage_index >>-1))/status.txt"
                  if grep -qx 'BUILD_FINISHED=true' "$STATUS"; then
                    cat "$STATUS"
                    echo "SANDIUM_APK_FAST_EXIT=true"
                    circleci-agent step halt
                  fi
      - run:
          name: Run source-pinned Siso compilation slice
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            bash "$HOME/project/sandium-control/ci/bare/run_stage.sh" "<< parameters.stage_index >>"
      - when:
          condition: always
          steps:
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-driver.log
                destination: sandium-build/stage-<< parameters.stage_index >>/driver.log
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-siso.log
                destination: sandium-build/stage-<< parameters.stage_index >>/siso.log
            - store_artifacts:
                path: stage-<< parameters.stage_index >>-metrics.jsonl
                destination: sandium-build/stage-<< parameters.stage_index >>/siso-metrics.jsonl
            - store_artifacts:
                path: ci-handoff/stage-<< parameters.stage_index >>
                destination: sandium-build/stage-<< parameters.stage_index >>/ledger-status
            - store_artifacts:
                path: sandium-output
                destination: sandium-build/stage-<< parameters.stage_index >>/artifact-and-manifest
      - persist_to_workspace:
          root: .
          paths:
            - ci-handoff/stage-<< parameters.stage_index >>

  sandium-bare-apk-required:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - attach_workspace:
          at: .
      - run:
          name: Require a verified APK from one of the five stages
          command: |
            set -euo pipefail
            for stage in 1 2 3 4 5; do
              STATUS="$HOME/project/ci-handoff/stage-$stage/status.txt"
              if grep -qx 'BUILD_FINISHED=true' "$STATUS" 2>/dev/null; then
                cat "$STATUS"
                echo "SANDIUM_FINAL_APK_GATE=PASS stage=$stage"
                exit 0
              fi
            done
            echo "SANDIUM_FINAL_APK_GATE=FAIL no stage produced a signature-verified APK." >&2
            exit 1


workflows:
  sandium-bare-source-preflight:
    when: << pipeline.parameters.run_sandium_bare_source_preflight >>
    jobs:
      - sandium-bare-source-preflight

  sandium-bare-android-apk:
    when:
      and:
        - << pipeline.parameters.run_sandium_bare_source_ready >>
        - << pipeline.parameters.run_sandium_bare_android_apk_build >>
    jobs:
      - sandium-bare-build-not-ready

  # Explicitly isolated, single-use build lane. All ordinary branches and workflows
  # remain fail-closed; only pushing this dedicated branch starts this APK attempt.
  sandium-bare-apk-once:
    when:
      equal: [build/bare-apk-once-20261025, << pipeline.git.branch >>]
    jobs:
      - sandium-bare-build-stage:
          name: sandium-bare-stage-1
          stage_index: 1
      - sandium-bare-build-stage:
          name: sandium-bare-stage-2
          stage_index: 2
          requires:
            - sandium-bare-stage-1
      - sandium-bare-build-stage:
          name: sandium-bare-stage-3
          stage_index: 3
          requires:
            - sandium-bare-stage-2
      - sandium-bare-build-stage:
          name: sandium-bare-stage-4
          stage_index: 4
          requires:
            - sandium-bare-stage-3
      - sandium-bare-build-stage:
          name: sandium-bare-stage-5
          stage_index: 5
          requires:
            - sandium-bare-stage-4
      - sandium-bare-apk-required:
          requires:
            - sandium-bare-stage-5

      - run:
          name: Final incremental compile window 4 with Siso remote execution
          no_output_timeout: 1h
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics sandium-output
            OUT=src/out/android_Debug_arm64
            STATE=src/brave/ci/siso/build_state.py
            LOG="$HOME/project/build-diagnostics/compile-window-4.log"
            status=0
            if python3 "$STATE" check --mode compiled --commit "$CIRCLE_SHA1"; then
              echo "FINAL_COMPILE_SKIPPED=COMPLETED_COMPILE_STATE"
              : > "$LOG"
            else
              python3 "$STATE" fingerprint --commit "$CIRCLE_SHA1" | tee build-diagnostics/validated-build-fingerprint.txt
              cd src/brave
              set +e
            started_at="$(cat "$HOME/.sandium-stage-start-epoch")"
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            remaining_compile_seconds="$(( 3300 - elapsed_seconds - 300 ))"
            if [[ "$remaining_compile_seconds" -le 0 ]]; then
              echo "STAGE_TIME_BUDGET_EXHAUSTED: elapsed=${elapsed_seconds}s; refusing to compile without handover margin"
              exit 5
            fi
            echo "STAGE_ELAPSED_BEFORE_COMPILE_SECONDS=$elapsed_seconds"
            echo "COMPILE_WINDOW_SECONDS=$remaining_compile_seconds"
              # Recheck critical Brave GN inputs immediately before Siso starts.
              for required in \
                "$HOME/project/src/brave/third_party/bip39wally-core-native/BUILD.gn" \
                "$HOME/project/src/brave/vendor/bat-native-tweetnacl/BUILD.gn" \
                "$HOME/project/$OUT/build.ninja" \
                "$HOME/project/$OUT/build.ninja.stamp"; do
                if [[ ! -s "$required" ]]; then
                  echo "SANDIUM_PRECOMPILE_INPUT_GATE=FAIL missing=$required"
                  exit 43
                fi
              done
              echo "SANDIUM_PRECOMPILE_INPUT_GATE=PASS brave_gn_deps_and_prepared_graph_present=true"
              BUILD_FORCE_GN_GEN=()
              if [[ "${SANDIUM_BUILD_OUTPUT_CACHE_HIT:-false}" != "true" ]]; then
                echo "GN_GRAPH_MODE=FRESHLY_PREPARED_BEFORE_COMPILE"
              else
                echo "GN_GRAPH_MODE=REUSE_RESTORED_CHECKPOINT"
              fi
              python3 "$HOME/project/src/brave/ci/siso/run_compile_window.py" --root "$HOME/project" --stage stage-4 --stage-start-epoch-file "$HOME/.sandium-stage-start-epoch" --max-stage-seconds 3300 --handover-reserve-seconds 300 --metrics-poll-interval-seconds 15
              status=$?
              set -e
              echo "$status" > "$HOME/project/build-diagnostics/compile-window-4-exit.txt"
              if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
                echo "COMPILE_WINDOW_FAILURE_DEFERRED_FOR_CHECKPOINT=$status"
              fi
              if [[ "$status" -eq 124 ]]; then
                echo "FINAL_COMPILE_WINDOW_TIMED_OUT=124; preserving partial output for the next run"
              fi
              cd "$HOME/project"
            fi
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)|local:[[:space:]]*[0-9]+[[:space:]]+remote:' "$LOG" > build-diagnostics/compile-window-4-remote-cache-log-candidates.txt; then
              echo "REMOTE_CACHE_LOG_MATCHES=$(wc -l < build-diagnostics/compile-window-4-remote-cache-log-candidates.txt)"
            else
              : > build-diagnostics/compile-window-4-remote-cache-log-candidates.txt
              echo "REMOTE_CACHE_LOG_MATCHES=NO_MATCHING_LINES"
            fi
            COMPLETE=false
            if [[ "$status" -eq 0 || -s "$OUT/apks/Bravearm64.apk" ]]; then
              COMPLETE=true
            fi
            python3 "$STATE" record --commit "$CIRCLE_SHA1" --stage stage-4 --compile-complete "$COMPLETE" --artifact-verified auto --log "$LOG"
            if [[ -s "$OUT/apks/Bravearm64.apk" && "$(stat -c %s "$OUT/apks/Bravearm64.apk")" -ge 1000000 ]]; then
              python3 src/brave/ci/siso/package_apk.py --commit "$CIRCLE_SHA1" --stage stage-4
            else
              echo "APK_NOT_YET_AVAILABLE=stage-4; output cache will be kept for the next run"

version: 2.1

# SANDIUM BARE-ONLY CI CONTRACT
# Bare-only source migration. Full APK builds stay disabled until source preflight
# and existing BuildBuddy/Siso integration review are complete.
# Existing CircleCI project, BuildBuddy endpoint/instance and protected secret
# assignment are reused; no credentials are recreated or caches deleted.

parameters:
  run_sandium_bare_source_preflight:
    type: boolean
    default: false
  run_sandium_bare_source_ready:
    type: boolean
    default: false
  run_sandium_bare_android_apk_build:
    type: boolean
    default: false
  run_sandium_bare_apk_once:
    type: boolean
    default: false

jobs:
  sandium-bare-source-preflight:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - run:
          name: Validate Bare adapter syntax, pins and unit tests
          command: |
            set -euo pipefail
            cd "$HOME/project/sandium-control"
            python3 -m py_compile \
              ci/bare/build_identity.py \
              ci/bare/configure_siso.py \
              ci/bare/checkpoint.py \
              ci/bare/stage_ledger.py \
              ci/bare/write_cache_identity.py \
              ci/bare/test_build_identity.py \
              ci/bare/stage_contract.py \
              ci/bare/test_stage_ledger.py
            bash -n ci/bare/run_stage.sh
            bash -n ci/bare/prepare_source.sh
            bash -n ci/bare/bootstrap_chromium.sh
            bash -n ci/bare/package_artifact.sh
            python3 ci/bare/build_identity.py --help >/dev/null
            python3 ci/bare/configure_siso.py --help >/dev/null
            python3 ci/bare/checkpoint.py --help >/dev/null
            python3 ci/bare/stage_ledger.py --help >/dev/null
            python3 ci/bare/test_build_identity.py
            python3 ci/bare/test_stage_ledger.py
            python3 ci/bare/stage_contract.py
            grep -Fxq 'bare_commit=a5a7ef74f3b77d45720b8c502cbacc30f2f3dbd5' ci/bare/source-pin.txt
            grep -Fxq 'chromium_commit=1228231501697ff7a4a0150ea8ae6df37bb99331' ci/bare/source-pin.txt
            grep -Fxq 'chromium_version=156.0.8078.25' ci/bare/source-pin.txt
            grep -Fxq 'artifact_name=Sandium-debug-arm64.apk' ci/bare/source-pin.txt
            echo "SANDIUM_BARE_ADAPTER_SYNTAX=PASS"
            echo "SANDIUM_BARE_SOURCE_PINS=PASS"
            echo "CHROMIUM_SYNC_RUN=no"
            echo "GN_GENERATION_RUN=no"
            echo "COMPILATION_RUN=no"
            echo "APK_BUILD_RUN=no"
      - run:
          name: Inspect pinned Bare patch series and extension checksum
          command: |
            set -euo pipefail
            cd "$HOME/project/sandium-control"
            bash ci/bare/prepare_source.sh inspect
            python3 ci/bare/write_cache_identity.py
            test -s "$HOME/project/.sandium-bare-cache-identity.txt"
            test ! -e "$HOME/project/.gclient"
            test ! -e "$HOME/project/src"
            echo "SANDIUM_BARE_CACHE_IDENTITY=PASS"
            echo "CHROMIUM_CHECKOUT_CREATED=no"
            echo "EXISTING_CACHE_DATA_MODIFIED=no"

  sandium-bare-build-stage:
    parameters:
      stage_index:
        type: integer
    machine:
      image: ubuntu-2204:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: sandium-control
      - when:
          condition:
            equal: [2, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore stage 1 checkpoint and ledger
                keys:
                  - sandium-bare-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
      - when:
          condition:
            equal: [3, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore stage 2 checkpoint and ledger
                keys:
                  - sandium-bare-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-2
      - when:
          condition:
            equal: [4, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore stage 3 checkpoint and ledger
                keys:
                  - sandium-bare-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-3
      - when:
          condition:
            equal: [5, << parameters.stage_index >>]
          steps:
            - restore_cache:
                name: Restore stage 4 checkpoint and ledger
                keys:
                  - sandium-bare-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-4
      - run:
          name: Run Bare Android APK stage << parameters.stage_index >> of 5
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            export STAGE_START_TS="$(date +%s)"
            bash "$HOME/project/sandium-control/ci/bare/run_stage.sh" "<< parameters.stage_index >>"
      - save_cache:
          name: Save checkpoint and stage ledger
          key: sandium-bare-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-<< parameters.stage_index >>
          paths:
            - sandium-bare-checkpoint.tar.zst
            - sandium-bare-checkpoint.meta
            - ci-handoff/stage-<< parameters.stage_index >>
            - sandium-output
      - store_artifacts:
          name: Upload stage driver and Siso logs
          path: stage-<< parameters.stage_index >>-driver.log
          destination: diagnostics/stage-<< parameters.stage_index >>/driver.log
      - store_artifacts:
          name: Upload Siso metrics
          path: stage-<< parameters.stage_index >>-metrics.jsonl
          destination: diagnostics/stage-<< parameters.stage_index >>/metrics.jsonl
      - store_artifacts:
          name: Upload Chromium fetch log when present
          path: sandium-fetch.log
          destination: diagnostics/stage-<< parameters.stage_index >>/fetch.log
      - store_artifacts:
          name: Upload gclient sync log when present
          path: sandium-gclient-sync.log
          destination: diagnostics/stage-<< parameters.stage_index >>/gclient-sync.log
      - store_artifacts:
          name: Upload gclient configuration log
          path: sandium-gclient-config.log
          destination: diagnostics/stage-<< parameters.stage_index >>/gclient-config.log
      - store_artifacts:
          name: Upload Git subprocess trace
          path: sandium-git-trace.log
          destination: diagnostics/stage-<< parameters.stage_index >>/git-trace.log
      - store_artifacts:
          name: Upload build output and handoff ledger
          path: ci-handoff/stage-<< parameters.stage_index >>
          destination: diagnostics/stage-<< parameters.stage_index >>/handoff
      - store_artifacts:
          name: Upload packaged APK and manifest when available
          path: sandium-output
          destination: artifacts/stage-<< parameters.stage_index >>


workflows:
  sandium-bare-source-preflight:
    when: << pipeline.parameters.run_sandium_bare_source_preflight >>
    jobs:
      - sandium-bare-source-preflight

  # Explicitly approved five-stage APK attempt on the isolated review branch.
  sandium-bare-apk-once:
    when:
      and:
        - equal: [fix/bare-stage-handoff-review, << pipeline.git.branch >>]
        - << pipeline.parameters.run_sandium_bare_apk_once >>
    jobs:
      - sandium-bare-build-stage:
          name: sandium-bare-stage-1
          stage_index: 1
      - sandium-bare-build-stage:
          name: sandium-bare-stage-2
          stage_index: 2
          requires:
            - sandium-bare-stage-1
      - sandium-bare-build-stage:
          name: sandium-bare-stage-3
          stage_index: 3
          requires:
            - sandium-bare-stage-2
      - sandium-bare-build-stage:
          name: sandium-bare-stage-4
          stage_index: 4
          requires:
            - sandium-bare-stage-3
      - sandium-bare-build-stage:
          name: sandium-bare-stage-5
          stage_index: 5
          requires:
            - sandium-bare-stage-4

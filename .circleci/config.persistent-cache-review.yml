# REVIEW ONLY: this file is not the active CircleCI config.
# It deliberately lives at a non-default path and does not trigger CI.
# Review the workflow and run the offline validation before copying into config.yml.

version: 2.1

parameters:
  run_sandium_android_apk_build:
    type: boolean
    default: false

commands:
  install-sandium-node:
    steps:
      - run:
          name: Install pinned Node and pnpm
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential ca-certificates curl python-is-python3 python3-setuptools xz-utils
            NODE_VERSION=24.16.0
            curl --fail --location --silent --show-error "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            sudo mkdir -p /opt/sandium-node
            sudo tar -xJf /tmp/node.tar.xz -C /opt/sandium-node --strip-components=1
            echo "export PATH=/opt/sandium-node/bin:\$PATH" >> "$BASH_ENV"
            export PATH="/opt/sandium-node/bin:$PATH"
            node --version
            npm install --global pnpm@11.11.0
            pnpm --version

  restore-sandium-source:
    steps:
      - restore_cache:
          keys:
            - sandium-src-v3-chromium-156.0.8078.39-
      - run:
          name: Validate restored Chromium source cache or record cold start
          command: |
            set -euo pipefail
            if [[ -f src/brave/src/chrome/VERSION ]]; then
              python3 - <<'PY'
            import json, re, subprocess
            from pathlib import Path
            text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            print("RESTORED_CHROMIUM_VERSION=" + actual)
            if actual != "156.0.8078.39":
                raise SystemExit("Source cache pin mismatch; refusing to build from it.")
            manifest_path = Path(".sandium-source-cache-manifest.json")
            if not manifest_path.is_file():
                raise SystemExit("Source cache manifest missing; refusing to build.")
            manifest = json.loads(manifest_path.read_text())
            chromium_sha = subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip()
            version_sha256 = __import__("hashlib").sha256(Path("src/brave/src/chrome/VERSION").read_bytes()).hexdigest()
            if manifest.get("schema") != 2:
                raise SystemExit("Unsupported source-cache manifest schema.")
            if manifest.get("chromium_version") != actual:
                raise SystemExit("Source-cache manifest version does not match the checked-out source.")
            if manifest.get("chromium_commit") != chromium_sha:
                raise SystemExit("Cached Chromium commit does not match manifest.")
            if manifest.get("version_file_sha256") != version_sha256:
                raise SystemExit("Cached Chromium VERSION file hash does not match manifest.")
            print("SOURCE_CACHE_FINGERPRINT=PASS")
            print("SOURCE_CACHE_SCOPE=CHROMIUM_ONLY")
            PY
            else
              echo "SOURCE_CACHE=COLD_MISS"
              if [[ "${CIRCLE_JOB:-}" != "stage-1-source-foundation" ]]; then
                echo "Required source cache missing in a compile stage."
                exit 2
              fi
            fi

  install-sandium-android-build-deps:
    steps:
      - run:
          name: Install Android build dependencies on this fresh machine
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            test -x src/brave/src/build/install-build-deps.sh
            sudo src/brave/src/build/install-build-deps.sh --android
            echo "ANDROID_BUILD_DEPS_INSTALLED_ON_CURRENT_JOB=true"

  configure-sandium-remote-cache:
    steps:
      - run:
          name: Configure SANDIUM-only BuildBuddy backend
          command: |
            set -euo pipefail
            : "${BUILDBUDDY_API_KEY:?Missing protected CircleCI environment variable BUILDBUDDY_API_KEY}"
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=sandium/android-arm64/ci
            cd src/brave
            python3 ci/siso/write_buildbuddy_env.py
            if grep -Fq "$BUILDBUDDY_API_KEY" .env; then
              echo "BuildBuddy API key unexpectedly appears in generated .env"
              exit 1
            fi
            git check-ignore -q .env
            cd "$HOME/project"
            grep -Fxq 'rbe_service=remote.buildbuddy.io:443' src/brave/.env
            grep -Fxq 'projects_chrome_custom_vars_reapi_instance=sandium/android-arm64/ci' src/brave/.env
            grep -Fxq 'use_remoteexec=false' src/brave/.env
            echo "REMOTE_EXECUTION_ENABLED_BY_BUILD_ARGUMENT=true"
            echo "REMOTE_CACHE_HITS=NOT_YET_PROVEN"

jobs:
  stage-1-source-foundation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - run:
          name: Verify source pins before any expensive work
          command: |
            set -euo pipefail
            cd src/brave
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"
            python3 - <<'PY'
            import json
            from pathlib import Path
            p=json.loads(Path("package.json").read_text())
            actual=(p["version"],p["config"]["projects"]["chrome"]["tag"])
            expected=("1.100.10","156.0.8078.39")
            print("BRAVE_CORE_VERSION="+actual[0])
            print("CHROMIUM_PIN="+actual[1])
            if actual != expected: raise SystemExit(f"Expected {expected}, got {actual}")
            PY
      - restore-sandium-source
      - install-sandium-node
      - run:
          name: Synchronize pinned source and dependencies with shallow history
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            cd src/brave
            export SANDIUM_REAPI_ADDRESS=remote.buildbuddy.io:443
            export SANDIUM_REAPI_INSTANCE=sandium/android-arm64/ci
            python3 ci/siso/write_buildbuddy_env.py
            pnpm run sync --target_os=android --target_arch=arm64 --no-history
            cd "$HOME/project"
            sudo ./src/brave/src/build/install-build-deps.sh --android
            python3 - <<'PY'
            import re, shutil
            from pathlib import Path
            text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", text, re.M))
            actual = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            if actual != "156.0.8078.39":
                raise SystemExit(f"Chromium pin mismatch: {actual}")
            free = shutil.disk_usage(".").free
            print(f"FREE_DISK_AFTER_SYNC_BYTES={free}")
            if free < 20 * 1024**3:
                raise SystemExit("Less than 20 GiB free after source sync")
            PY
            mkdir -p build-diagnostics
            git -C src/brave/src rev-parse HEAD > build-diagnostics/chromium-commit.txt
            python3 - <<'PY'
            import hashlib, json
            from pathlib import Path
            p = Path("src/brave/src/chrome/VERSION")
            manifest = {
              "schema": 2,
              "chromium_commit": __import__("subprocess").check_output(["git","-C","src/brave/src","rev-parse","HEAD"], text=True).strip(),
              "chromium_version": "156.0.8078.39",
              "version_file_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "target": "android-arm64-debug-apk"
            }
            Path(".sandium-source-cache-manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
            PY
      - run:
          name: Verify Chromium-only cache boundary
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/brave/src/chrome/VERSION
            test "$(git -C src/brave/src rev-parse HEAD)" = "$(cat build-diagnostics/chromium-commit.txt)"
            echo "CACHE_ROOT=src/brave/src"
            echo "FRESH_BRAVE_CORE_CHECKOUT_EXCLUDED=true"
      - save_cache:
          key: sandium-src-v3-chromium-156.0.8078.39-{{ .BuildNum }}
          paths:
            - src/brave/src
            - src/brave/.brave_gclient
            - src/brave/.brave_gclient_entries
            - src/brave/.gclient_entries
            - .sandium-source-cache-manifest.json
      - run:
          name: Confirm source-cache save request
          command: |
            set -euo pipefail
            test -f src/brave/package.json
            test -f src/brave/src/chrome/VERSION
            echo "SOURCE_CACHE_SAVE_REQUESTED=true"
            echo "CACHE_SAVE_IS_NOT_YET_PROVEN_UNTIL_NEXT_RUN_RESTORES_IT=true"
      - store_artifacts:
          path: build-diagnostics
          destination: stage-1-source-foundation

  stage-2-graph-and-compile-window:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - restore-sandium-source
      - install-sandium-node
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Validate fingerprint, configure GN and compile window 1
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 - <<'PY'
            import json, re, subprocess
            from pathlib import Path
            p=Path("src/brave/src/chrome/VERSION").read_text()
            fields=dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$",p,re.M))
            v=".".join(fields[k] for k in ("MAJOR","MINOR","BUILD","PATCH"))
            if v != "156.0.8078.39": raise SystemExit("Invalid Chromium pin")
            Path("build-diagnostics/fingerprint.json").write_text(json.dumps({
              "brave_core_commit":subprocess.check_output(["git","-C","src/brave","rev-parse","HEAD"],text=True).strip(),
              "chromium_commit":subprocess.check_output(["git","-C","src/brave/src","rev-parse","HEAD"],text=True).strip(),
              "chromium_version":v,"target":"android-arm64","config":"Debug","format":"apk",
              "siso_revision":"c574896b272b40aac6e44c228ee0b471ea7e3d7d"
            },indent=2)+"\n")
            PY
            cd src/brave
            set +e
            timeout --signal=INT --kill-after=30s 42m pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-1.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-1-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-1.log"
            evidence="$HOME/project/build-diagnostics/compile-window-1-remote-cache-evidence.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_EVIDENCE_LINES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_EVIDENCE=NO_MATCHING_LOG_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 124 ]]; then exit "$status"; fi
            echo "INTERMEDIATE_WINDOW_STOP_ACCEPTED=$status"
      - persist_to_workspace:
          root: .
          paths:
            - build-diagnostics/fingerprint.json
      - store_artifacts:
          path: build-diagnostics
          destination: stage-2-compile-window

  stage-3-compile-continuation:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - attach_workspace:
          at: .
      - restore-sandium-source
      - install-sandium-node
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Compile window 2 using same target and remote action cache
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics
            python3 - <<'PY'
            import json, re, subprocess
            from pathlib import Path
            version_text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", version_text, re.M))
            version = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            actual = {
              "brave_core_commit": subprocess.check_output(["git", "-C", "src/brave", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_commit": subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_version": version, "target": "android-arm64", "config": "Debug", "format": "apk",
              "siso_revision": "c574896b272b40aac6e44c228ee0b471ea7e3d7d"
            }
            fingerprint = Path("build-diagnostics/fingerprint.json")
            if not fingerprint.is_file():
                raise SystemExit("Stage 2 fingerprint missing from workspace.")
            expected = json.loads(fingerprint.read_text())
            if actual != expected:
                raise SystemExit(f"Build fingerprint mismatch: expected={expected}, actual={actual}")
            print("BUILD_FINGERPRINT_MATCHES_STAGE_2=PASS")
            PY
            cd src/brave
            set +e
            timeout --signal=INT --kill-after=30s 42m pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-2.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-2-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-2.log"
            evidence="$HOME/project/build-diagnostics/compile-window-2-remote-cache-evidence.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_EVIDENCE_LINES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_EVIDENCE=NO_MATCHING_LOG_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 124 ]]; then exit "$status"; fi
            echo "INTERMEDIATE_WINDOW_STOP_ACCEPTED=$status"
      - store_artifacts:
          path: build-diagnostics
          destination: stage-3-compile-continuation

  stage-4-finish-and-package:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout:
          path: src/brave
      - attach_workspace:
          at: .
      - restore-sandium-source
      - install-sandium-node
      - install-sandium-android-build-deps
      - configure-sandium-remote-cache
      - run:
          name: Finish compilation and require APK
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p build-diagnostics sandium-output
            python3 - <<'PY'
            import json, re, subprocess
            from pathlib import Path
            version_text = Path("src/brave/src/chrome/VERSION").read_text()
            fields = dict(re.findall(r"^(MAJOR|MINOR|BUILD|PATCH)=(\d+)$", version_text, re.M))
            version = ".".join(fields[k] for k in ("MAJOR", "MINOR", "BUILD", "PATCH"))
            actual = {
              "brave_core_commit": subprocess.check_output(["git", "-C", "src/brave", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_commit": subprocess.check_output(["git", "-C", "src/brave/src", "rev-parse", "HEAD"], text=True).strip(),
              "chromium_version": version, "target": "android-arm64", "config": "Debug", "format": "apk",
              "siso_revision": "c574896b272b40aac6e44c228ee0b471ea7e3d7d"
            }
            fingerprint = Path("build-diagnostics/fingerprint.json")
            if not fingerprint.is_file():
                raise SystemExit("Stage 2 fingerprint missing from workspace.")
            expected = json.loads(fingerprint.read_text())
            if actual != expected:
                raise SystemExit(f"Build fingerprint mismatch: expected={expected}, actual={actual}")
            print("FINAL_STAGE_FINGERPRINT_MATCHES_STAGE_2=PASS")
            PY
            cd src/brave
            set +e
            timeout --signal=INT --kill-after=30s 42m pnpm run build Debug --target_os=android --target_arch=arm64 --target_android_output_format=apk --use_remoteexec true 2>&1 | tee "$HOME/project/build-diagnostics/compile-window-3.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$HOME/project/build-diagnostics/compile-window-3-exit.txt"
            log="$HOME/project/build-diagnostics/compile-window-3.log"
            evidence="$HOME/project/build-diagnostics/compile-window-3-remote-cache-evidence.txt"
            if grep -Eai 'remote.*(cache|execution)|cache.*(hit|miss|lookup)|action.*cache|siso.*(cache|remote)' "$log" > "$evidence"; then
              echo "REMOTE_CACHE_EVIDENCE_LINES=$(wc -l < "$evidence")"
              grep -Eai 'cache.*(hit|miss)|remote.*(cache|execution)' "$evidence" | tail -n 20 || true
            else
              echo "REMOTE_CACHE_EVIDENCE=NO_MATCHING_LOG_LINES"
              : > "$evidence"
            fi
            if [[ "$status" -ne 0 ]]; then
              echo "Final compile window did not complete successfully (status=$status)"
              exit "$status"
            fi
            cd "$HOME/project"
            mapfile -t apks < <(find src/brave/src/out -type f -path '*/apks/Bravearm64.apk' -size +1M -print)
            if [[ "${#apks[@]}" -ne 1 ]]; then
              echo "Expected exactly one Bravearm64.apk, found ${#apks[@]}"
              find src/brave/src/out -type f -path '*/apks/*.apk' -printf '%p %s bytes\n' || true
              exit 3
            fi
            cp "${apks[0]}" sandium-output/Brave-debug-arm64.apk
            sha256sum sandium-output/Brave-debug-arm64.apk | tee sandium-output/sha256.txt
      - persist_to_workspace:
          root: .
          paths:
            - sandium-output/Brave-debug-arm64.apk
            - sandium-output/sha256.txt
      - store_artifacts:
          path: build-diagnostics
          destination: stage-4-finish-build

  stage-5-verify-publish:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Verify final APK
          command: |
            set -euo pipefail
            python3 - <<'PY'
            import hashlib, zipfile
            from pathlib import Path
            apk=Path("sandium-output/Brave-debug-arm64.apk")
            expected=Path("sandium-output/sha256.txt").read_text().split()[0]
            actual=hashlib.sha256(apk.read_bytes()).hexdigest()
            if actual != expected: raise SystemExit("APK SHA-256 mismatch")
            with zipfile.ZipFile(apk) as z:
              if z.testzip() is not None: raise SystemExit("APK CRC failure")
              names=set(z.namelist())
              if "AndroidManifest.xml" not in names: raise SystemExit("Missing AndroidManifest.xml")
              if not any(n.startswith("classes") and n.endswith(".dex") for n in names): raise SystemExit("Missing DEX")
            print("APK_INTEGRITY=PASS")
            print("APK_SHA256="+actual)
            PY
      - store_artifacts:
          path: sandium-output
          destination: sandium-verified-android-debug-apk

workflows:
  sandium-android-debug-apk-review-only:
    when: << pipeline.parameters.run_sandium_android_apk_build >>
    jobs:
      - stage-1-source-foundation
      - stage-2-graph-and-compile-window:
          requires:
            - stage-1-source-foundation
      - stage-3-compile-continuation:
          requires:
            - stage-2-graph-and-compile-window
      - stage-4-finish-and-package:
          requires:
            - stage-3-compile-continuation
      - stage-5-verify-publish:
          requires:
            - stage-4-finish-and-package
